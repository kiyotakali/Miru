apply plugin: 'com.android.application'
apply plugin: 'com.chaquo.python'

def miruBuildPython = System.getenv('MIRU_BUILD_PYTHON')
if (!miruBuildPython) {
    miruBuildPython = [
        file('../../../.venv/bin/python'),
        file('../../../.venv/Scripts/python.exe')
    ].find { it.exists() }?.absolutePath
}

def miruRuntimeRoot = file('../../..')
def generatedMiruPythonDir = layout.buildDirectory.dir('generated/miruPython/main')
def syncMiruPythonRuntime = tasks.register('syncMiruPythonRuntime', Sync) {
    into(generatedMiruPythonDir)
    from(miruRuntimeRoot) {
        include '*.py'
        include 'agent_behavior.md'
        include 'soul.md'
        include 'manifest.json'
        include 'service-worker.js'
        include 'icon-192.png'
        include 'icon-512.png'
        include 'templates/**'
        include 'assets/banner.png'
        include 'assets/brand/**'
        include 'assets/js/**'
        include 'tools/**/*.py'
        include 'deploy/host_manager/**'
        include 'deploy/self_host/**'
        include 'scripts/host_manager.py'
        exclude '**/__pycache__/**'
        exclude 'test_week.py'
    }
}

android {
    namespace "com.miru.companion"
    compileSdk rootProject.ext.compileSdkVersion
    ndkVersion "27.3.13750724"
    defaultConfig {
        applicationId "com.miru.companion"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 7
        versionName "1.3.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++14'
            }
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    // Share Live2D model assets with DMG — canonical source is project-root
    // assets/live2d/. Merged into APK assets at build time so the native
    // Cubism loader still resolves "Hiyori/..." from AssetManager.
    sourceSets {
        main {
            assets.srcDirs += [file('../../../assets/live2d')]
        }
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

chaquopy {
    defaultConfig {
        version = "3.12"
        extractPackages('*')
        if (miruBuildPython) {
            buildPython(miruBuildPython)
        }
        pip {
            install('-r', '../requirements-android.txt')
        }
    }
    sourceSets {
        main {
            srcDir(generatedMiruPythonDir)
        }
    }
}

tasks.configureEach { task ->
    if (task.name.endsWith('PythonSources')) {
        task.dependsOn(syncMiruPythonRuntime)
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation "androidx.work:work-runtime:2.9.1"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
