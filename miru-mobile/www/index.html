<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#FFF9F2">
  <title>Miru — 初次见面</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Noto+Sans+SC:wght@300;400;500;600&family=Noto+Serif+JP:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #FFF9F2;
      --bg-card: #FDF6EE;
      --text-primary: #3A2E2A;
      --text-secondary: #6B5D54;
      --text-muted: #9A8B7A;
      --border-input: rgba(58,46,42,0.16);
      --sakura: #FFB7C5;
      --sakura-deep: #E89BAB;
      --sakura-glow: rgba(255,183,197,0.22);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: var(--bg-base);
      color: var(--text-primary);
      font-family: "Noto Sans SC", "Zen Maru Gothic", -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    body {
      display: flex; align-items: center; justify-content: center;
      padding: 40px 24px; position: relative;
    }
    body::before {
      content: ""; position: fixed;
      top: -180px; right: -140px; width: 460px; height: 460px;
      background: radial-gradient(circle, var(--sakura-glow) 0%, transparent 65%);
      pointer-events: none; z-index: 0;
    }
    body::after {
      content: ""; position: fixed;
      bottom: -220px; left: -160px; width: 520px; height: 520px;
      background: radial-gradient(circle, rgba(255,183,197,0.10) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
    }
    .sakura-deco {
      position: fixed; top: 28px; right: 28px;
      width: 84px; height: 84px; opacity: 0.55;
      pointer-events: none;
      animation: sway 9s ease-in-out infinite;
      z-index: 1;
    }
    @keyframes sway {
      0%, 100% { transform: rotate(-6deg) translateY(0); }
      50%      { transform: rotate(6deg) translateY(-4px); }
    }

    .page {
      display: none;
      position: relative; z-index: 2;
      width: 100%; max-width: 420px;
      text-align: center;
    }
    .page.active { display: flex; flex-direction: column; align-items: stretch; }

    .brand {
      display: inline-flex; align-items: center; gap: 10px;
      margin: 0 auto 56px;
    }
    .brand-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--sakura);
      box-shadow: 0 0 14px var(--sakura-glow);
    }
    .brand-name {
      font-family: "Zen Maru Gothic", "Noto Serif JP", serif;
      font-weight: 700; font-size: 18px;
      letter-spacing: 1px; color: var(--text-primary);
    }

    .eyebrow {
      font-family: "Noto Serif JP", "Zen Maru Gothic", serif;
      font-size: 12px; letter-spacing: 4px;
      color: var(--sakura-deep); font-weight: 500;
      margin-bottom: 14px;
    }
    .title {
      font-family: "Zen Maru Gothic", "Noto Serif JP", serif;
      font-size: 30px; font-weight: 500;
      letter-spacing: 1.8px;
      margin-bottom: 18px; line-height: 1.35;
    }
    .desc {
      font-size: 14px; color: var(--text-secondary);
      line-height: 1.75; margin-bottom: 48px;
      letter-spacing: 0.3px;
    }

    .code-input {
      width: 100%; padding: 14px 8px;
      background: transparent; border: none;
      border-bottom: 1px solid var(--border-input);
      font-family: "SF Mono", "Menlo", "Consolas", monospace;
      font-size: 18px; font-weight: 500;
      letter-spacing: 6px; text-align: center;
      color: var(--text-primary); outline: none;
      text-transform: uppercase;
      transition: border-color 0.3s ease;
    }
    .code-input::placeholder {
      color: var(--text-muted); letter-spacing: 4px;
      font-weight: 400; opacity: 0.6;
    }
    .code-input:focus { border-bottom-color: var(--sakura-deep); }

    .error-text {
      min-height: 20px; font-size: 12px;
      color: var(--sakura-deep); letter-spacing: 0.5px;
      margin-top: 10px;
    }

    .btn {
      width: 100%; margin-top: 28px;
      padding: 14px 20px;
      background: var(--text-primary); color: #fff;
      border: none; border-radius: 12px;
      font-family: inherit; font-size: 14px;
      font-weight: 500; letter-spacing: 4px;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 3px 12px rgba(58,46,42,0.14);
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active:not(:disabled) { transform: translateY(1px); opacity: 0.9; }
    .btn:disabled { opacity: 0.55; cursor: default; letter-spacing: 2px; }

    .btn-ghost {
      width: 100%; margin-top: 12px;
      padding: 12px 20px;
      background: transparent;
      border: 1px solid var(--border-input);
      color: var(--text-secondary);
      border-radius: 12px;
      font-family: inherit; font-size: 13px;
      letter-spacing: 2px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-ghost:active { background: rgba(58,46,42,0.04); }

    .spinner {
      width: 28px; height: 28px;
      border: 2px solid rgba(58,46,42,0.12);
      border-top-color: var(--sakura-deep);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner-msg {
      font-size: 14px; color: var(--text-secondary);
      letter-spacing: 0.3px;
      margin-bottom: 6px;
    }
    .server-hint {
      font-size: 11px; color: var(--text-muted);
      letter-spacing: 0.2px; margin-bottom: 28px;
      word-break: break-all;
    }

    @media (max-width: 380px) {
      .sakura-deco { width: 68px; height: 68px; top: 20px; right: 20px; opacity: 0.5; }
      .brand { margin-bottom: 40px; }
      .title { font-size: 26px; letter-spacing: 1.5px; }
      .desc { margin-bottom: 36px; }
      .code-input { font-size: 17px; letter-spacing: 4px; }
    }
    @media (max-height: 640px) {
      .brand { margin-bottom: 32px; }
      .desc { margin-bottom: 28px; }
      .btn { margin-top: 22px; }
    }
  </style>
</head>
<body>

<!-- SVG sakura decoration -->
<svg class="sakura-deco" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <radialGradient id="petal" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFE0E8"/>
      <stop offset="60%" stop-color="#FFB7C5"/>
      <stop offset="100%" stop-color="#E89BAB"/>
    </radialGradient>
  </defs>
  <g transform="translate(50,50)">
    <g><path d="M 0,-28 C -10,-28 -14,-18 -10,-8 C -6,-2 -2,0 0,0 C 2,0 6,-2 10,-8 C 14,-18 10,-28 0,-28 Z" fill="url(#petal)" stroke="#E89BAB" stroke-width="0.6" stroke-opacity="0.4"/></g>
    <g transform="rotate(72)"><path d="M 0,-28 C -10,-28 -14,-18 -10,-8 C -6,-2 -2,0 0,0 C 2,0 6,-2 10,-8 C 14,-18 10,-28 0,-28 Z" fill="url(#petal)" stroke="#E89BAB" stroke-width="0.6" stroke-opacity="0.4"/></g>
    <g transform="rotate(144)"><path d="M 0,-28 C -10,-28 -14,-18 -10,-8 C -6,-2 -2,0 0,0 C 2,0 6,-2 10,-8 C 14,-18 10,-28 0,-28 Z" fill="url(#petal)" stroke="#E89BAB" stroke-width="0.6" stroke-opacity="0.4"/></g>
    <g transform="rotate(216)"><path d="M 0,-28 C -10,-28 -14,-18 -10,-8 C -6,-2 -2,0 0,0 C 2,0 6,-2 10,-8 C 14,-18 10,-28 0,-28 Z" fill="url(#petal)" stroke="#E89BAB" stroke-width="0.6" stroke-opacity="0.4"/></g>
    <g transform="rotate(288)"><path d="M 0,-28 C -10,-28 -14,-18 -10,-8 C -6,-2 -2,0 0,0 C 2,0 6,-2 10,-8 C 14,-18 10,-28 0,-28 Z" fill="url(#petal)" stroke="#E89BAB" stroke-width="0.6" stroke-opacity="0.4"/></g>
    <circle cx="0" cy="0" r="3" fill="#F9D1A8"/>
    <circle cx="0" cy="0" r="1.2" fill="#E89BAB"/>
  </g>
</svg>

<!-- Page: Welcome / Enter code -->
<div class="page" id="pageWelcome">
  <div class="brand">
    <span class="brand-dot"></span>
    <span class="brand-name">Miru</span>
  </div>
  <div class="eyebrow">初めまして</div>
  <h1 class="title">初次见面</h1>
  <p class="desc">那些你转身就散落的瞬间，<br>她替你一一拾起</p>
  <input id="codeInput" class="code-input" type="text" placeholder="MIRU-XXXXXXXXXX-YYYYYY"
    maxlength="24" autocomplete="off" autocapitalize="characters" spellcheck="false" autofocus>
  <div class="error-text" id="codeErr">&nbsp;</div>
  <button class="btn" id="btnConnect" onclick="submitCode()" disabled>进 入</button>
</div>

<!-- Page: Connecting -->
<div class="page" id="pageConnecting">
  <div class="brand">
    <span class="brand-dot"></span>
    <span class="brand-name">Miru</span>
  </div>
  <div class="spinner"></div>
  <p class="spinner-msg">正在连接</p>
  <p class="server-hint" id="connectingUrl"></p>
  <button class="btn-ghost" onclick="cancelConnect()">取消</button>
</div>

<!-- Page: Error -->
<div class="page" id="pageError">
  <div class="brand">
    <span class="brand-dot"></span>
    <span class="brand-name">Miru</span>
  </div>
  <div class="eyebrow">少し等って</div>
  <h1 class="title" style="font-size:22px">连接未就绪</h1>
  <p class="desc" id="errorMsg">无法连接服务器</p>
  <p class="server-hint" id="errorUrl"></p>
  <button class="btn" onclick="retryConnect()">重 试</button>
  <button class="btn-ghost" onclick="disconnect()">重新输入邀请码</button>
</div>

<script>
// Base31 alphabet — must match server auth.py
var CODE_CHARS = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
var OBFUSCATION_MASK = [0x9c, 0x4a, 0xb7, 0x3e, 0x51, 0xf8];

function decodeServerSegment(encoded) {
  if (!encoded || encoded.length !== 10) return null;
  var num = 0;
  for (var i = 0; i < encoded.length; i++) {
    var idx = CODE_CHARS.indexOf(encoded[i]);
    if (idx < 0) return null;
    num = num * 31 + idx;
  }
  if (num >= Math.pow(2, 48)) return null;

  var bytes = new Array(6);
  for (var j = 5; j >= 0; j--) {
    bytes[j] = num & 0xff;
    num = Math.floor(num / 256);
  }
  for (var k = 0; k < 6; k++) {
    bytes[k] = bytes[k] ^ OBFUSCATION_MASK[k];
  }
  var ip = bytes[0] + '.' + bytes[1] + '.' + bytes[2] + '.' + bytes[3];
  var port = (bytes[4] << 8) | bytes[5];
  if (port < 1 || port > 65535) return null;
  return { ip: ip, port: port, serverUrl: 'http://' + ip + ':' + port };
}

function parseInvitationCode(code) {
  // Tolerant parser. Strip everything that isn't [A-Z0-9] (handles
  // pasted codes with separators, spaces, zero-width chars from IMEs).
  // Public login accepts only full long codes: server segment 10 + invite 6.
  var clean = (code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (clean.indexOf('MIRU') === 0) clean = clean.substring(4);
  if (clean.length !== 16) return null;
  for (var i = 0; i < clean.length; i++) {
    if (CODE_CHARS.indexOf(clean[i]) < 0) return null;
  }
  var server = decodeServerSegment(clean.substring(0, 10));
  if (!server) return null;
  var canonical = 'MIRU-' + clean.substring(0, 10) + '-' + clean.substring(10);
  return {
    serverUrl: server.serverUrl,
    userCode: clean.substring(10),
    fullCode: canonical
  };
}

var _connectTimeout = null;

// --- Credential persistence: SharedPreferences (Android) + localStorage fallback ---
function _isAndroid() {
  return typeof MiruAndroid !== 'undefined' && typeof MiruAndroid.getCredentials === 'function';
}

function loadCredentials() {
  if (_isAndroid()) {
    try {
      var raw = MiruAndroid.getCredentials();
      var creds = JSON.parse(raw);
      // On Android, SharedPreferences is the single source of truth.
      // DON'T fall through to localStorage if SharedPrefs is empty —
      // localStorage may still hold a stale token from a previous session
      // (clearCredentials() only clears SharedPrefs; the VPS-side
      // _handleAuthLost cannot reach this origin's localStorage due to
      // same-origin policy). Falling through there caused a redirect
      // loop after admin-side user deletion: token gone from SharedPrefs
      // but still in localStorage → navigateToApp → 401 → relaunch → repeat.
      return {
        serverUrl: creds && creds.serverUrl || '',
        token:     creds && creds.token     || '',
        code:      creds && creds.code      || '',
      };
    } catch(e) {}
    // Bridge failed entirely (very early in startup before injection)
    // — return empty to trigger welcome page rather than risk a loop.
    return { serverUrl: '', token: '', code: '' };
  }
  // Plain web (PWA / browser): localStorage is the only store.
  var url = localStorage.getItem('miru_server_url') || '';
  var token = localStorage.getItem('miru_auth_token') || '';
  var code = localStorage.getItem('miru_invitation_code') || '';
  return { serverUrl: url, token: token, code: code };
}

function persistCredentials(serverUrl, token, invitationCode) {
  localStorage.setItem('miru_server_url', serverUrl);
  localStorage.setItem('miru_auth_token', token);
  localStorage.setItem('miru_invitation_code', invitationCode);
  if (_isAndroid()) {
    try { MiruAndroid.saveCredentials(serverUrl, token, invitationCode); } catch(e) {}
  }
}

function clearAllCredentials() {
  localStorage.removeItem('miru_server_url');
  localStorage.removeItem('miru_auth_token');
  localStorage.removeItem('miru_invitation_code');
  if (_isAndroid()) {
    try { MiruAndroid.clearCredentials(); } catch(e) {}
  }
}

function showPage(id) {
  document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
  var el = document.getElementById(id);
  if (el) el.classList.add('active');
}

function showError(msg) {
  var creds = loadCredentials();
  document.getElementById('errorMsg').textContent = msg;
  document.getElementById('errorUrl').textContent = creds.serverUrl || '';
  showPage('pageError');
}

window._onEmbeddedBackendError = function(msg) {
  document.getElementById('errorMsg').textContent = msg || 'Miru 本地服务启动失败';
  document.getElementById('errorUrl').textContent = '请完全退出 Miru 后重新打开';
  showPage('pageError');
};

function cancelConnect() {
  if (_connectTimeout) { clearTimeout(_connectTimeout); _connectTimeout = null; }
  showPage('pageWelcome');
}

function showCodeError(msg) {
  var el = document.getElementById('codeErr');
  el.textContent = msg || '\u00A0';
}

function submitCode() {
  var raw = (document.getElementById('codeInput').value || '').trim();
  if (!raw) { showCodeError('请输入邀请码'); return; }

  var parsed = parseInvitationCode(raw);
  if (!parsed) {
    showCodeError('邀请码格式不对');
    return;
  }

  showCodeError('');
  var btn = document.getElementById('btnConnect');
  btn.disabled = true;
  btn.textContent = '连接中';

  var serverUrl = parsed.serverUrl;
  document.getElementById('connectingUrl').textContent = serverUrl;
  showPage('pageConnecting');

  var xhr = new XMLHttpRequest();
  xhr.open('POST', serverUrl + '/api/auth/login', true);
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.timeout = 15000;

  xhr.onload = function() {
    btn.disabled = false;
    btn.textContent = '进 入';
    if (xhr.status === 200) {
      try {
        var resp = JSON.parse(xhr.responseText);
        if (resp.token) {
          persistCredentials(serverUrl, resp.token, raw.trim().toUpperCase());
          navigateToApp();
          return;
        }
      } catch(e) {}
      showError('服务器返回异常');
    } else {
      var errMsg = '邀请码无效';
      try { errMsg = JSON.parse(xhr.responseText).error || errMsg; } catch(e) {}
      showCodeError(errMsg);
      showPage('pageWelcome');
    }
  };

  xhr.onerror = function() {
    btn.disabled = false;
    btn.textContent = '进 入';
    localStorage.setItem('miru_server_url', serverUrl);
    showError('无法连接服务器，请检查网络');
  };

  xhr.ontimeout = function() {
    btn.disabled = false;
    btn.textContent = '进 入';
    localStorage.setItem('miru_server_url', serverUrl);
    showError('连接超时，请检查网络');
  };

  xhr.send(JSON.stringify({ code: parsed.fullCode }));
}

function navigateToApp() {
  var creds = loadCredentials();
  if (!creds.serverUrl || !creds.token) { showPage('pageWelcome'); return; }
  window.location.href = creds.serverUrl + '/app?token=' + encodeURIComponent(creds.token);
}

function retryConnect() {
  var creds = loadCredentials();
  if (creds.token && creds.serverUrl) {
    document.getElementById('connectingUrl').textContent = creds.serverUrl;
    showPage('pageConnecting');
    navigateToApp();
    return;
  }
  if (creds.code) {
    document.getElementById('codeInput').value = creds.code;
    showPage('pageWelcome');
    _updateBtnEnabled();
    submitCode();
    return;
  }
  showPage('pageWelcome');
}

function disconnect() {
  clearAllCredentials();
  document.getElementById('codeInput').value = '';
  showCodeError('');
  _updateBtnEnabled();
  showPage('pageWelcome');
}

function _updateBtnEnabled() {
  var v = (document.getElementById('codeInput').value || '').trim().toUpperCase();
  document.getElementById('btnConnect').disabled = !parseInvitationCode(v);
}

// Input behavior: uppercase, strip invalid; auto-prepend MIRU- on paste
// when user pasted just the 16-char long-code body.
document.getElementById('codeInput').addEventListener('input', function() {
  var v = this.value.toUpperCase().replace(/[^A-Z0-9\-]/g, '');
  if (this.value !== v) this.value = v;
  showCodeError('');
  _updateBtnEnabled();
});

document.getElementById('codeInput').addEventListener('paste', function() {
  var self = this;
  setTimeout(function() {
    var v = self.value.toUpperCase().replace(/[^A-Z0-9\-]/g, '');
    if (v.length === 16 && v.indexOf('MIRU') !== 0) {
      v = 'MIRU-' + v;
    }
    self.value = v;
    showCodeError('');
    _updateBtnEnabled();
  }, 0);
});

document.getElementById('codeInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') { e.preventDefault(); submitCode(); }
});

// Auto-connect if saved token exists. Retry for MiruAndroid bridge race.
(function() {
  // Current Android builds use the embedded Python bridge for all three first-
  // run choices. MainActivity navigates to its /login page once loopback is
  // ready. Do not let stale legacy credentials race that navigation.
  try {
    if (_isAndroid() && typeof MiruAndroid.usesEmbeddedBackend === 'function'
        && MiruAndroid.usesEmbeddedBackend()) {
      document.getElementById('connectingUrl').textContent = '正在启动本地服务';
      showPage('pageConnecting');
      return;
    }
  } catch(e) {}
  function tryAutoConnect() {
    var creds = loadCredentials();
    if (creds.serverUrl && creds.token) {
      document.getElementById('connectingUrl').textContent = creds.serverUrl;
      showPage('pageConnecting');
      setTimeout(navigateToApp, 10);
      return true;
    }
    return false;
  }
  function showWelcome() {
    var creds = loadCredentials();
    if (creds.code) document.getElementById('codeInput').value = creds.code;
    _updateBtnEnabled();
    showPage('pageWelcome');
    setTimeout(function() {
      try { document.getElementById('codeInput').focus(); } catch(e) {}
    }, 50);
  }
  var retries = 0;
  var maxRetries = 6;
  function check() {
    if (tryAutoConnect()) return;
    retries++;
    if (retries < maxRetries && typeof MiruAndroid === 'undefined') {
      setTimeout(check, 100);
    } else {
      showWelcome();
    }
  }
  check();
})();
</script>
</body>
</html>
