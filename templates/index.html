/* === Hide AIRI side panel in DMG client mode ===
   Desktop DMG users get the floating Tauri pet window instead of the
   in-page companion panel. The launcher injects `client-mode` onto
   <body> via WKWebView navigation delegate. Plain web/APK users are
   unaffected. Placed outside any @media so it always applies when
   the class is present. */
body.client-mode .airi-side-panel,
body.client-mode #navAiriVisual {
  display: none !important;
}

/* Toggle switch */
.miru-toggle { position:relative; display:inline-block; width:44px; height:24px; cursor:pointer; }
.miru-toggle input { opacity:0; width:0; height:0; }
.miru-toggle-slider { position:absolute; top:0; left:0; right:0; bottom:0; background:var(--border-default, #ccc); border-radius:24px; transition:background 0.25s; }
.miru-toggle-slider::before { content:''; position:absolute; width:18px; height:18px; left:3px; bottom:3px; background:#fff; border-radius:50%; transition:transform 0.25s; }
.miru-toggle input:checked + .miru-toggle-slider { background:var(--airi-pink, #E89BAB); }
.miru-toggle input:checked + .miru-toggle-slider::before { transform:translateX(20px); }

/* ============================================================
   Emotion Panel (v2) — dark glass container shared by:
   · 情绪日历 (_buildEmotionCalendarHtml)
   · 用户日详情 (buildEmotionCurveHtml)
   · Miru 关系仪表盘 (buildMiruEmotionHtml)
   Inside the panel, CSS vars override the page's cream theme so
   every child element automatically picks up dark-theme colours.
   ============================================================ */
.emo-panel {
  --text-primary: #ECECF1;
  --text-secondary: #B8B8C4;
  --text-muted: #7A7A86;
  --border-color: rgba(255,255,255,0.08);
  --bg-secondary: rgba(255,255,255,0.04);
  --card-bg: rgba(255,255,255,0.03);

  position: relative; overflow: hidden;
  margin: 8px 0 16px;
  padding: 26px 26px 22px;
  border-radius: 22px;
  background: linear-gradient(135deg, #1c1c28 0%, #0e0e16 100%);
  border: 1px solid rgba(255,255,255,0.06);
  box-shadow: 0 14px 40px rgba(20,15,30,0.22);
  color: #ECECF1;
}
.emo-panel::before {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(circle at 88% 8%, rgba(255,183,197,0.10), transparent 50%);
}
.emo-panel > * { position: relative; }

.emo-section-h {
  display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px;
}
.emo-section-h .title {
  font-size: 14px; letter-spacing: 1.2px; color: rgba(255,255,255,0.92);
}
.emo-section-h .meta {
  font-size: 12px; color: rgba(255,255,255,0.4); font-variant-numeric: tabular-nums;
}
.emo-section-h .spacer { flex: 1; }
.emo-subtitle {
  font-size: 12px; color: rgba(255,255,255,0.5); margin-bottom: 16px; line-height: 1.55;
}
.emo-section-divider {
  height: 1px; background: rgba(255,255,255,0.06); margin: 18px 0 14px;
}

/* Stat pills (用户日详情) */
.emo-stat-pills {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px;
  padding: 18px 0 14px;
}
@media (max-width: 640px) {
  .emo-stat-pills { grid-template-columns: repeat(2, 1fr); }
}
.emo-stat-pill {
  padding: 12px 14px; border-radius: 14px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.10);
}
.emo-stat-pill .label { font-size: 11px; color: rgba(255,255,255,0.5); letter-spacing: 0.5px; }
.emo-stat-pill .value { font-size: 18px; font-weight: 600; margin-top: 4px; line-height: 1.1; }

/* Mood distribution / source / device chips */
.emo-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.emo-chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px;
  border-radius: 999px; background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08); font-size: 12px;
  color: rgba(255,255,255,0.85);
}
.emo-chip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.emo-chip .pct { opacity: 0.55; }
.emo-chip.source { background: rgba(108,155,210,0.10); border-color: rgba(108,155,210,0.30); }
.emo-chip.device { background: rgba(221,160,221,0.10); border-color: rgba(221,160,221,0.30); }

/* Timeline rows */
.emo-timeline { padding: 4px 0; }
.emo-timeline-row {
  display: flex; align-items: center; gap: 10px; padding: 8px 0;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  font-size: 13px;
}
.emo-timeline-row:last-child { border-bottom: none; }
.emo-timeline-row .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.emo-timeline-row .time {
  color: rgba(255,255,255,0.45); min-width: 52px;
  font-variant-numeric: tabular-nums; font-size: 12px;
}
.emo-timeline-row .mood-label { font-weight: 500; min-width: 70px; }
.emo-timeline-row .val {
  color: rgba(255,255,255,0.45); min-width: 52px;
  font-variant-numeric: tabular-nums; font-size: 12px;
}
.emo-timeline-row .glyph { color: rgba(255,255,255,0.45); min-width: 16px; font-size: 12px; }
.emo-timeline-row .reason {
  color: rgba(255,255,255,0.6); flex: 1;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-size: 12px;
}
.emo-timeline-row .dev {
  font-size: 11px; color: rgba(255,255,255,0.35); margin-left: 6px;
}

/* Emotion calendar grid (depth) */
.emo-cal-h {
  display: flex; justify-content: space-between; align-items: center;
  margin: 10px 0 12px;
}
.emo-cal-h .nav-btn {
  width: 32px; height: 32px; border-radius: 9px;
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.10);
  color: rgba(255,255,255,0.7); cursor: pointer; font-size: 14px;
  display: inline-flex; align-items: center; justify-content: center;
}
.emo-cal-h .nav-btn:hover:not(:disabled) { background: rgba(255,255,255,0.08); }
.emo-cal-h .nav-btn:disabled { opacity: 0.3; cursor: default; }
.emo-cal-h .month-label { font-size: 16px; font-weight: 500; color: rgba(255,255,255,0.92); }
.emo-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.emo-cal-grid .wd {
  font-size: 11px; color: rgba(255,255,255,0.4); text-align: center; padding: 6px 0;
}
.emo-cal-cell {
  aspect-ratio: 1; min-height: 56px; border-radius: 12px;
  background: rgba(255,255,255,0.02);
  display: flex; flex-direction: column; align-items: center;
  justify-content: flex-start; padding: 8px 0 0;
  cursor: pointer; transition: all 0.2s;
}
.emo-cal-cell:hover:not(.empty):not(.future) {
  background: rgba(255,255,255,0.05); transform: translateY(-1px);
}
.emo-cal-cell.empty { cursor: default; opacity: 0.5; }
.emo-cal-cell.future { opacity: 0.25; cursor: default; }
.emo-cal-cell.today {
  background: linear-gradient(135deg, rgba(255,183,197,0.18), rgba(255,183,197,0.05));
  box-shadow: inset 0 0 0 1px rgba(255,183,197,0.45);
}
.emo-cal-cell.today .day-num { color: #FFE0E8; font-weight: 600; }
.emo-cal-cell .day-num { font-size: 13px; color: rgba(255,255,255,0.65); }
.emo-cal-cell .mood-dot {
  width: 7px; height: 7px; border-radius: 50%; margin-top: 8px;
  box-shadow: 0 0 8px currentColor;
}

.emo-cta-btn {
  padding: 10px 22px; border-radius: 12px;
  background: rgba(255,183,197,0.12); border: 1px solid rgba(255,183,197,0.35);
  color: #FFD0DC; cursor: pointer; font-size: 13px;
}
.emo-cta-btn:hover { background: rgba(255,183,197,0.18); }

/* Miru relationship hero card (still pink, on dark) */
.emo-rel-hero {
  position: relative; padding: 22px 22px;
  border-radius: 16px;
  background: linear-gradient(135deg, rgba(255,183,197,0.18), rgba(201,160,220,0.14), rgba(169,200,232,0.16));
  border: 1px solid rgba(255,183,197,0.30);
  margin-bottom: 18px; overflow: hidden;
}
.emo-rel-hero::before {
  content: '\1F338'; position: absolute; top: -10px; right: 16px;
  font-size: 50px; opacity: 0.18; pointer-events: none;
}
.emo-rel-hero .row {
  display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
}
.emo-rel-hero .label {
  font-size: 12px; letter-spacing: 0.5px; color: rgba(255,255,255,0.7);
}
.emo-rel-hero .days {
  font-size: 36px; font-weight: 700; line-height: 1;
  background: linear-gradient(135deg, #FFB7C5, #C9A0DC);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.emo-rel-hero .day-label {
  font-size: 14px; color: rgba(255,255,255,0.85); font-weight: 500;
}
.emo-rel-hero .first-meet {
  font-size: 12px; color: rgba(255,255,255,0.55);
  margin-top: 8px; letter-spacing: 0.3px;
}

/* Miru current mood orb */
.emo-miru-current { display: flex; align-items: center; gap: 18px; padding: 18px 4px 12px; }
.emo-miru-orb {
  width: 80px; height: 80px; border-radius: 50%; flex-shrink: 0;
  background: radial-gradient(circle at 35% 35%,
    rgba(255,228,232,0.95), rgba(255,183,197,0.7) 50%, rgba(159,123,184,0.55) 100%);
  box-shadow:
    0 0 30px rgba(255,183,197,0.35),
    0 0 60px rgba(255,183,197,0.15),
    inset 0 -8px 16px rgba(108,155,210,0.25);
  animation: emo-orb-pulse 3.6s ease-in-out infinite;
}
@keyframes emo-orb-pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.04); }
}
.emo-miru-current .info { flex: 1; min-width: 0; }
.emo-miru-current .name {
  font-size: 20px; font-weight: 600;
  background: linear-gradient(135deg, #FFE0E8, #C9A0DC);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.emo-miru-current .reason {
  font-size: 13px; color: rgba(255,255,255,0.78); margin-top: 6px; line-height: 1.55;
}
.emo-miru-current .stats {
  font-size: 11px; color: rgba(255,255,255,0.45); margin-top: 8px;
  font-variant-numeric: tabular-nums;
}

/* Mobile responsive — keep paddings reasonable */
@media (max-width: 640px) {
  .emo-panel { padding: 18px 16px 16px; border-radius: 18px; }
  .emo-cal-cell { min-height: 48px; padding-top: 6px; }
  .emo-cal-cell .day-num { font-size: 12px; }
  .emo-rel-hero .row { gap: 8px; }
}

/* === Custom confirm/alert/prompt modals (2026-05-17) ============= *
 * 原生 confirm()/alert()/prompt() 在 macOS DMG 的 WKWebView 里默认
 * 失效 — host 没注册 WKUIDelegate 时 WKWebView 直接 return false,
 * 不显示任何对话框. 自定义 modal 替代, 兼容 DMG / APK / 浏览器.
 */
.miru-modal-overlay {
  position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55);
  display: flex; align-items: center; justify-content: center;
  z-index: 99999;
  -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
}
.miru-modal-box {
  background: var(--bg-elevated, #ffffff);
  color: var(--text-primary, #1a1a1a);
  padding: 24px 22px 18px; border-radius: 14px;
  max-width: 420px; min-width: 280px;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
  border: 1px solid var(--border-subtle, rgba(0, 0, 0, 0.08));
}
.miru-modal-msg {
  white-space: pre-wrap; line-height: 1.55;
  margin-bottom: 18px; font-size: 14px;
}
.miru-modal-input {
  width: 100%; padding: 8px 10px; margin-bottom: 18px;
  border: 1px solid var(--border-subtle, #d0d0d0); border-radius: 6px;
  font-size: 14px; background: var(--bg-base, #fafafa);
  color: var(--text-primary, #1a1a1a); box-sizing: border-box;
}
.miru-modal-actions {
  display: flex; gap: 10px; justify-content: flex-end;
}
.miru-modal-actions button {
  padding: 7px 18px; border: none; border-radius: 6px;
  cursor: pointer; font-size: 13px; font-weight: 500;
}
.miru-modal-btn-cancel {
  background: var(--bg-base, #f0f0f0);
  color: var(--text-secondary, #555);
}
.miru-modal-btn-cancel:hover { filter: brightness(0.95); }
.miru-modal-btn-confirm {
  background: var(--accent, #6366f1); color: #ffffff;
}
.miru-modal-btn-confirm:hover { filter: brightness(1.05); }
.miru-modal-btn-confirm.danger {
  background: #e74c3c;
}
.miru-modal-btn-confirm.danger:hover { background: #c0392b; }
</style>

    <p class="login-desc">那些你转身就散落的瞬间，<br>她替你一一拾起</p>
    <input id="loginCodeInput" type="text" placeholder="MIRU-XXXXXXXXXX-YYYYYY"
      maxlength="24" autocomplete="off" autocapitalize="characters" spellcheck="false"
      onkeydown="if(event.key==='Enter')_doLogin()">
    <div id="loginError">&nbsp;</div>
    <button class="login-btn" onclick="_doLogin()">进 入</button>
  </main>
</div>
<script>
function _showLoginScreen() {
  document.getElementById('loginOverlay').style.display = 'flex';
  // Dismiss boot splash if still visible (user lands on login, not main app)
  var _s = document.getElementById('bootSplash');
  if (_s) { _s.style.opacity = '0'; setTimeout(function() { _s.remove(); }, 350); }
}
function _hideLoginScreen() {
  document.getElementById('loginOverlay').style.display = 'none';
}

// _purgeAllUserScopedState + _handleAuthLost moved to the main app script
// block (after MiruCache and SPA caches are declared) so they have direct
// access to const-declared module variables. See 2026-05-08 multi-tenant
// audit. Stub here forwards to the global registered later.
function _handleAuthLost() {
  if (typeof window._handleAuthLostImpl === 'function') {
    return window._handleAuthLostImpl();
  }
  // Pre-bootstrap fallback (impl not registered yet): minimal cleanup.
  try { localStorage.removeItem('miru_auth_token'); } catch(e) {}
  if (typeof _showLoginScreen === 'function') _showLoginScreen();
}

  // The visible login accepts only full private-server invitation codes.
  // In client-mode the local Flask bridge decodes the server segment and
  // forwards login to that private server.

var _loginInProgress = false;
function _canonicalFullInvitationCode(code) {
  var chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  var body = (code || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (body.indexOf('MIRU') === 0) body = body.substring(4);
  if (body.length !== 16) return '';
  for (var i = 0; i < body.length; i++) {
    if (chars.indexOf(body[i]) < 0) return '';
  }
  return 'MIRU-' + body.substring(0, 10) + '-' + body.substring(10);
}
function _looksLikeFullInvitationCode(code) {
  return !!_canonicalFullInvitationCode(code);
}
function _desktopClientUrl(target) {
  if (!window.__MIRU_CLIENT_MODE__) return target;
  var url = new URL(target, window.location.origin);
  url.searchParams.set('desktop', '1');
  url.searchParams.set(
    'desktop_platform',
    window.__MIRU_DESKTOP_PLATFORM__ || 'macos'
  );
  return url.toString();
}
function _appLoginRedirectUrl(serverUrl, token) {
  var target = new URL(serverUrl.replace(/\/+$/, '') + '/app');
  target.searchParams.set('token', token);
  // The Windows shell starts on localhost and then navigates to the selected
  // private server. Keep the desktop markers on that cross-origin navigation
  // so the new document installs its native bridge before app bootstrap.
  return _desktopClientUrl(target.toString());
}
async function _doLogin() {
  if (_loginInProgress) return;
  var code = _canonicalFullInvitationCode(document.getElementById('loginCodeInput').value);
  if (!code) return;

  var errEl = document.getElementById('loginError');
  var btn = document.querySelector('#loginOverlay button');
  errEl.textContent = '';
  if (!_looksLikeFullInvitationCode(code)) {
    errEl.textContent = '请输入完整邀请码';
    return;
  }

  // Loading state
  _loginInProgress = true;
  if (btn) { btn.disabled = true; btn.textContent = '连接中'; }

  // Login always goes to the current host.
  // - On VPS web (phone/browser): current host is already the correct server
  // - On localhost (DMG client): local Flask proxies login to VPS
  var apiBase = '';

  try {
    var controller = new AbortController();
    var timer = setTimeout(function() { controller.abort(); }, 15000);
    var res = await fetch(apiBase + '/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({code: code}),
      signal: controller.signal
    });
    clearTimeout(timer);
    var data = await res.json();
    if (res.ok && data.token) {
      localStorage.setItem('miru_auth_token', data.token);
      localStorage.setItem('miru_invitation_code', code);
      if (data.server_url && /^https?:\/\//.test(data.server_url)) {
        localStorage.setItem('miru_server_url', data.server_url.replace(/\/+$/, ''));
        location.href = _appLoginRedirectUrl(data.server_url, data.token);
        return;
      }
      if (apiBase && apiBase !== location.origin) {
        location.href = apiBase + '/?token=' + encodeURIComponent(data.token);
      } else {
        _hideLoginScreen();
        location.reload();
      }
      return;
    } else {
      errEl.textContent = data.error || '邀请码无效';
    }
  } catch(e) {
    if (e.name === 'AbortError') {
      errEl.textContent = '连接超时，请检查网络';
    } else {
      errEl.textContent = '网络错误，请重试';
    }
  }
  // Reset button
  _loginInProgress = false;
  if (btn) { btn.disabled = false; btn.textContent = '进 入'; }
}
</script>

<script>
// Intercept link clicks in rendered markdown — open in new tab / default browser
document.addEventListener('click', function(e) {
  var anchor = e.target.closest && e.target.closest('a[href]');
  if (!anchor) return;
  var href = anchor.getAttribute('href');
  if (!href || href.charAt(0) === '#' || href.indexOf('javascript:') === 0) return;
  e.preventDefault();
  window.open(href, '_blank');
});

// ===== DOM refs =====
const textInput = document.getElementById('textInput');
const sendBtn = document.getElementById('sendBtn');
const cardPanel = document.getElementById('cardPanel');
const sidebarPanel = document.getElementById('sidebarPanel');
const detailView = document.getElementById('detailView');
const detailContent = document.getElementById('detailContent');
const detailBackBtn = document.getElementById('detailBackBtn');
const companionChatView = document.getElementById('companionChatView');
const companionChatMessages = document.getElementById('companionChatMessages');
const emptyCompanionState = document.getElementById('emptyCompanionState');
const airiSidePanel = document.getElementById('airiSidePanel');
const settingsModal = document.getElementById('settingsModal');
const clearAllConfirmModal = document.getElementById('clearAllConfirmModal');

// ===== IndexedDB Cache Layer =====
// Provides instant rendering from local cache, then background-validates with ETag.
// SSE `data_changed` events mark specific caches stale for next access.
// DB name includes a token hash so different users get isolated caches.
const MiruCache = (function() {
  const DB_VERSION = 1;
  const STORE = 'api_cache';
  let _db = null;
  let _dbName = null;

  function _getDbName() {
    if (_dbName) return _dbName;
    var token = (localStorage.getItem('miru_auth_token') || '').slice(0, 12);
    _dbName = token ? ('miru_cache_' + token) : 'miru_cache';
    return _dbName;
  }

  function _open() {
    var name = _getDbName();
    if (_db && _db.name === name) return Promise.resolve(_db);
    // Close old db if token changed
    if (_db) { try { _db.close(); } catch(e) {} _db = null; }
    return new Promise(function(resolve, reject) {
      var req = indexedDB.open(name, DB_VERSION);
      req.onupgradeneeded = function(e) {
        var db = e.target.result;
        if (!db.objectStoreNames.contains(STORE)) {
          db.createObjectStore(STORE, { keyPath: 'key' });
        }
      };
      req.onsuccess = function(e) { _db = e.target.result; resolve(_db); };
      req.onerror = function() { reject(req.error); };
    });
  }

  function get(key) {
    return _open().then(function(db) {
      return new Promise(function(resolve) {
        var tx = db.transaction(STORE, 'readonly');
        var req = tx.objectStore(STORE).get(key);
        req.onsuccess = function() { resolve(req.result || null); };
        req.onerror = function() { resolve(null); };
      });
    }).catch(function() { return null; });
  }

  function set(key, data, etag) {
    return _open().then(function(db) {
      return new Promise(function(resolve) {
        var tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).put({ key: key, data: data, etag: etag || '', ts: Date.now(), stale: false });
        tx.oncomplete = function() { resolve(); };
        tx.onerror = function() { resolve(); };
      });
    }).catch(function() {});
  }

  function markStale(key) {
    return _open().then(function(db) {
      return new Promise(function(resolve) {
        var tx = db.transaction(STORE, 'readwrite');
        var store = tx.objectStore(STORE);
        var req = store.get(key);
        req.onsuccess = function() {
          if (req.result) {
            req.result.stale = true;
            store.put(req.result);
          }
          resolve();
        };
        req.onerror = function() { resolve(); };
      });
    }).catch(function() {});
  }

  // Mark all cache entries whose key starts with `prefix` as stale.
  // Used by SSE data_changed (scope=memory) to invalidate per-slot detail
  // caches (slot_detail_<domain>_<slotId>) in bulk, so sleep_agent /
  // chat agent writing to a slot at night makes the user's next view
  // skip the stale cached body and go straight to network for fresh data.
  function markStalePrefix(prefix) {
    return _open().then(function(db) {
      return new Promise(function(resolve) {
        var tx = db.transaction(STORE, 'readwrite');
        var store = tx.objectStore(STORE);
        var keyReq = store.getAllKeys();
        keyReq.onsuccess = function() {
          var keys = keyReq.result || [];
          var pending = 0;
          var done = false;
          function maybeFinish() { if (done && pending === 0) resolve(); }
          keys.forEach(function(k) {
            if (typeof k === 'string' && k.indexOf(prefix) === 0) {
              pending++;
              var r = store.get(k);
              r.onsuccess = function() {
                if (r.result) { r.result.stale = true; store.put(r.result); }
                pending--;
                maybeFinish();
              };
              r.onerror = function() { pending--; maybeFinish(); };
            }
          });
          done = true;
          maybeFinish();
        };
        keyReq.onerror = function() { resolve(); };
      });
    }).catch(function() {});
  }

  function reset() {
    // Close current db and clear name so next access uses new token
    if (_db) { try { _db.close(); } catch(e) {} _db = null; }
    var oldName = _dbName;
    _dbName = null;
    // Delete old database
    if (oldName) {
      try { indexedDB.deleteDatabase(oldName); } catch(e) {}
    }
  }

  return { get: get, set: set, markStale: markStale, markStalePrefix: markStalePrefix, reset: reset };
})();

// =============================================================================
// Multi-tenant state-purge registry  (2026-05-08)
// =============================================================================
// VPS origin's localStorage / sessionStorage / IndexedDB / module globals are
// origin-scoped, NOT user-scoped. On a multi-tenant deployment, multiple users
// share the same VPS domain → without explicit cleanup, prior user's state
// bleeds into next user's session (see audit log 2026-05-08).
//
// Single source of truth for "what is per-user state on this client": new
// per-user keys/globals MUST register here so the purge picks them up
// automatically on logout / auth-lost / suspend / delete.
// -----------------------------------------------------------------------------

// localStorage keys the SPA writes that hold user-specific state.
// Anything NOT in this list is treated as device-global (e.g. a feature flag)
// and survives logout. When in doubt, register it here.
const _USER_SCOPED_LS_KEYS = [
  'miru_auth_token',     // session token (per-user by definition)
  'miru_invitation_code',
  'miru_server_url',
  'miru_local_mode',
  'miru_onboarded',      // questionnaire-done flag (per-user)
  'sidebarGroups',       // sidebar expand/collapse state (per-user UI pref)
];

// Reset all per-user client state. Used by logout, force re-login, and the
// shared 401 / auth-lost handler.
window._purgeAllUserScopedState = function() {
  // 1. localStorage — all registered keys
  _USER_SCOPED_LS_KEYS.forEach(function(k) {
    try { localStorage.removeItem(k); } catch(e) {}
  });

  // 2. JS module-level globals holding user data.
  // NOTE: We deliberately do NOT clear window.CHARACTER here. 16 callsites
  // read CHARACTER.name / CHARACTER.avatar_url WITHOUT null-guards (e.g.
  // chat input placeholders, reminder cards, mobile header). Setting it
  // null while the SPA is still running (the web/DMG path of _handleAuthLost
  // only shows the login overlay; it does NOT reload) would crash any
  // SSE event / timer / user-input handler that fires before the user
  // completes re-login. Cross-user leak is prevented by the natural
  // location.reload() that happens after successful re-login.
  try { window.__miruAuth = null; } catch(e) {}

  // 3. SPA caches that bleed across users on fast re-login.
  // _renderedMsgIds: const Set — .clear() keeps the binding intact.
  // _lastSeenReplyId / _cachedFetchGen: primitives, safe to reassign.
  // _cachedCommitments: keep at null (existing default) — the DDL paths
  // that read it (.push / .find / .filter) are unreachable while the
  // login overlay is up.
  try { if (typeof _renderedMsgIds !== 'undefined' && _renderedMsgIds.clear) _renderedMsgIds.clear(); } catch(e) {}
  try { if (typeof _lastSeenReplyId !== 'undefined') _lastSeenReplyId = ''; } catch(e) {}
  try { if (typeof _cachedCommitments !== 'undefined') _cachedCommitments = null; } catch(e) {}
  try { _cachedFetchGen = 0; } catch(e) {}

  // 4. IndexedDB (memory_slots / chat_history / etc cache)
  try { MiruCache.reset(); } catch(e) {}

  // 5. sessionStorage — full clear is safe (we don't use it for cross-tab
  //    persistent state, only ephemeral per-session things)
  try { sessionStorage.clear(); } catch(e) {}
};

// Real implementation of _handleAuthLost — overrides the early-bootstrap
// stub defined in the loginOverlay script block above. Same contract:
// purge state then route to the appropriate login UI.
window._handleAuthLostImpl = function() {
  window._purgeAllUserScopedState();

  // APK / Capacitor: bounce back to the full-code entry page.
  if (window.MiruAndroid && typeof window.MiruAndroid.clearCredentials === 'function') {
    try { window.MiruAndroid.clearCredentials(); } catch(e) {}
    if (typeof window.MiruAndroid.relaunchToEntry === 'function') {
      try {
        window.MiruAndroid.relaunchToEntry();
        return;  // Activity restart in progress, no further DOM work needed
      } catch(e) {}
    }
    // Bridge missing relaunchToEntry (older APK): try direct navigation
    // to Capacitor's HTTPS scheme as a best-effort fallback.
    try {
      window.location.href = 'https://localhost';
      return;
    } catch(e) {}
  }

  // Plain web / DMG client: short-code overlay is sufficient.
  if (typeof _showLoginScreen === 'function') _showLoginScreen();
};

// Cache-first fetch: render cached data immediately, then validate in background.
// Returns cached data right away (via onCached callback), then fresh data if changed.
// Usage: cachedFetch('/api/memory/tree', 'memory_tree', renderFn)
var _cachedFetchGen = 0; // generation counter to prevent stale renders on fast tab switching

// Call this at the start of each nav function to invalidate pending callbacks from previous nav
function _nextNavGen() { return ++_cachedFetchGen; }

function cachedFetch(url, cacheKey, onData) {
  var gen = _cachedFetchGen; // read current gen, don't increment
  function safeOnData(data) {
    if (gen !== _cachedFetchGen) return; // user already navigated away
    onData(data);
  }
  // 缓存策略 (2026-05-17 v2):
  //   - 有 cached:  立即 paint, 后台 fetch 再 paint 一次新数据
  //                 stale 标记控制 If-None-Match 是否带 (见 _fetchAndValidate)
  //                 → stale 时强制全量 fetch, 非 stale 时允许 304 短路
  //   - 无 cached:  纯网络
  // 之前 stale 时跳过 cached paint 的做法太激进:
  // 每次截屏写入 memory 都 SSE → markStale, 用户每次进记忆都被迫等
  // 网络 round-trip. slot delete 后的"看到老数据"由 _invalidateMemoryCache
  // + 短暂网络刷新解决, 不需要在这里阻塞.
  MiruCache.get(cacheKey).then(function(cached) {
    if (cached && cached.data) {
      safeOnData(cached.data);
      _fetchAndValidate(url, cacheKey, cached, safeOnData, false);
    } else {
      _fetchAndValidate(url, cacheKey, cached, safeOnData, true);
    }
  }).catch(function() {
    _fetchAndValidate(url, cacheKey, null, safeOnData, true);
  });
}

function _fetchAndValidate(url, cacheKey, cached, onData, isFirstLoad) {
  var headers = {};
  if (cached && cached.etag && !cached.stale) {
    headers['If-None-Match'] = cached.etag;
  }
  // Use relative URL — the global fetch wrapper handles client-mode URL rewriting + auth
  fetch(url, { headers: headers }).then(function(resp) {
    if (resp.status === 304) return null; // Not modified
    var etag = resp.headers.get('ETag') || '';
    return resp.json().then(function(data) {
      MiruCache.set(cacheKey, data, etag);
      return data;
    });
  }).then(function(freshData) {
    if (freshData !== null && freshData !== undefined) {
      onData(freshData);
    }
  }).catch(function(err) {
    if (isFirstLoad) {
      // 网络挂掉时的兜底: 有 stale 缓存就先显示它 (起码不空白),
      // 否则汇报错误. 之前只在 !cached 时报错 — 现在 stale 命中
      // 走 isFirstLoad=true 路径, 错误也要让用户看见.
      if (cached && cached.data) {
        onData(cached.data);
      } else {
        onData({ _error: err.message });
      }
    }
  });
}

// ===== Voice Input (Web Speech API) =====
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const voiceBtn = document.getElementById('voiceBtn');
let voiceRecognition = null;
let voiceListening = false;

if (!SpeechRecognition) {
  voiceBtn.classList.add('voice-unsupported');
  voiceBtn.title = '浏览器不支持语音输入';
}

voiceBtn.addEventListener('click', () => {
  if (!SpeechRecognition) {
    // Flash the button to show it's unsupported
    voiceBtn.style.background = 'rgba(208,120,120,0.4)';
    voiceBtn.title = '浏览器不支持语音输入';
    setTimeout(() => { voiceBtn.style.background = ''; }, 800);
    return;
  }
  if (voiceListening) {
    stopVoiceInput();
  } else {
    // Immediate visual feedback before onstart fires
    voiceBtn.classList.add('voice-active');
    voiceBtn.title = '正在启动语音识别…';
    startVoiceInput();
  }
});

function startVoiceInput() {
  if (!SpeechRecognition) return;
  voiceRecognition = new SpeechRecognition();
  voiceRecognition.lang = 'zh-CN';
  voiceRecognition.interimResults = true;
  voiceRecognition.continuous = true;
  voiceRecognition.maxAlternatives = 1;

  let finalTranscript = '';

  voiceRecognition.onstart = () => {
    voiceListening = true;
    voiceBtn.classList.add('voice-active');
    voiceBtn.title = '点击停止语音输入';
    finalTranscript = '';
  };
  voiceRecognition.onresult = (event) => {
    let interim = '';
    for (let i = 0; i < event.results.length; i++) {
      const result = event.results[i];
      if (result.isFinal) {
        finalTranscript += result[0].transcript;
      } else {
        interim += result[0].transcript;
      }
    }
    // Remove any previous interim marker
    textInput.value = textInput.value.replace(/\[语音识别中.*\]$/, '').trimEnd();
    if (finalTranscript) {
      textInput.value = (textInput.value ? textInput.value + '\n' : '') + finalTranscript;
      finalTranscript = '';
    }
    if (interim) {
      textInput.value = textInput.value + '[语音识别中: ' + interim + ']';
    }
    autoResizeTextInput();
  };
  voiceRecognition.onerror = (ev) => {
    console.warn('Voice recognition error:', ev.error);
    // Flash red briefly to show error
    voiceBtn.style.background = 'rgba(208,120,120,0.4)';
    setTimeout(() => { voiceBtn.style.background = ''; }, 1000);
    stopVoiceInput();
  };
  voiceRecognition.onend = () => {
    textInput.value = textInput.value.replace(/\[语音识别中.*\]$/, '').trimEnd();
    voiceListening = false;
    voiceBtn.classList.remove('voice-active');
    voiceBtn.title = '语音输入';
    autoResizeTextInput();
  };
  voiceRecognition.start();
}

function stopVoiceInput() {
  if (voiceRecognition) {
    voiceRecognition.stop();
    voiceRecognition = null;
  }
  voiceListening = false;
  voiceBtn.classList.remove('voice-active');
  voiceBtn.title = '语音输入';
}

function showCompanionChat(bootstrapChatData) {
  currentView = 'companion';
  companionChatView.style.display = 'flex';
  detailView.style.display = 'none';
  // Restore input bar (may be hidden by mobile tab switching)
  var inputWrapper = document.querySelector('.input-bar-wrapper');
  if (inputWrapper) inputWrapper.style.display = '';
  switchInputMode('companion');
  setSidebarActive('navCompanionChat');
  _showCompanionNewMsgBadge(false);

  // Reload strategy (no-flicker tab switching, like WeChat):
  //   * bootstrap data → use it (first app launch, free)
  //   * first-time entry this session → full reload (no DOM yet)
  //   * SSE had a disconnect since last view → full reload (catch missed cross-device msgs)
  //   * >30min since last full reload → full reload (catch any silent state drift)
  //   * otherwise → silent incremental (DOM stays, no flash)
  // SSE + silent incremental poll already keep DOM consistent the rest of the time.
  var staleness = Date.now() - _lastFullChatReloadTs;
  var needsFullReload = !companionChatLoaded
                     || _sseHadDisconnect
                     || staleness > _CHAT_FULL_RELOAD_INTERVAL;
  companionChatLoaded = true;

  if (bootstrapChatData) {
    loadCompanionChatHistory({ _bootstrapData: bootstrapChatData });
  } else if (needsFullReload) {
    loadCompanionChatHistory();
  } else {
    // Silent: catches any messages SSE might have missed (since= incremental),
    // appends them in-place without a flicker, then scrolls to bottom.
    loadCompanionChatHistory({ silent: true });
    scrollCompanionChatToBottom();
  }

  // Reset disconnect flag so the next entry doesn't redundantly full-reload
  _sseHadDisconnect = false;

  ensureCompanionChatPolling();
  // Mobile: hide back button
  var mb = document.getElementById('mobileBackBtn');
  if (mb) mb.style.display = 'none';
  // Self-heal the typing indicator on view re-entry.
  // If the user was on Memory/DDL/etc. while the LLM was processing and the
  // 90s safety timeout fired, _typingIndicatorShown=false here even though
  // the backend is still typing. The one-shot poll re-syncs.
  _syncTypingFromBackend();
}

function _renderActiveMemoryTab(slots) {
  if (!slots) slots = _slotsCache || {};

  var container = document.getElementById('memorySlotsArea');
  if (!container) return;
  var domain = _activeMemoryTab;
  var grouped = slots[domain] || { active: [], paused: [], archived: [] };

  // Update tab pills active state + count badges. The count badges were
  // baked into HTML by buildMemoryBrowserHtml on first paint; without this
  // sync, background revalidation (SSE data_changed → cache stale → refetch
  // → _onSlots) refreshes the card area but the top tab numbers stay at
  // their initial value, so e.g. "实际 6 个 slot 但 tab 显示 3".
  ['project', 'person', 'topic', 'self'].forEach(function(d) {

function _buildSlotGroupHtml(domain, grouped) {
  var active = grouped.active || [];
  var paused = grouped.paused || [];
  var archived = grouped.archived || [];
  var showArchived = archived.length && !(typeof _isMobile !== 'undefined' && _isMobile);

  if (!active.length && !paused.length && !showArchived) {
    return '<div class="slot-empty">\u8FD8\u6CA1\u6709 ' + _DOMAIN_LABELS[domain].label
         + ' \u8BB0\u5FC6\u3002\u548C ' + escapeHtml(((window.CHARACTER && CHARACTER.name) || 'Miru'))
         + ' \u591A\u804A\u804A\uFF0C\u4ED6\u4F1A\u81EA\u52A8\u6574\u7406\u3002</div>';
  }

  var html = '';
  // Active + Paused (mixed grid)
  var visible = active.concat(paused);
  if (visible.length) {
    html += '<div class="slot-grid">';
    visible.forEach(function(s) {
      html += _renderSlotCardHtml(domain, s);
    });
    html += '</div>';

  // Archived (\u6298\u53E0)

    html += '<details class="slot-archived"><summary>\u5DF2\u5F52\u6863 (' + archived.length + ')</summary>';
    html += '<div class="slot-grid">';

}

function _renderSlotCardHtml(domain, s) {

  else if (status === 'paused')   statusBadge = '\u23F8';                     // \u23F8

  else if (status === 'active')   statusBadge = '<span class="dot-active"></span>';

  var html = '<div class="slot-card" onclick="viewSlotDetail(\'' + domain + '\',\'' + escapeHtml(s.id) + '\')">';

  html += '</div>';
  if (summary) {
    html += '<div class="slot-card-summary">' + escapeHtml(summary) + '</div>';

function viewSlotDetail(domain, slotId) {
  _nextNavGen();
  // \u8BB0\u4F4F\u7528\u6237\u4ECE\u54EA\u4E2A domain \u8FDB\u6765\u7684, detail \u8FD4\u56DE\u65F6\u56DE\u5230\u90A3\u4E2A tab.
  _activeMemoryTab = domain;

  // 2026-05-17 perf: \u4ECE _slotsCache \u91CC\u62FF\u5230\u8BE5 slot \u7684 metadata,
  // \u7ACB\u5373\u753B\u9AA8\u67B6 (\u6807\u9898/\u56FE\u6807/\u522B\u540D/\u65E5\u671F/\u72B6\u6001),
  // \u7528 main.md preview \u4F5C\u4E3A\u4E34\u65F6\u5185\u5BB9. \u540E\u53F0 fetch \u62FF\u5168\u6587\u540E\u91CD\u753B.

  var cachedSlot = null;

    for (var i = 0; i < all.length; i++) {

  }

  // \u8D70 cachedFetch \u2014 IDB \u547D\u4E2D\u65F6\u65E0 spinner, \u7F16\u8F91/\u5F52\u6863/pin \u540E\u901A\u8FC7
  // _invalidateMemoryCache(domain, slotId) markStale, \u4E0B\u6B21\u8FDB\u6765\u5F3A\u5236\u8D70\u7F51\u7EDC.
  cachedFetch(
    '/api/memory/slot/' + encodeURIComponent(domain) + '/' + encodeURIComponent(slotId),
    'slot_detail_' + domain + '_' + slotId,
    function(data) {
      if (data && data._error) {
        if (!cachedSlot) {
          detailContent.innerHTML = '<div class="no-data-hint">\u52A0\u8F7D\u5931\u8D25: ' + escapeHtml(String(data._error)) + '</div>';
        }
        return;
      }
      if (!data || !data.slot) {
        if (!cachedSlot) {
          detailContent.innerHTML = '<div class="no-data-hint">slot \u4E0D\u5B58\u5728</div>';
        }
        return;
      }
      detailContent.innerHTML = _renderSlotDetailHtml(domain, data.slot, data.main_md, data.related_ddls || []);
    }
  );
}

function _renderSlotDetailHtml(domain, slot, mainMd, relatedDdls) {
  if (!slot) return '<div class="no-data-hint">slot \u4E0D\u5B58\u5728</div>';
  var icon = slot.icon || '\uD83D\uDCC4';
  var title = slot.title || slot.id;
  var status = slot.status || 'active';
  var pinned = !!slot.pinned;
  var statusText = status === 'active' ? '\u8FDB\u884C\u4E2D'
                  : status === 'paused' ? '\u6682\u505C'
                  : '\u5DF2\u5F52\u6863';

  var html = '<div class="slot-detail">';

  // Back button removed \u2014 the global black back arrow (in the detail-view
  // chrome) already covers this. Two stacked back arrows looked broken.

  // Header
  html += '<div class="slot-detail-header">';
  html += '<span class="slot-detail-icon">' + icon + '</span>';
  html += '<div class="slot-detail-title-block">';
  html += '<h2>' + escapeHtml(title) + (pinned ? ' \uD83D\uDCCC' : '') + '</h2>';
  html += '<div class="slot-detail-status">' + escapeHtml(statusText) + '</div>';
  html += '</div>';
  html += '<div class="slot-detail-actions">';
  // \u5F52\u6863\u6309\u94AE\u5DF2\u79FB\u9664 (2026-05-17 \u7528\u6237\u8981\u6C42) \u2014 \u7528\u6237\u53EA\u7528\u5220\u9664. \u5F52\u6863\u76F8\u5173\u51FD\u6570
  // \u4ECD\u4FDD\u7559 (\u5176\u4ED6\u6D41\u7A0B\u53EF\u80FD\u8C03\u7528), \u53EA\u662F UI \u4E0D\u518D\u66B4\u9732\u5165\u53E3.
  html += '<button class="btn-danger" onclick="_slotDelete(\'' + domain + '\',\'' + escapeHtml(slot.id) + '\')">\uD83D\uDDD1 \u5220\u9664</button>';
  html += '</div>';
  html += '</div>';

  // Metadata block
  html += '<div class="slot-detail-meta">';
  if (slot.summary) html += '<div><strong>\u6982\u8FF0:</strong> ' + escapeHtml(slot.summary) + '</div>';
  if (slot.aliases && slot.aliases.length) {
    html += '<div><strong>\u522B\u540D:</strong> ';
    html += slot.aliases.map(function(a){ return '<span class="chip">' + escapeHtml(a) + '</span>'; }).join(' ');
    html += '</div>';
  }
  html += '<div class="slot-detail-meta-row"><span>\u521B\u5EFA: ' + escapeHtml((slot.created || '').slice(0,10)) + '</span>';
  html += '<span>\u6700\u8FD1: ' + escapeHtml((slot.last_active || '').slice(0,10)) + '</span></div>';
  html += '</div>';

  // Related DDLs
  if (relatedDdls && relatedDdls.length) {
    html += '<div class="slot-detail-ddls"><h3>\u5173\u8054 DDL</h3>';
    relatedDdls.forEach(function(line) {
      html += '<div class="ddl-line">' + escapeHtml(line) + '</div>';
    });
    html += '</div>';
  }

  // main.md content (markdown rendered)
  html += '<div class="slot-detail-content">';
  html += '<h3>\u5185\u5BB9</h3>';
  if (mainMd && mainMd.trim()) {
    html += '<div class="markdown-rendered">' + _renderMarkdown(mainMd) + '</div>';
  } else {
    html += '<div class="no-data-hint">\u5185\u5BB9\u4E3A\u7A7A</div>';
  }
  html += '</div>';

  html += '</div>';
  return html;
}

// Lightweight markdown \u2192 HTML (only the subset we use)
function _renderMarkdown(md) {
  if (!md) return '';
  var lines = md.split('\n');
  var html = '';
  var inList = false;
  for (var i = 0; i < lines.length; i++) {
    var ln = lines[i];
    var stripped = ln.trimEnd();
    if (/^# /.test(stripped)) {
      if (inList) { html += '</ul>'; inList = false; }
      html += '<h2>' + escapeHtml(stripped.slice(2)) + '</h2>';
    } else if (/^## /.test(stripped)) {
      if (inList) { html += '</ul>'; inList = false; }
      html += '<h3>' + escapeHtml(stripped.slice(3)) + '</h3>';
    } else if (/^### /.test(stripped)) {
      if (inList) { html += '</ul>'; inList = false; }
      html += '<h4>' + escapeHtml(stripped.slice(4)) + '</h4>';
    } else if (/^- /.test(stripped)) {
      if (!inList) { html += '<ul>'; inList = true; }
      var item = stripped.slice(2);
      // bold **x**
      item = item.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      html += '<li>' + escapeHtml(item).replace(/&lt;strong&gt;(.+?)&lt;\/strong&gt;/g, '<strong>$1</strong>') + '</li>';
    } else if (stripped === '') {
      if (inList) { html += '</ul>'; inList = false; }
      html += '<br>';
    } else {
      if (inList) { html += '</ul>'; inList = false; }
      var p = stripped.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      html += '<p>' + escapeHtml(p).replace(/&lt;strong&gt;(.+?)&lt;\/strong&gt;/g, '<strong>$1</strong>') + '</p>';
    }
  }
  if (inList) html += '</ul>';
  return html;
}

// ===== Slot operations =====

// IndexedDB \u7F13\u5B58\u7B56\u7565: memory_slots / memory_tree / slot_detail_<d>_<id>
// \u5728\u540E\u7AEF\u5199\u5165\u540E\u4F1A\u88AB SSE data_changed \u81EA\u52A8 markStale, \u4F46 SSE \u6765\u56DE\u6709\u51E0\u767E ms
// \u5EF6\u8FDF \u2014 \u7528\u6237\u70B9\u5B8C\u64CD\u4F5C\u5C31\u7ACB\u523B navMemoryBrowser \u7684\u8BDD, cachedFetch \u4F1A\u5148\u628A
// \u65E7\u7F13\u5B58\u6E32\u67D3\u51FA\u6765. \u8FD9\u91CC\u5728 fetch \u540E\u4E3B\u52A8 markStale, \u8BA9\u4E0B\u6B21\u8BFB\u76F4\u63A5\u8D70\u7F51\u7EDC.
// \u4FEE\u4E86 cachedFetch \u624D\u771F\u6B63\u751F\u6548 \u2014 \u4E4B\u524D cachedFetch \u4E0D\u770B stale.
function _invalidateMemoryCache(domain, slotId) {
  try {
    MiruCache.markStale('memory_slots');
    MiruCache.markStale('memory_tree');
    MiruCache.markStale('core_memory');
    if (domain && slotId) {
      MiruCache.markStale('slot_detail_' + domain + '_' + slotId);
    }
  } catch(e) {}
}

async function _slotArchive(domain, slotId) {
  if (!await _confirm('\u5F52\u6863\u8BE5 slot\uFF1F\u4E4B\u540E\u4E0D\u4F1A\u51FA\u73B0\u5728\u8BB0\u5FC6\u4E3B\u89C6\u56FE\u3002', { confirmText: '\u5F52\u6863' })) return;
  var r = await fetch('/api/memory/slot/' + domain + '/' + encodeURIComponent(slotId) + '/archive', {method: 'POST'});
  if (!r.ok) { await _alert('\u5F52\u6863\u5931\u8D25 (' + r.status + ')'); return; }
  _invalidateMemoryCache(domain, slotId);
  navMemoryBrowser();
}

async function _slotDelete(domain, slotId) {
  if (!await _confirm('\u786E\u8BA4\u5220\u9664\u8FD9\u4E2A slot\uFF1F\u8BE5\u64CD\u4F5C\u4E0D\u53EF\u64A4\u9500\uFF0C\u4E3B\u6587\u4EF6\u4E5F\u4F1A\u88AB\u5220\u9664\u3002',
                      { danger: true, confirmText: '\u5220\u9664' })) return;
  var r = await fetch('/api/memory/slot/' + domain + '/' + encodeURIComponent(slotId), {method: 'DELETE'});
  if (!r.ok) {

  navMemoryBrowser();
}

    _alert('\u540C domain \u4E0B\u6CA1\u6709\u53EF\u5408\u5E76\u7684\u5176\u5B83 slot');

  var modal = document.createElement('div');
  modal.className = 'slot-edit-overlay';

    return '<option value="' + escapeHtml(s.id) + '">' + escapeHtml(s.title || s.id) + '</option>';

  modal.innerHTML = '<div class="slot-edit-modal">'
    + '<h3>\u5408\u5E76\u5230\u54EA\u4E2A slot?</h3>'

  _slotEditCancel();
  showDetailView('<div class="loading"><div class="spinner"></div><span>LLM \u6B63\u5728\u5408\u5E76\u5185\u5BB9, \u8BF7\u7A0D\u5019...</span></div>', 'memoryBrowser');

function toggleMemoryDir(headerEl, sectionId) {

function handleMemorySearch(query) {
  clearTimeout(_memorySearchTimer);
  const container = document.getElementById('memorySearchResults');
  const treeContent = document.getElementById('memoryTreeContent');
  if (!query || query.trim().length < 2) {
    if (container) container.innerHTML = '';
    if (treeContent) treeContent.style.display = '';
    return;
  }
  _memorySearchTimer = setTimeout(async () => {
    try {
      const res = await fetch('/api/memory/search?q=' + encodeURIComponent(query.trim()) + '&max=15');
      const data = await res.json();
      const results = data.results || [];
      if (treeContent) treeContent.style.display = 'none';
      let html = '<div class="memory-search-results">';
      if (results.length === 0) {
        html += '<div class="no-data-hint">\u672A\u627E\u5230\u76F8\u5173\u8BB0\u5FC6</div>';
      }
      for (const r of results) {
        html += '<div class="memory-search-result" onclick="viewMemoryFile(\'' + escapeHtml(r.path) + '\')">';
        html += '<div class="memory-search-result-title">' + escapeHtml(r.title) + '</div>';
        html += '<div class="memory-search-result-path">' + escapeHtml(r.path) + ' \u00B7 ' + escapeHtml(r.modified) + '</div>';
        if (r.snippet) {
          html += '<div class="memory-search-result-snippet">' + escapeHtml(r.snippet) + '</div>';
        }
        html += '</div>';
      }
      html += '</div>';
      if (container) container.innerHTML = html;
    } catch (e) {
      if (container) container.innerHTML = '<div class="no-data-hint">\u641C\u7D22\u5931\u8D25</div>';
    }
  }, 300);
}

async function viewMemoryFile(path) {
  _nextNavGen();
  showDetailView('<div class="loading"><div class="spinner"></div><span>\u52A0\u8F7D...</span></div>', 'memoryBrowser');
  var url = path === '__index__' ? '/api/memory/index' : '/api/memory/read?path=' + encodeURIComponent(path);
  var cacheKey = 'memory_file_' + path;
  cachedFetch(url, cacheKey, function(data) {
    if (data._error) { detailContent.innerHTML = '<div class="no-data-hint">\u52A0\u8F7D\u5931\u8D25: ' + escapeHtml(data._error) + '</div>'; return; }
    var content = data.content || '';
    var title = path === '__index__' ? 'index.md' : path;
    var html = '<div class="memory-detail">';
    html += '<div class="memory-detail-header">';
    html += '<span class="memory-detail-back" onclick="navMemoryBrowser()">\u2190 \u8FD4\u56DE</span>';
    html += '<span class="memory-detail-path">' + escapeHtml(title) + '</span>';
    html += '</div>';
    html += '<div class="memory-detail-content md-bubble">';
    html += renderMarkdown(content);
    html += '</div></div>';
    detailContent.innerHTML = html;
  });
}

  html += '<h2>\u6838\u5FC3\u753B\u50CF</h2>';

async function ensureAiriPanelModel() {
  var container = document.getElementById('airiPanelCanvas');
  if (!container) return;
  try {
    var res = await fetch('/api/models/active', { cache: 'no-store' });
    if (!res.ok) return;
    var data = await res.json();
    if (!data || !data.id) return;
    if (data.id === _airiPanelModelId && _airiPanelApp) return; // already loaded

    // Destroy previous
    if (_airiPanelApp) {
      try { _airiPanelApp.destroy(true); } catch(e) {}
      _airiPanelApp = null; _airiPanelModel = null;
    }
    container.innerHTML = '';
    _airiPanelModelId = data.id;

    await _ensureLive2DScripts();
    if (!window.PIXI || !PIXI.live2d) return;

    var w = _PET_REF_W;  // 420
    var h = _PET_REF_H;  // 760
    var app = new PIXI.Application({
      width: w, height: h,
      backgroundColor: 0xFFF0EC,
      backgroundAlpha: 1,
      preserveDrawingBuffer: true,
    });
    container.appendChild(app.view);
    _airiPanelApp = app;

    var url = data.local_path ? '/data/' + data.local_path : (data.source_url || '');
    if (!url) return;
    var layout = data.layout || { scale: 1, x: 0, y: 0 };

    var model = await PIXI.live2d.Live2DModel.from(url, { autoInteract: false });
    app.stage.addChild(model);
    _airiPanelModel = model;
    _airiPanelInitW = model.width;
    _airiPanelInitH = model.height;
    _applyLayoutToModel(model, layout, w, h, _airiPanelInitW, _airiPanelInitH);
  } catch(e) {
    console.warn('[AiriPanel] Model load failed:', e);
  }
}

function _journalFormatDate(dateStr) {
  // "2026-03-31" → { day: "31", monthYear: "2026年3月", weekday: "周二" }
  const parts = dateStr.split('-');
  if (parts.length !== 3) return { day: dateStr, monthYear: '', weekday: '' };
  const y = parseInt(parts[0]), m = parseInt(parts[1]), d = parseInt(parts[2]);
  const weekdays = ['周日','周一','周二','周三','周四','周五','周六'];
  let wd = '';
  try { wd = weekdays[new Date(y, m-1, d).getDay()]; } catch(e) {}
  return { day: String(d), monthYear: y + '年' + m + '月', weekday: wd };
}

// Track which day is currently open in the book view for prev/next nav
var _journalCurrentDate = null;
var _journalEntriesCache = [];

function buildJournalListHtml(entries) {
  var charName = (window.CHARACTER && CHARACTER.name) || 'Miru';
  let html = '<div class="query-result-header"><h2>' + charName + ' 的日记</h2>';
  html += '<div style="font-size:12px;color:var(--text-muted);margin-top:4px">她默默看着你的每一天，写下记得的事</div>';
  html += '</div>';

  // Today (local) — used to pin a "not yet" placeholder to the top
  var _now = new Date();
  var _todayStr = _now.getFullYear() + '-' +
      String(_now.getMonth() + 1).padStart(2, '0') + '-' +
      String(_now.getDate()).padStart(2, '0');

  var displayEntries = (entries || []).slice();
  // Drop any existing today entry from the list — we always render today as
  // a "还没写完" placeholder until the 23:45 auto-generate finalizes it.
  displayEntries = displayEntries.filter(function(e) { return e.date !== _todayStr; });
  displayEntries.unshift({ date: _todayStr, title: '', mood: {}, has_json: false, _todayPending: true });

  html += '<div class="journal-list">';
  displayEntries.forEach(function(e) {
    var fd = _journalFormatDate(e.date);
    var mood = e.mood || {};
    var isTodayPending = e._todayPending === true;
    var emoji = mood.emoji || (isTodayPending ? '🌙' : '📖');
    var title = e.title || (isTodayPending ? '今天' : (e.has_json ? '' : '（旧日记，待迁移）'));
    var moodLabel = mood.label || '';

    if (isTodayPending) {
      html += '<div class="journal-row jr-today-pending">';
    } else {
      html += '<div class="journal-row" onclick="viewJournalDetail(\'' + escapeHtml(e.date) + '\')">';
    }
    html += '<div class="jr-left">';
    html += '<div class="jr-day">' + escapeHtml(fd.day) + '</div>';
    html += '<div class="jr-meta">' + escapeHtml(fd.monthYear) + '<br>' + escapeHtml(fd.weekday) + '</div>';
    html += '</div>';
    html += '<div class="jr-body">';
    html += '<div class="jr-title-row"><span class="jr-emoji">' + escapeHtml(emoji) + '</span>';
    html += '<span class="jr-title">' + escapeHtml(title || '—') + '</span></div>';
    if (moodLabel) html += '<div class="jr-mood">' + escapeHtml(moodLabel) + '</div>';
    if (isTodayPending) {
      html += '<div class="jr-today-wait">' + escapeHtml(charName) + ' 还没来得及写啦，等今天结束再来吧～</div>';
    } else if (!e.has_json) {
      html += '<div class="jr-legacy-hint">点击生成新格式</div>';
    }
    html += '</div>';
    html += '</div>';
  });
  html += '</div>';
  return html;
}

function buildJournalBookHtml(journal) {
  var charName = (window.CHARACTER && CHARACTER.name) || 'Miru';
  var fd = _journalFormatDate(journal.date || '');
  var mood = journal.mood || {};
  var emoji = mood.emoji || '';
  var moodLabel = mood.label || '';
  var title = journal.title || '';
  var narrative = journal.narrative || '';
  var highlights = journal.highlights || [];
  var stats = journal.stats || {};
  var isLegacy = journal.legacy === true;
  var isEmpty = journal.is_empty_day === true;

  // Navigation: find prev/next from cached entries
  var idx = _journalEntriesCache.findIndex(function(e) { return e.date === journal.date; });
  var prevDate = idx >= 0 && idx < _journalEntriesCache.length - 1 ? _journalEntriesCache[idx + 1].date : null;
  var nextDate = idx > 0 ? _journalEntriesCache[idx - 1].date : null;

  var html = '<div class="journal-book">';
  html += '<div id="journalBookPage" class="journal-book-page">';

  // Cover header
  html += '<div class="jb-cover">';
  html += '<div class="jb-date-big">' + escapeHtml(fd.day) + '</div>';
  html += '<div class="jb-date-meta">' + escapeHtml(fd.monthYear) + ' · ' + escapeHtml(fd.weekday) + '</div>';
  if (emoji || moodLabel) {
    html += '<div class="jb-mood">';
    if (emoji) html += '<span class="jb-mood-emoji">' + escapeHtml(emoji) + '</span>';
    if (moodLabel) html += '<span class="jb-mood-label">' + escapeHtml(moodLabel) + '</span>';
    html += '</div>';
  }
  html += '</div>';

  if (title) {
    html += '<div class="jb-title">' + escapeHtml(title) + '</div>';
  }

  // Narrative body (main prose)
  if (narrative) {
    html += '<div class="jb-narrative">';
    narrative.split(/\n\s*\n/).forEach(function(para) {
      var trimmed = para.trim();
      if (trimmed) html += '<p>' + escapeHtml(trimmed).replace(/\n/g, '<br>') + '</p>';
    });
    html += '</div>';
  } else if (isEmpty) {
    html += '<div class="jb-narrative"><p style="opacity:0.7">（她记得你没有出现。）</p></div>';
  }

  // Highlights
  if (highlights && highlights.length > 0) {
    html += '<div class="jb-highlights">';
    html += '<div class="jb-highlights-label">记得的瞬间</div>';
    highlights.forEach(function(h) {
      html += '<div class="jb-highlight">';
      if (h.time) html += '<span class="jb-highlight-time">' + escapeHtml(h.time) + '</span>';
      html += '<span class="jb-highlight-text">' + escapeHtml(h.text || '') + '</span>';
      html += '</div>';
    });
    html += '</div>';
  }

  // Signature
  html += '<div class="jb-signature">— ' + escapeHtml(charName) + '</div>';

  // Stats strip (tiny, subtle)
  if (stats && (stats.first_active || stats.last_active || stats.chat_count)) {
    html += '<div class="jb-stats">';
    if (stats.first_active) html += '<span>首次活动 ' + escapeHtml(stats.first_active) + '</span>';
    if (stats.last_active) html += '<span>· 末次 ' + escapeHtml(stats.last_active) + '</span>';
    if (stats.chat_count) html += '<span>· ' + stats.chat_count + ' 句对话</span>';
    html += '</div>';
  }

  if (isLegacy) {
    html += '<div class="jb-legacy-badge">原始日记（旧格式）— 点击重生成升级为新日记</div>';
  }

  html += '</div>'; // /jb-page

  // Action bar (not captured in share PNG)
  html += '<div class="journal-book-actions">';
  if (prevDate) {
    html += '<button class="jba-btn" onclick="viewJournalDetail(\'' + escapeHtml(prevDate) + '\')">← 前一天</button>';
  } else {
    html += '<span></span>';
  }
  html += '<div class="jba-center">';
  // "重新生成" removed — users shouldn't be able to discard Miru's existing
  // narrative. Every rerun loses the previous emotional framing, and a
  // given day only has one "real" journal. Legacy MD upgrades are handled
  // automatically by scan_and_backfill, no user button needed.
  //
  // 分享按钮仅在手机端显示 —— 桌面端直接系统截图更顺手，
  // 且移动端分享走 Web Share API 直达 IM/相册才有实际意义。
  if (_isMobile) {
    html += '<button class="jba-btn jba-share" onclick="_shareJournalAsPng()">分享</button>';
  }
  html += '</div>';
  if (nextDate) {
    html += '<button class="jba-btn" onclick="viewJournalDetail(\'' + escapeHtml(nextDate) + '\')">后一天 →</button>';
  } else {
    html += '<span></span>';
  }
  html += '</div>';

  html += '</div>'; // /journal-book
  return html;
}

// _regenerateJournal removed — user should not be able to discard Miru's
// existing narrative (design decision, see buildJournalBookHtml comment).
// Legacy MD → JSON upgrade is handled automatically by scan_and_backfill.

// ─── 分享日记（仅手机端）────────────────────────────────────────────
// 流程：html2canvas 渲染整页 → 生成 PNG File → Web Share API 交给系统
// 的"分享"面板，用户选择微信/相册/朋友圈等 IM。
// 任一步失败都给出具体错误提示，绝不静默。
async function _shareJournalAsPng() {
  var card = document.getElementById('journalBookPage');
  if (!card) { _shareShowError('找不到日记页面'); return; }

  // 前置：设备/浏览器是否支持 Web Share with files
  if (!navigator.canShare || !navigator.share || !window.File) {
    _shareShowError('你的浏览器不支持系统分享面板，请升级或使用 Miru APK');
    return;
  }

  var btn = document.querySelector('.jba-btn.jba-share');
  var origText = btn && btn.textContent;
  if (btn) { btn.textContent = '生成中...'; btn.disabled = true; }
  var restore = function() { if (btn) { btn.textContent = origText; btn.disabled = false; } };

  try {
    if (typeof html2canvas === 'undefined') {
      await _loadHtml2Canvas();
    }
    var canvas = await html2canvas(card,
      { scale: 2, backgroundColor: '#F5F0E8', useCORS: true });
    var blob = await new Promise(function(resolve, reject) {
      canvas.toBlob(function(b) {
        if (b) resolve(b); else reject(new Error('图片生成失败'));
      }, 'image/png');
    });
    var label = _journalCurrentDate || 'journal';
    var file = new File([blob], 'miru-journal-' + label + '.png',
                        { type: 'image/png' });
    if (!navigator.canShare({ files: [file] })) {
      throw new Error('系统拒绝分享图片文件');
    }
    await navigator.share({
      files: [file],
      title: 'Miru 日记 ' + label,
      text: 'Miru 的日记 — ' + label,
    });
    // 分享成功（或用户在面板点了取消，两者浏览器都不抛错）
  } catch (e) {
    // AbortError = 用户自己点了取消，不算失败
    if (e && e.name === 'AbortError') { restore(); return; }
    console.error('[share] failed:', e);
    _shareShowError('分享失败：' + (e && e.message ? e.message : e));
  } finally {
    restore();
  }
}

// Load html2canvas with a CDN fallback chain (国内 CDN 可能被墙 / WebView
// CSP 可能挡住外部脚本). jsdelivr 在国内通常比 cdnjs 稳定。
function _loadHtml2Canvas() {
  var urls = [
    'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js',
    'https://fastly.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',
  ];
  return urls.reduce(function(p, url) {
    return p.catch(function() { return _loadScript(url); });
  }, Promise.reject()).then(function() {
    if (typeof html2canvas === 'undefined') {
      throw new Error('html2canvas 未加载，请检查网络');
    }
  });
}

function _loadScript(src) {
  return new Promise(function(resolve, reject) {
    var s = document.createElement('script');
    s.src = src;
    s.onload = function() { resolve(); };
    s.onerror = function() { reject(new Error('加载 ' + src + ' 失败')); };
    document.head.appendChild(s);
  });
}

// 分享失败时的非阻塞提示 toast（比 alert 柔和）。
function _shareShowError(msg) {
  var t = document.createElement('div');
  t.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(0,0,0,0.85);color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;z-index:9999;max-width:80%;text-align:center;line-height:1.5;';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function() { t.remove(); }, 3500);
}

// === Live2D Model Preview System ===
var _settingsModelList = [];
var _l2dReady = null;

function _l2dLoadScript(src) {
  return new Promise(function(resolve, reject) {
    var s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = function() { reject(new Error('Failed to load: ' + src)); };
    document.head.appendChild(s);
  });
}

function _ensureLive2DScripts() {
  if (_l2dReady) return _l2dReady;
  _l2dReady = (async function() {
    // Order: pixi → cubism SDKs → pixi-live2d-display → JSZip
    await _l2dLoadScript('https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js');
    await _l2dLoadScript('/assets/js/live2d/live2d.min.js');
    await _l2dLoadScript('/assets/js/live2d/CubismSdkForWeb-5-r.3/Core/live2dcubismcore.min.js');
    await _l2dLoadScript('https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/index.min.js');
    await _l2dLoadScript('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js');
    // Configure ZipLoader for .zip model support (including Chinese filenames)
    var ZL = PIXI.live2d.ZipLoader;
    ZL.zipReader = function(data) { return JSZip.loadAsync(data); };
    ZL.readText = function(zip, path) {
      var f = zip.file(path);
      if (!f) throw new Error('File not found in zip: ' + path);
      return f.async('text');
    };
    ZL.getFilePaths = function(zip) {
      var p = [];
      zip.forEach(function(r) { p.push(r); });
      return Promise.resolve(p);
    };
    ZL.getFiles = function(zip, paths) {
      return Promise.all(paths.map(function(path) {
        var name = path.split('/').pop();
        return zip.file(path).async('blob').then(function(b) { return new File([b], name); });
      }));
    };
    // Custom createSettings: fallback for zips where default parser fails
    // (e.g. Chinese filenames, missing model3.json). Mirrors companion panel logic.
    var _defaultCreateSettings = ZL.createSettings;
    ZL.createSettings = async function(reader) {
      var filePaths = Object.keys(reader.files);
      var hasSettings = filePaths.some(function(f) {
        return f.endsWith('model3.json') || f.endsWith('model.json');
      });
      if (hasSettings) {
        try { return await _defaultCreateSettings(reader); } catch(e) {
          console.warn('[ZipLoader] Default createSettings failed, using fallback:', e);
        }
      }
      // Fallback: build settings from moc3 + textures
      var mocFiles = filePaths.filter(function(f) { return f.endsWith('.moc3') || f.endsWith('.moc'); });
      if (mocFiles.length !== 1) throw new Error('Expected 1 moc file, got ' + mocFiles.length);
      var mocFile = mocFiles[0];
      var modelName = mocFile.split('/').pop().replace(/\.moc3?$/, '');
      var textures = filePaths.filter(function(f) { return f.endsWith('.png'); });
      if (!textures.length) throw new Error('No textures found in zip');
      var physics = filePaths.find(function(f) { return f.includes('physics'); });
      var motions = filePaths.filter(function(f) { return f.endsWith('.motion3.json') || f.endsWith('.mtn'); });
      var Cubism4Settings = PIXI.live2d.Cubism4ModelSettings;
      var settings = new Cubism4Settings({
        url: modelName + '.model3.json',
        Version: 3,
        FileReferences: {
          Moc: mocFile,
          Textures: textures,
          Physics: physics || undefined,
          Motions: motions.length ? { '': motions.map(function(m) { return { File: m }; }) } : undefined,
        },
      });
      settings.name = modelName;
      settings._objectURL = 'example://' + settings.url;
      return settings;
    };

    // URI-encode middleware for non-ASCII filenames (Chinese, etc.)
    // Mirrors companion panel's live2d-uri-encode-filenames.ts
    function _tryEncode(obj, prop) {
      if (obj && typeof obj[prop] === 'string') obj[prop] = encodeURI(obj[prop]);
    }
    var _encodeMiddleware = function(context, next) {
      if (typeof context.source !== 'object' || !context.source) return next();
      var s = context.source.settings;
      if (!s) return next();
      _tryEncode(s, 'moc');
      if (Array.isArray(s.textures)) {
        for (var j = 0; j < s.textures.length; j++) _tryEncode(s.textures, j);
      }
      _tryEncode(s, 'physics');
      _tryEncode(s, 'url');
      return next();
    };
    var _mws = PIXI.live2d.Live2DFactory.live2DModelMiddlewares;
    var _flIdx = _mws.indexOf(PIXI.live2d.FileLoader.factory);
    if (_flIdx >= 0) {
      _mws.splice(_flIdx, 0, _encodeMiddleware);
    } else {
      _mws.push(_encodeMiddleware);
    }
  })();
  return _l2dReady;
}

var _L2D_PREVIEW_BG = 0xFFF0EC;

async function _renderLive2DPreview(modelUrl, w, h, layout) {
  await _ensureLive2DScripts();
  if (!window.PIXI || !PIXI.live2d) return null;

  var canvas = document.createElement('canvas');
  canvas.width = w;
  canvas.height = h;
  canvas.style.cssText = 'position:fixed;left:-9999px;opacity:0;pointer-events:none';
  document.body.appendChild(canvas);

  var app = new PIXI.Application({
    view: canvas, width: w, height: h,
    preserveDrawingBuffer: true,
    backgroundColor: _L2D_PREVIEW_BG,
    backgroundAlpha: 1,
    autoStart: false,
  });

  try {
    var model = await PIXI.live2d.Live2DModel.from(modelUrl, { autoInteract: false });
    app.stage.addChild(model);
    _applyLayoutToModel(model, layout || { scale: 1, x: 0, y: 0 }, w, h, model.width, model.height);
    await new Promise(function(r) { setTimeout(r, 800); });
    app.renderer.render(app.stage);
    var dataUrl = canvas.toDataURL('image/png');
    return dataUrl;
  } catch (e) {
    console.warn('[L2D] Preview render failed:', modelUrl, e);
    return null;
  } finally {
    app.destroy(true);
    if (canvas.parentNode) canvas.parentNode.removeChild(canvas);
  }
}

function _resolveModelUrl(model) {
  if (model.local_path) return '/data/' + model.local_path;
  if (model.source_url) return model.source_url;
  return '';
}

async function _settingsGeneratePreviews(models) {
  for (var i = 0; i < models.length; i++) {
    var m = models[i];
    if (!m.is_default_avatar) continue; // has real avatar from companion panel — skip
    var url = _resolveModelUrl(m);
    if (!url) continue;
    var imgEl = document.getElementById('model-preview-' + m.id);
    if (!imgEl) continue;
    try {
      var dataUrl = await _renderLive2DPreview(url, _PET_REF_W, _PET_REF_H, m.layout);
      if (dataUrl && imgEl.parentNode) {
        imgEl.src = dataUrl;
        // Upload rendered avatar to backend (fire-and-forget)
        var modelId = m.id;
        fetch(dataUrl).then(function(r) { return r.blob(); }).then(function(blob) {
          var form = new FormData();
          form.append('file', blob, 'avatar.png');
          fetch('/api/models/' + modelId + '/auto-avatar', { method: 'POST', body: form });
        }).catch(function() {});
      }
    } catch (e) { /* skip */ }
  }
}

var _l2dDetailApp = null;
var _l2dDetailModel = null;
var _l2dDetailInitW = 0;
var _l2dDetailInitH = 0;

function _isCubism4(model) {
  try {
    return model.internalModel && typeof model.internalModel.coreModel.setParameterValueById === 'function';
  } catch(e) { return true; } // default to Cubism4 behavior
}

// Pet window reference size — all canvases use this exact resolution
var _PET_REF_W = 420;
var _PET_REF_H = 760;

// Replica of Model.vue:setScaleAndPosition
// Canvas is always 420×760 (same as pet window), so layout x/y are direct pixel offsets.
function _applyLayoutToModel(model, layout, canvasW, canvasH, initModelW, initModelH) {
  if (!model) return;
  var ly = layout || {};
  var s = typeof ly.scale === 'number' ? ly.scale : 1;
  var lx = typeof ly.x === 'number' ? ly.x : 0;
  var lyy = typeof ly.y === 'number' ? ly.y : 0;

  var modelW = initModelW || model.width;
  var modelH = initModelH || model.height;
  var offsetFactor = 2.2;
  var heightScale = canvasH * 0.95 / modelH * offsetFactor;
  var widthScale = canvasW * 0.95 / modelW * offsetFactor;
  var baseScale = Math.min(heightScale, widthScale);
  if (!isFinite(baseScale) || baseScale <= 0) baseScale = 1;
  model.scale.set(baseScale * s);

  // Scale pixel offsets relative to 420×760 reference canvas so the model
  // stays in the same proportional position at any canvas size.
  var refScaleX = canvasW / _PET_REF_W;
  var refScaleY = canvasH / _PET_REF_H;

  if (_isCubism4(model)) {
    model.anchor.set(0.5, 0.5);
    model.x = canvasW / 2 + lx * refScaleX;
    model.y = canvasH + lyy * refScaleY;
  } else {
    model.anchor.set(0, 0);
    model.x = canvasW / 2 + lx * refScaleX;
    model.y = canvasH * 0.55 + lyy * refScaleY;
  }
}

function _destroyLive2DDetailCanvas(restorePanel) {

async function _createLive2DDetailCanvas(containerEl, modelUrl, layout) {
  _destroyLive2DDetailCanvas();
  await _ensureLive2DScripts();
  if (!window.PIXI || !PIXI.live2d) return;

  // Fixed internal resolution matching pet window exactly — no proportional scaling needed
  var w = _PET_REF_W;  // 420
  var h = _PET_REF_H;  // 760

  var app = new PIXI.Application({
    width: w, height: h,
    backgroundColor: _L2D_PREVIEW_BG,
    backgroundAlpha: 1,
    preserveDrawingBuffer: true,
  });
  containerEl.appendChild(app.view);
  // CSS scales the canvas to fit the container while preserving aspect ratio
  app.view.style.cssText = 'width:100%;height:auto;aspect-ratio:420/760;border-radius:12px;display:block;';
  _l2dDetailApp = app;

  try {
    var model = await PIXI.live2d.Live2DModel.from(modelUrl, { autoInteract: false });
    app.stage.addChild(model);
    _l2dDetailModel = model;
    _l2dDetailInitW = model.width;
    _l2dDetailInitH = model.height;
    _applyLayoutToModel(model, layout, w, h, _l2dDetailInitW, _l2dDetailInitH);
  } catch (e) {
    console.warn('[L2D] Detail canvas failed:', e);
  }
}

  }

  html += field('cdName', '角色名字', fields.name, 'text');
  html += field('cdUserAddress', '对用户的称呼', fields.user_address, 'text', '角色怎么称呼你');
  html += field('cdPersonality', '性格', fields.personality, 'textarea', '角色的性格特点');
  html += field('cdSpeechPatterns', '说话方式', fields.speech_patterns, 'textarea', '语气词、自称、口癖等');

  html += field('cdRoleSummary', '角色定位', hints.role_summary, 'text', '一句话描述角色的定位');

  html += field('cdArchetype', '角色类型', hints.archetype, 'text', '如"元气少女""呆萌小生物"等');
  html += '</div>';

  html += '<details style="margin-top:12px;">';

async function settingsSaveCharFields() {
  if (!_charDetailModelId) return;
  var body = {
    name: document.getElementById('cdName').value,
    user_address: document.getElementById('cdUserAddress').value,
    personality: document.getElementById('cdPersonality').value,
    speech_patterns: document.getElementById('cdSpeechPatterns').value,
    appearance: document.getElementById('cdAppearance').value,
    backstory: document.getElementById('cdBackstory').value,
    interests: document.getElementById('cdInterests').value,
    prompt_hints: {
      role_summary: document.getElementById('cdRoleSummary').value,
      role_summary_full: document.getElementById('cdRoleSummaryFull').value,
      tone_short: document.getElementById('cdToneShort').value,
      tone_chat: document.getElementById('cdToneChat').value,
      archetype: document.getElementById('cdArchetype').value,
      memory_bank_name: document.getElementById('cdMemoryBankName').value,
    }
  };
  try {
    settingsShowFlash('保存中...');
    var res = await fetch('/api/models/' + _charDetailModelId + '/fields', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    var data = await res.json();
    if (data.ok) {
      settingsShowFlash('角色设定已保存');
      // Refresh CHARACTER if this is the active model
      try { var cr = await fetch('/api/character', {cache:'no-store'}); window.CHARACTER = await cr.json(); } catch(e) {}
    } else {
      settingsShowFlash('保存失败: ' + (data.error || ''), 'error');
    }
  } catch (err) {
    settingsShowFlash('保存失败: ' + err.message, 'error');
  }
}

async function settingsSaveCharLayout() {
  if (!_charDetailModelId) return;
  var scale = parseFloat(document.getElementById('cdLayoutScale').value) || 1;
  var x = parseFloat(document.getElementById('cdLayoutX').value) || 0;
  var y = parseFloat(document.getElementById('cdLayoutY').value) || 0;
  try {
    var res = await fetch('/api/models/' + _charDetailModelId + '/layout', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ scale: scale, x: x, y: y }),
    });
    var data = await res.json();
    if (data.ok) {
      settingsShowFlash('布局已保存');
      // Capture thumbnail from live canvas and upload as avatar
      if (_l2dDetailApp && _l2dDetailApp.view) {
        var modelId = _charDetailModelId;
        try {
          _l2dDetailApp.renderer.render(_l2dDetailApp.stage);
          _l2dDetailApp.view.toBlob(function(blob) {
            if (!blob) return;
            var form = new FormData();
            form.append('file', blob, 'avatar.png');
            fetch('/api/models/' + modelId + '/auto-avatar', { method: 'POST', body: form }).then(function() {
              // Update card thumbnail in the list
              var cardImg = document.getElementById('model-preview-' + modelId);
              if (cardImg) cardImg.src = '/api/models/' + modelId + '/avatar?t=' + Date.now();
              // Invalidate localStorage cache so next load re-fetches
              localStorage.removeItem('l2d-preview-' + modelId);
            }).catch(function() {});
          }, 'image/png');
        } catch(e) {}
      }
    } else {
      settingsShowFlash('保存失败', 'error');
    }
  } catch (err) {
    settingsShowFlash('保存失败: ' + err.message, 'error');
  }
}

  _pendingDeleteModelId = null;
  document.getElementById('deleteModelConfirmModal').classList.remove('active');

function confirmDeleteModel() {
  var modelId = _pendingDeleteModelId;
  _pendingDeleteModelId = null;
  document.getElementById('deleteModelConfirmModal').classList.remove('active');
  if (!modelId) return;
  fetch('/api/models/' + modelId, { method: 'DELETE' })
    .then(function(res) { return res.json(); })
    .then(function(data) {
      if (data.ok) {
        settingsShowFlash('模型已删除');
        settingsCloseCharDetail();
        fetch('/api/character', { cache: 'no-store' })
          .then(function(r) { return r.json(); })

          .catch(function() {});
      } else {
        settingsShowFlash('删除失败: ' + (data.error || ''), 'error');
      }
    })
    .catch(function(err) {
      settingsShowFlash('删除失败: ' + err.message, 'error');
    });
}

function settingsRenderSystemPanel() {
  const cfg = appConfigState || {};
  const isWindowsDesktop = window.__MIRU_DESKTOP_PLATFORM__ === 'windows';
  const hotkeyExample = isWindowsDesktop ? 'Ctrl+Alt+M' : '⌘⌥M';
  let html = '';
  html += '<div class="sync-settings-grid">';

  // Current account invitation code — used to connect the user's own other devices.
  html += '<div class="sync-settings-item" style="grid-column:1 / -1">';
  html += '<label>我的邀请码</label>';
  html += '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">';
  html += '<input id="settingsInvitationCode" type="text" readonly value="加载中..." '
        + 'style="flex:1;min-width:260px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;'
        + 'font-size:13px;letter-spacing:0.02em;padding:9px 12px;background:var(--bg-elevated);'
        + 'border:1px solid var(--border-subtle);border-radius:8px;color:var(--text-primary);">';
  html += '<button type="button" id="settingsCopyInvitationBtn" onclick="_copySettingsInvitationCode()" class="btn" '
        + 'style="padding:8px 14px;font-size:13px;">复制邀请码</button>';
  html += '</div>';
  html += '<div id="settingsInvitationHint" style="margin-top:7px;font-size:12px;color:var(--text-muted);line-height:1.5;">给自己的手机或另一台电脑登录用，请不要发给别人。</div>';
  html += '</div>';

  // Pet hotkey — DESKTOP-ONLY + PER-DEVICE LOCAL.
  //   * Phones don't have a desktop pet, so the UI is hidden in mobile-mode.
  //   * Mac DMG: stored in LOCAL Flask user_settings.json via MiruDesktop bridge
  //     (per-device); pet.html reads it on launch via fetch.
  //   * Browser/PWA: still uses localStorage as a degenerate per-device store
  //     (no desktop pet exists in those contexts anyway).
  //   * `cfg.pet_hotkey` comes from _loadUserSettings — already the correct
  //     local value on Mac DMG (bridge), or VPS default elsewhere.
  if (!_isMobile && !window.MiruAndroid) {
    var hotkeyFromBridge = cfg.pet_hotkey || '';
    var hotkeyFromLs = '';
    try { hotkeyFromLs = localStorage.getItem('miru_pet_hotkey') || ''; } catch (e) {}
    var currentHotkey = hotkeyFromBridge
      || hotkeyFromLs
      || (navigator.platform && navigator.platform.toUpperCase().indexOf('MAC') >= 0
          ? 'cmd+option+m' : 'ctrl+alt+m');
    html += '<div class="sync-settings-item" style="grid-column:1 / -1">';
    html += '<label>桌宠唤醒快捷键</label>';
    html += '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">';
    html += '<input id="settingsSysPetHotkeyDisplay" type="text" readonly '
          + 'value="' + escapeHtml(_formatHotkeyDisplay(currentHotkey)) + '" '
          + 'style="cursor:default;text-align:center;max-width:180px;'
          + 'font-family:-apple-system,system-ui,sans-serif;font-size:16px;'
          + 'padding:8px 12px;background:var(--bg-elevated);'
          + 'border:1px solid var(--border-subtle);border-radius:8px;color:var(--text-primary);">';
    html += '<input id="settingsSysPetHotkey" type="hidden" value="' + escapeHtml(currentHotkey) + '">';
    html += '<button type="button" id="settingsSysPetHotkeyBtn" '
          + 'onclick="_recordHotkey(this)" class="btn" '
          + 'style="padding:8px 14px;font-size:13px;">🎙 录制</button>';
    html += '<button type="button" onclick="_resetHotkey()" class="btn" '
          + 'style="padding:8px 14px;font-size:13px;background:transparent;">恢复默认</button>';
    html += '</div>';
    html += '<div style="margin-top:8px;font-size:12px;color:var(--text-muted);">点"录制"后按下组合键（如 ' + hotkeyExample + '）即可修改。<b>仅对当前这台电脑生效，保存在浏览器本地，不上传服务器。</b>保存后 5 秒内桌宠端自动应用。</div>';
    html += '</div>';
  }

  // Pet auto-collapse delay — same as hotkey, desktop-only + per-device.
  // Stored in localStorage('miru_pet_collapse_delay'), not synced to VPS.
  if (!_isMobile && !window.MiruAndroid) {
    var localDelay = '';
    try { localDelay = localStorage.getItem('miru_pet_collapse_delay') || ''; } catch (e) {}
    var currentDelay = parseInt(localDelay, 10) || cfg.pet_collapse_delay || 4000;
    var delaySec = (currentDelay / 1000).toFixed(1).replace(/\.0$/, '');
    html += '<div class="sync-settings-item">';
    html += '<label>桌宠自动隐去延迟（秒）</label>';
    html += '<input id="settingsSysPetCollapseDelay" class="edit-input" type="number" min="1" max="60" step="0.5" value="' + escapeHtml(delaySec) + '" style="max-width:120px;text-align:center;">';
