<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FFF9F2">
<script src="/assets/js/android-lifecycle-shim.js"></script>
<script>
(function() {
  var params;
  try { params = new URLSearchParams(window.location.search); } catch (e) { return; }
  if (params.get('desktop') !== '1') return;

  window.__MIRU_CLIENT_MODE__ = true;
  window.__MIRU_DESKTOP_PLATFORM__ = params.get('desktop_platform') || 'windows';
  window.__MIRU_LOCAL_BRAND_ASSET_BASE__ = 'http://127.0.0.1:5001';

  function markClientMode() {
    try { document.body.classList.add('client-mode'); } catch (e) {}
  }
  if (document.body) markClientMode();
  else document.addEventListener('DOMContentLoaded', markClientMode);

  function installPywebviewBridge() {
    if (window.MiruDesktop || !window.pywebview || !window.pywebview.api) return;
    var api = window.pywebview.api;
    window.MiruDesktop = {
      getLocalSettings: function() { return api.get_local_settings(); },
      setLocalSettings: function(payload) { return api.set_local_settings(payload || {}); },
      openExternalUrl: function(url) { return api.open_external_url(url || ''); },
      checkScreenPermission: function() { return api.check_screen_permission(); },
      probeScreenCapture: function() { return api.probe_screen_capture(); },
      notifyAppReady: function(payload) { return api.notify_app_ready(payload || {}); }
    };
  }
  installPywebviewBridge();
  window.addEventListener('pywebviewready', installPywebviewBridge);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+JP:wght@400;500;700&display=swap" rel="stylesheet">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Miru</title>
<style>
:root {
  /* === 和風 Light — washi cream base (千恋万花) === */
  --bg-deepest: #F2EBE3;
  --bg-base: #FFF9F2;
  --bg-surface: #FFFFFF;
  --bg-elevated: #FFFFFF;
  --bg-hover: #FFF0E8;
  --bg-input: #FFFBF7;
  /* === Text — sumi ink tones === */
  --text-primary: #3A2E2A;
  --text-secondary: #6B5D54;
  --text-muted: #9A8B7A;
  --text-faint: #BEB0A2;
  /* === Borders — warm subtle === */
  --border-subtle: rgba(58,46,42,0.06);
  --border-default: rgba(58,46,42,0.12);
  --border-hover: rgba(58,46,42,0.20);
  --border-active: rgba(58,46,42,0.30);
  /* === Sakura accent (千恋万花 #FFB7C5) === */
  --airi-pink: #FFB7C5;
  --airi-pink-dim: rgba(255,183,197,0.15);
  --airi-pink-mid: rgba(255,183,197,0.30);
  --airi-pink-glow: 0 0 20px rgba(255,183,197,0.20);
  /* === Functional — darkened for light bg contrast === */
  --fn-success: #4AAA84;
  --fn-warning: #C8983E;
  --fn-danger: #D06060;
  --fn-info: #5A9AB8;
  --fn-special: #9A78A0;
  /* === Categories — darkened for white bg === */
  --cat-a: #5A9AB8;
  --cat-b: #4AAA84;
  --cat-c: #9A78A0;
  --cat-d: #C89848;
  --cat-e: #4AACA8;
  --cat-f: #D08898;
  /* === Shadows — warm brown on light === */
  --shadow-sm: 0 1px 3px rgba(58,46,42,0.08);
  --shadow-md: 0 4px 12px rgba(58,46,42,0.10);
  --shadow-lg: 0 8px 24px rgba(58,46,42,0.14);
  --ease-smooth: cubic-bezier(0.4,0,0.2,1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: "Noto Sans SC", system-ui, -apple-system, sans-serif;
  letter-spacing: 0.02em;
  background:
    radial-gradient(700px 350px at 85% -5%, rgba(255,183,197,0.08), transparent 55%),
    radial-gradient(500px 400px at -5% 105%, rgba(120,196,164,0.04), transparent 50%),
    var(--bg-base);
  color: var(--text-primary);
  height: 100vh;
  display: flex;
  flex-direction: column;
  transition: background 3s ease;
}

header {
  background: rgba(255,249,242,0.85);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border-default);
  box-shadow: 0 1px 0 var(--airi-pink-dim);
  padding: 10px 24px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-block {
  display: flex;
  flex-direction: column;
  min-width: 0;
  gap: 2px;
}

.brand-line {
  display: flex;
  align-items: baseline;
  gap: 10px;
}

header h1 {
  font-family: "Noto Serif JP", "Zen Maru Gothic", "Noto Sans SC", serif;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 0.4px;
  background: linear-gradient(135deg, #E8889A, #C88060);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

header .brand-tagline {
  font-size: 13px;
  color: var(--text-muted);
}

/* Inline days indicator — sits to the right of "Your AI Companion".
   Format: "The 41 Day". The number is the hero (serif, larger,
   pink→violet gradient); the "THE" / "DAY" labels are uppercase-tracked
   italic in a muted tone so they read as a quiet caption around the digit. */
.brand-days {
  display: inline-flex;
  align-items: baseline;
  gap: 5px;
  margin-left: 14px;
  padding-left: 14px;
  border-left: 1px solid var(--airi-pink-dim);
  color: var(--text-muted);
  white-space: nowrap;
}
.brand-days-prefix,
.brand-days-suffix {
  font-family: "Noto Serif JP", Georgia, serif;
  font-size: 11px;
  font-style: italic;
  color: var(--text-muted);
  opacity: 0.7;
  letter-spacing: 1.2px;
  text-transform: uppercase;
}
.brand-days-num {
  font-family: "Noto Serif JP", Georgia, serif;
  font-size: 18px;
  font-weight: 700;
  background: linear-gradient(135deg, #E89BAB, #C9A0DC);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: 0;
  padding: 0 1px;
  line-height: 1;
}

.brand-status {
  display: flex;
  align-items: center;
  min-height: 14px;
  font-size: 11.5px;
  letter-spacing: 0.3px;
  line-height: 1.2;
}
.brand-status-left {
  color: var(--airi-pink);
  font-style: italic;
  transition: opacity 0.18s ease;
}
.brand-status-left:empty { opacity: 0; }

.header-settings-btn {
  margin-left: auto;
  min-width: 52px;
  height: 34px;
  padding: 0 10px;
  border-radius: 8px;
  border: 1px solid var(--border-default);
  background: var(--bg-elevated);
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  line-height: 1;
  transition: background 0.2s, border-color 0.2s;
}

.header-settings-btn:hover {
  background: var(--bg-hover);
  border-color: var(--border-hover);
}

.main {
  flex: 1;
  display: flex;
  overflow: hidden;
  position: relative;
}

/* ===== Sidebar Panel ===== */
.sidebar-panel {
  width: 196px;
  min-width: 196px;
  background: rgba(255,249,242,0.65);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-right: 1px solid var(--border-subtle);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

.sidebar-panel::after {
  content: "";
  position: absolute;
  top: 0;
  right: 0;
  width: 1px;
  height: 100%;
  background: linear-gradient(180deg, var(--airi-pink-dim), transparent 35%, transparent 65%, var(--airi-pink-dim));
  pointer-events: none;
}

.sidebar-nav {
  display: flex;
  flex-direction: column;
  padding: 10px;
  gap: 6px;
}

.sidebar-nav-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 10px;
  border: none;
  border-radius: 10px;
  background: transparent;
  color: var(--text-secondary);
  font-size: 13px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  transition: background 0.25s var(--ease-smooth), color 0.2s, transform 0.2s var(--ease-smooth);
  white-space: nowrap;
  overflow: hidden;
  text-align: left;
}

.sidebar-nav-btn:hover {
  background: var(--airi-pink-dim);
  color: var(--text-primary);
  transform: translateX(2px);
}

.sidebar-nav-btn.active {
  background: var(--airi-pink-mid);
  color: var(--airi-pink);
  box-shadow: var(--airi-pink-glow);
}

.sidebar-nav-btn .nav-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 30px;
  height: 24px;
  border-radius: 6px;
  border: none;
  background: var(--airi-pink-dim);
  color: var(--airi-pink);
  font-size: 11px;
  font-family: "Zen Maru Gothic", "Noto Sans SC", system-ui, sans-serif;
  font-weight: 600;
  letter-spacing: 0.4px;
  text-align: center;
  flex-shrink: 0;
}

.sidebar-nav-btn .nav-label {
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Collapsible sidebar groups */
.sidebar-group {
  display: flex;
  flex-direction: column;
}

.sidebar-group-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 10px;
  border: none;
  border-radius: 10px;
  background: transparent;
  color: var(--text-muted);
  font-size: 13px;
  font-weight: 600;
  font-family: "Zen Maru Gothic", "Noto Sans SC", system-ui, sans-serif;
  cursor: pointer;
  transition: background 0.2s var(--ease-smooth);
  white-space: nowrap;
}

.sidebar-group-header:hover {
  background: var(--airi-pink-dim);
}

.sidebar-group-header .group-chevron {
  margin-left: auto;
  font-size: 10px;
  transition: transform 0.2s;
  color: var(--text-faint);
}

.sidebar-group.expanded .group-chevron {
  transform: rotate(90deg);
}

.sidebar-group-items {
  display: none;
  flex-direction: column;
  gap: 4px;
  padding-left: 12px;
  margin-top: 4px;
}

.sidebar-group.expanded .sidebar-group-items {
  display: flex;
}

.sidebar-group-items .sidebar-nav-btn {
  padding: 7px 10px;
  font-size: 12px;
}



/* ===== Card Panel (Main Area) ===== */
.card-panel {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.airi-side-panel {
  width: 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-left: 0 solid var(--border-default);
  background: var(--bg-surface);
  transition: width 0.2s ease, min-width 0.2s ease, border-color 0.2s ease;
}

.airi-side-panel.open {
  width: 420px;
  min-width: 420px;
  border-left-width: 1px;
}

.airi-side-panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--border-default);
  background: rgba(255,249,242,0.88);
}

.airi-side-panel-title {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.airi-side-panel-title strong {
  font-size: 14px;
  color: var(--text-primary);
}

.airi-side-panel-title span {
  font-size: 12px;
  color: var(--text-muted);
}

.airi-side-panel-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

.airi-side-btn {
  height: 30px;
  padding: 0 10px;
  border-radius: 8px;
  border: 1px solid var(--border-default);
  background: var(--bg-elevated);
  color: var(--text-secondary);
  font-size: 12px;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s;
}

.airi-side-btn:hover {
  background: var(--bg-hover);
  border-color: var(--border-hover);
}

.airi-side-panel-body {
  position: relative;
  flex: 1;
  min-height: 0;
  background: #FFF0EC;
  overflow: hidden;
}

#airiPanelCanvas {
  position: absolute; inset: 0;
  background: #FFF0EC;
  overflow: hidden;
}
#airiPanelCanvas canvas {
  width: 100% !important;
  height: 100% !important;
  object-fit: contain;
  display: block;
}
.airi-sakura {
  position: absolute; inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 1;
}
.airi-petal {
  position: absolute;
  top: -24px;
  border-radius: 50% 0 50% 0;
  opacity: 0;
  animation: airi-petal-fall linear infinite;
  will-change: transform, opacity;
  filter: drop-shadow(0 0 2px rgba(255,160,180,0.3));
}
.ap1 { left: 10%; width: 18px; height: 14px; background: radial-gradient(ellipse at 35% 30%, rgba(255,140,170,0.8), rgba(255,183,197,0.25) 60%, transparent); animation-duration: 12s; animation-delay: 0s; }
.ap2 { left: 30%; width: 13px; height: 11px; background: radial-gradient(ellipse at 35% 30%, rgba(255,160,185,0.75), rgba(255,190,205,0.2) 60%, transparent); animation-duration: 15s; animation-delay: 2.5s; }
.ap3 { left: 55%; width: 20px; height: 16px; background: radial-gradient(ellipse at 35% 30%, rgba(255,130,165,0.75), rgba(255,183,197,0.2) 60%, transparent); animation-duration: 10s; animation-delay: 1s; }
.ap4 { left: 75%; width: 11px; height: 9px; background: radial-gradient(ellipse at 35% 30%, rgba(255,150,178,0.8), rgba(255,200,215,0.25) 60%, transparent); animation-duration: 14s; animation-delay: 4s; }
.ap5 { left: 90%; width: 16px; height: 13px; background: radial-gradient(ellipse at 35% 30%, rgba(255,140,170,0.7), rgba(255,183,197,0.15) 60%, transparent); animation-duration: 11s; animation-delay: 6s; }
@keyframes airi-petal-fall {
  0%   { transform: translateY(-10px) translateX(0) rotate(0deg) scale(1); opacity: 0; }
  6%   { opacity: 0.8; }
  25%  { transform: translateY(25vh) translateX(30px) rotate(80deg) scale(0.95); opacity: 0.65; }
  50%  { transform: translateY(50vh) translateX(-15px) rotate(190deg) scale(0.85); opacity: 0.45; }
  75%  { transform: translateY(75vh) translateX(40px) rotate(300deg) scale(0.7); opacity: 0.25; }
  100% { transform: translateY(105vh) translateX(20px) rotate(400deg) scale(0.55); opacity: 0; }
}

.sidebar-nav-btn.airi-open {
  background: var(--airi-pink-dim);
  border-color: var(--airi-pink);
  color: var(--airi-pink);
}

/* ===== Chat View ===== */
.chat-view {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}
.companion-new-msg-indicator {
  position: absolute;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  background: linear-gradient(135deg, var(--airi-pink), #E8A0A8);
  color: #FFFFFF;
  font-weight: 600;
  padding: 6px 16px;
  border-radius: 20px;
  font-size: 13px;
  cursor: pointer;
  z-index: 10;
  box-shadow: 0 4px 16px rgba(255,183,197,0.3);
  user-select: none;
  transition: box-shadow 0.2s;
}
.companion-new-msg-indicator:hover {
  box-shadow: 0 6px 20px rgba(255,183,197,0.4);
}

.chat-messages {
  flex: 1;
  overflow-y: auto;
  overflow-anchor: none;
  padding: 20px 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  background:
    linear-gradient(180deg, rgba(255,183,197,0.04) 0%, transparent 35%),
    radial-gradient(ellipse 280px 100px at 60% 40%, rgba(255,249,242,0.5), transparent);
}

.chat-time-separator {
  text-align: center;
  color: var(--text-faint);
  font-size: 12px;
  padding: 8px 0;
  position: relative;
}

.chat-time-separator::before,
.chat-time-separator::after {
  content: '';
  position: absolute;
  top: 50%;
  width: 30%;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--border-default), transparent);
}

.chat-time-separator::before { left: 0; }
.chat-time-separator::after { right: 0; }

.chat-bubble-wrapper {
  display: flex;
  flex-direction: column;
  max-width: 75%;
}

.chat-bubble-wrapper.user {
  align-self: flex-end;
  align-items: flex-end;
}

.chat-bubble-wrapper.system {
  align-self: flex-start;
  align-items: flex-start;
  flex-direction: row;
  gap: 10px;
}

.system-avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  flex-shrink: 0;
  object-fit: cover;
  border: 2px solid var(--airi-pink);
  box-shadow: 0 0 12px var(--airi-pink-dim), 0 0 4px var(--airi-pink-dim);
  transition: box-shadow 0.4s var(--ease-smooth);
}

.system-content {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 6px;
}

.chat-bubble {
  padding: 10px 14px;
  border-radius: 12px;
  font-size: 14px;
  line-height: 1.6;
  word-break: break-word;
}

.chat-bubble.user-bubble {
  background: #FFF0E8;
  color: var(--text-primary);
  border: 1px solid rgba(58,46,42,0.08);
  border-bottom-right-radius: 4px;
  box-shadow: 0 2px 8px rgba(58,46,42,0.06);
}

.chat-bubble.system-bubble {
  background: #FFFFFF;
  border: 1px solid rgba(255,183,197,0.20);
  color: var(--text-primary);
  border-bottom-left-radius: 4px;
  box-shadow: 0 2px 12px rgba(255,183,197,0.08);
}

/* Markdown in chat bubbles */
.md-bubble p { margin: 0 0 0.4em; }
.md-bubble p:last-child { margin-bottom: 0; }
.md-bubble strong { color: var(--text-primary); }
.md-bubble ul { margin: 4px 0; padding-left: 1.4em; }
.md-bubble li { margin: 2px 0; }
.md-inline-code {
  padding: 1px 5px;
  border-radius: 4px;
  background: rgba(58,46,42,0.08);
  font-family: 'SF Mono', 'Menlo', monospace;
  font-size: 0.88em;
}
.md-code-block {
  margin: 6px 0;
  padding: 8px 10px;
  border-radius: 6px;
  background: #F2EBE3;
  overflow-x: auto;
}
.md-code-block code {
  font-family: 'SF Mono', 'Menlo', monospace;
  font-size: 0.85em;
  white-space: pre;
  background: none;
  padding: 0;
}
.md-bubble a { color: var(--fn-info); text-decoration: underline; }
.md-bubble del { opacity: 0.6; }

.chat-bubble-status {
  font-size: 11px;
  color: var(--text-faint);
  margin-top: 4px;
  padding: 0 4px;
}

/* Group-head time anchor (微信式) — 2026-05-16
 * Shows above first message of a 5-min cluster, role-agnostic.
 * No horizontal divider lines (those are for cross-day separators);
 * just centered light text to mark "this is when this cluster began". */
.chat-time-anchor {
  text-align: center;
  color: var(--text-faint);
  font-size: 11px;
  padding: 12px 0 4px;
  letter-spacing: 0.5px;
}

.chat-bubble-image {
  max-width: 200px;
  max-height: 140px;
  border-radius: 8px;
  margin-top: 6px;
  border: 1px solid var(--border-default);
}

.chat-bubble-wrapper.user {
  position: relative;
}



.chat-loading-indicator {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  background: rgba(255,183,197,0.06);
  border: 1px solid rgba(255,183,197,0.10);
  border-radius: 14px;
  border-bottom-left-radius: 4px;
  max-width: 200px;
  color: var(--text-muted);
  font-size: 13px;
}

.chat-loading-indicator .spinner {
  width: 16px;
  height: 16px;
  border-width: 2px;
}

/* Mobile header subtitle — sits under the character name when typing.
   The center column flips to a vertical stack (name on top, subtitle
   below) only when the subtitle has content; otherwise the name stays
   single-line and centered. */
#mobileHeaderSubtitle {
  display: block;
  font-size: 11px;
  font-weight: 400;
  color: var(--text-muted);
  line-height: 1.2;
  margin-top: 1px;
  min-height: 0;             /* collapse when empty so name stays centered */
  transition: opacity 0.15s ease;
}
/* Mobile two-mode subtitle: typing string OR structured days indicator.
   Mirrors the desktop typography: serif italic uppercase labels, the
   number is the visual hero (serif bold pink→violet gradient). */
.m-typing:empty { display: none; }
.m-days {
  display: inline-flex;
  align-items: baseline;
  gap: 4px;
}
.m-days-prefix,
.m-days-suffix {
  font-family: "Noto Serif JP", Georgia, serif;
  font-size: 9.5px;
  font-style: italic;
  color: var(--text-muted);
  opacity: 0.75;
  letter-spacing: 1.1px;
  text-transform: uppercase;
}
.m-days-num {
  font-family: "Noto Serif JP", Georgia, serif;
  font-size: 14px;
  font-weight: 700;
  background: linear-gradient(135deg, #E89BAB, #C9A0DC);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: 0;
  line-height: 1;
}

/* Companion Chat Action Tags */
.companion-actions-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}

.companion-action-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 500;
}

.companion-action-tag.action-add-task {
  background: rgba(120,196,164,0.10);
  color: var(--fn-success);
  border: 1px solid rgba(120,196,164,0.25);
}

.companion-action-tag.action-complete-task {
  background: rgba(168,200,216,0.10);
  color: var(--fn-info);
  border: 1px solid rgba(168,200,216,0.25);
}

.companion-action-tag.action-update-schedule {
  background: rgba(232,200,160,0.10);
  color: var(--fn-warning);
  border: 1px solid rgba(232,200,160,0.25);
}

.companion-action-tag.action-error {
  background: rgba(208,120,120,0.10);
  color: var(--fn-danger);
  border: 1px solid rgba(208,120,120,0.25);
}

.companion-action-tag.action-query {
  background: rgba(58,46,42,0.05);
  color: var(--text-muted);
  border: 1px solid var(--border-default);
}

/* ===== Detail View ===== */
.detail-view {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.detail-header {
  padding: 12px 24px;
  border-bottom: 1px solid var(--border-default);
  background: rgba(255,249,242,0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  display: flex;
  align-items: center;
}

.detail-back-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--bg-hover);
  border: none;
  color: var(--text-secondary);
  padding: 6px 14px;
  border-radius: 8px;
  font-size: 13px;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.2s var(--ease-smooth);
}

.detail-back-btn:hover { background: var(--airi-pink-dim); color: var(--airi-pink); }

.detail-content {
  flex: 1;
  overflow-y: auto;
  padding: 24px 32px;
}

/* ===== Card styles (reused in detail) ===== */
.card {
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  border-radius: 16px;
  padding: 24px;
  max-width: 720px;
  box-shadow: var(--shadow-md), inset 0 -1px 0 rgba(58,46,42,0.04);
}

.card-status {
  display: inline-block;
  font-size: 12px;
  padding: 3px 10px;
  border-radius: 10px;
  margin-bottom: 16px;
}

.card h2 {
  font-size: 18px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 20px;
  line-height: 1.4;
  font-family: "Zen Maru Gothic", "Noto Sans SC", system-ui, sans-serif;
}

.card-section {
  margin-bottom: 20px;
}

.card-section-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
}

.card-section-body {
  font-size: 14px;
  line-height: 1.6;
  color: var(--text-secondary);
}

.person-tag {
  display: inline-block;
  background: var(--airi-pink-dim);
  border: 1px solid rgba(255,183,197,0.2);
  color: var(--airi-pink);
  padding: 4px 12px;
  border-radius: 9999px;
  font-size: 13px;
  margin: 3px 4px 3px 0;
}

.person-tag .relation {
  color: var(--text-muted);
  font-size: 11px;
  margin-left: 4px;
}

.task-item {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: 10px;
  padding: 12px 16px;
  margin-bottom: 8px;
}

.task-item .task-title {
  font-weight: 600;
  font-size: 14px;
  color: var(--text-primary);
}

.task-item .task-meta {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 4px;
}

.priority-high { border-left: 3px solid var(--fn-danger); }
.priority-medium { border-left: 3px solid var(--fn-warning); }
.priority-low { border-left: 3px solid var(--fn-success); }

.card-actions {
  display: flex;
  gap: 10px;
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid var(--border-subtle);
}

.btn {
  padding: 8px 20px;
  border: none;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.15s var(--ease-smooth), box-shadow 0.2s, opacity 0.15s;
  letter-spacing: 0.02em;
  position: relative;
  overflow: hidden;
}

.btn:hover:not(:disabled) { transform: translateY(-1px); }

.btn-confirm { background: linear-gradient(135deg, var(--fn-success), #68B89A); color: #FFFFFF; }
.btn-confirm:hover { box-shadow: 0 4px 12px rgba(120,196,164,0.3); }
.btn-edit { background: linear-gradient(135deg, var(--fn-warning), #D8B890); color: #FFFFFF; }
.btn-reject { background: linear-gradient(135deg, var(--fn-danger), #D07878); color: #fff; }
.btn-save { background: linear-gradient(135deg, var(--fn-success), #68B89A); color: #FFFFFF; }
.btn-cancel { background: var(--bg-hover); color: var(--text-secondary); border: 1px solid var(--border-default); }
.btn-danger { background: linear-gradient(135deg, var(--fn-danger), #D07878); color: #fff; border: 1px solid rgba(208,120,120,0.3); }
.btn-danger:disabled { opacity: 0.5; cursor: not-allowed; }

.danger-zone {
  margin-top: 14px;
  padding: 12px 14px;
  border: 1px solid rgba(208,120,120,0.4);
  border-radius: 10px;
  background: rgba(208,120,120,0.06);
}

.danger-zone-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--fn-danger);
  margin-bottom: 6px;
}

.danger-zone-text {
  font-size: 12px;
  color: var(--text-secondary);
  line-height: 1.6;
}

/* Editable fields */
.edit-input {
  width: 100%;
  background: var(--bg-input);
  border: 1px solid var(--border-default);
  color: var(--text-primary);
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 14px;
  font-family: inherit;
  resize: vertical;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.edit-input:focus {
  outline: none;
  border-color: var(--airi-pink);
  box-shadow: 0 0 0 3px var(--airi-pink-dim);
}

/* Input Bar */
.input-bar {
  background: rgba(255,249,242,0.85);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid var(--border-default);
  padding: 16px 24px;
  display: flex;
  align-items: flex-end;
  gap: 12px;
}

.input-bar textarea {
  flex: 1;
  background: var(--bg-input);
  border: 1px solid var(--border-default);
  color: var(--text-primary);
  border-radius: 12px;
  padding: 10px 14px;
  font-size: 14px;
  font-family: inherit;
  resize: none;
  min-height: 44px;
  max-height: 160px;
  height: 44px;
  line-height: 24px;
  overflow-y: auto;
  white-space: pre-wrap;
  word-wrap: break-word;
  cursor: text;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.input-bar textarea:focus {
  outline: none;
  border-color: var(--airi-pink);
  box-shadow: 0 0 0 3px var(--airi-pink-dim);
}

.voice-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  border: 1px solid var(--border-default);
  border-radius: 10px;
  background: var(--bg-elevated);
  color: var(--text-muted);
  font-size: 18px;
  cursor: pointer;
  transition: background 0.2s, box-shadow 0.2s, color 0.2s;
  flex-shrink: 0;
}

.voice-btn:hover {
  background: var(--bg-hover);
  color: var(--text-primary);
}

.voice-btn.voice-active {
  background: var(--fn-danger);
  border-color: var(--fn-danger);
  color: #fff;
  animation: voice-pulse-main 1.5s ease-in-out infinite;
}

.voice-btn.voice-unsupported {
  opacity: 0.3;
  cursor: default;
}

@keyframes voice-pulse-main {
  0%, 100% { box-shadow: 0 0 0 3px rgba(248, 81, 73, 0.3); }
  50% { box-shadow: 0 0 0 6px rgba(248, 81, 73, 0.1); }
}

.file-label {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 52px;
  height: 44px;
  padding: 0 10px;
  background: var(--bg-elevated);
  border: 1px solid var(--border-default);
  border-radius: 10px;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s, color 0.2s;
  color: var(--text-muted);
  font-size: 12px;
  font-weight: 600;
}

.file-label:hover { background: var(--bg-hover); }
.file-label.has-file { color: var(--airi-pink); border-color: var(--airi-pink); }

.file-label input { display: none; }

.send-btn {
  min-width: 56px;
  height: 44px;
  padding: 0 12px;
  background: linear-gradient(135deg, var(--airi-pink), #E8A0A8);
  border: none;
  border-radius: 10px;
  cursor: pointer;
  color: #FFFFFF;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.2s var(--ease-smooth), box-shadow 0.2s;
}

.send-btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(255,183,197,0.3); }
.send-btn:disabled { opacity: 0.4; cursor: not-allowed; }


.file-name {
  font-size: 12px;
  color: var(--fn-info);
  max-width: 120px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Loading */
.loading {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 32px;
  color: var(--text-muted);
}

.spinner {
  width: 24px;
  height: 24px;
  border: 3px solid var(--border-default);
  border-top-color: var(--airi-pink);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* Image preview */
.msg-image {
  max-width: 200px;
  max-height: 140px;
  border-radius: 6px;
  margin-top: 8px;
  border: 1px solid var(--border-default);
}

/* Input Bar Wrapper — 2026-05-17
 * 它写在 .main flex 容器**外面** (HTML 层级问题, 跟 history 兼容), 默认占满
 * 窗口宽度. 用 padding-left 把它的可视边界往右推到 sidebar 右侧, 这样
 * input-bar 跟上面的对话内容左边对齐, 不再覆盖左 sidebar.
 * - 桌面: 196px 跟 .sidebar-panel 的 width hardcoded 保持一致
 * - mobile: sidebar 被隐藏 (body.mobile-mode 下), padding-left 重置到 0
 * - client-mode (DMG): 沿用桌面规则; 如未来引入更窄 sidebar 再分开 override
 */
.input-bar-wrapper {
  position: relative;
  padding-left: 196px;
  box-sizing: border-box;
  transition: padding-left 0.2s ease;
}

/* Query result cards */
.query-result-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}

.query-result-header h2 {
  font-size: 18px;
  font-weight: 600;
  color: var(--text-primary);
}

.person-card {
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  border-radius: 14px;
  padding: 16px 20px;
  margin-bottom: 12px;
  box-shadow: var(--shadow-sm), inset 0 -1px 0 rgba(58,46,42,0.04);
  transition: transform 0.25s var(--ease-smooth), box-shadow 0.25s;
}

.person-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}

.person-card .person-name {
  font-size: 16px;
  font-weight: 600;
  color: var(--fn-info);
}

.person-card .person-relation {
  font-size: 13px;
  color: var(--text-muted);
  margin-left: 8px;
}

.person-card .person-context {
  font-size: 13px;
  color: var(--text-primary);
  margin-top: 6px;
  line-height: 1.5;
}

.person-card .person-mentions {
  margin-top: 8px;
  font-size: 12px;
  color: var(--text-faint);
}

.person-mentions-header {
  font-size: 12px;
  color: var(--text-faint);
  margin-top: 10px;
  margin-bottom: 6px;
}

.mention-item {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: 6px;
  padding: 8px 12px;
  margin-top: 6px;
  border-left: 2px solid var(--fn-info);
}

.mention-item .mention-time {
  font-size: 11px;
  color: var(--text-faint);
}

.mention-item .mention-relation {
  font-size: 11px;
  color: var(--text-muted);
  margin-left: 8px;
  background: var(--bg-surface);
  padding: 1px 6px;
  border-radius: 4px;
}

.mention-item .mention-context {
  font-size: 13px;
  color: var(--text-primary);
  margin-top: 4px;
  line-height: 1.5;
}

.person-tags {
  display: inline-flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-left: 8px;
  vertical-align: middle;
}

.tag-chip {
  display: inline-block;
  background: rgba(168,200,216,0.10);
  border: 1px solid rgba(168,200,216,0.20);
  color: var(--fn-info);
  font-size: 11px;
  padding: 1px 8px;
  border-radius: 10px;
  max-width: 180px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  vertical-align: middle;
}

.priority-group-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin: 16px 0 8px;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--border-default);
}

.priority-group-title:first-child {
  margin-top: 0;
}

.no-data-hint {
  text-align: center;
  color: var(--text-faint);
  padding: 40px 0;
  font-size: 14px;
}

/* Daily Review */
.review-card {
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  border-radius: 16px;
  padding: 24px;
  max-width: 720px;
  box-shadow: var(--shadow-md), inset 0 -1px 0 rgba(58,46,42,0.04);
}

.review-header {
  margin-bottom: 24px;
}

.review-header .review-date {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 8px;
}

.review-header .review-oneline {
  font-size: 18px;
  font-weight: 600;
  color: var(--text-primary);
  line-height: 1.4;
  font-family: "Zen Maru Gothic", "Noto Sans SC", system-ui, sans-serif;
}

.review-section {
  margin-bottom: 16px;
  border: 1px solid var(--border-subtle);
  border-radius: 12px;
  overflow: hidden;
}

.review-section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  background: var(--bg-surface);
  cursor: pointer;
  user-select: none;
  transition: background 0.2s var(--ease-smooth);
}

.review-section-header:hover {
  background: var(--bg-elevated);
}

.review-section-header .section-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-secondary);
}

.review-section-header .section-count {
  font-size: 12px;
  color: var(--text-faint);
  background: var(--bg-hover);
  padding: 2px 8px;
  border-radius: 10px;
}

.review-section-header .section-arrow {
  font-size: 12px;
  color: var(--text-faint);
  transition: transform 0.2s;
}

.review-section-header.collapsed .section-arrow {

}

.review-section-body {
  padding: 8px;
}

.review-section-body.hidden {
  display: none;
}

.review-item {
  display: flex;
  align-items: center;
  justify-content: space-between;

}

.review-item:hover {
  background: var(--bg-surface);
}

.review-item:last-child {
  margin-bottom: 0;
}

.review-item .item-text {

}

.item-source-btn {
  font-size: 12px;
  color: var(--fn-info);
  background: none;
  border: 1px solid rgba(168,200,216,0.25);
  border-radius: 4px;

}

.item-source-btn:hover {

}

.review-person-item {

  align-items: center;
  gap: 12px;

  border-radius: 6px;

}

.review-person-item:hover {
  background: var(--bg-surface);
}

.review-person-item .person-name-label {
  font-size: 14px;
  font-weight: 600;
  color: var(--fn-info);
}

.review-person-item .person-interaction {
  font-size: 13px;
  color: var(--text-muted);
  flex: 1;
}

/* ===== Tomorrow Plan Styles ===== */
.plan-top3-item {
  display: flex;
  gap: 12px;
  padding: 12px;
  border-radius: 10px;
  margin-bottom: 8px;
  background: var(--bg-surface);
}

.plan-top3-item:last-child {
  margin-bottom: 0;
}

.plan-top3-rank {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--fn-info);
  color: #FFFFFF;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 14px;
  flex-shrink: 0;
  margin-top: 2px;
}

.plan-top3-rank.rank-1 { background: var(--fn-warning); }
.plan-top3-rank.rank-2 { background: var(--fn-info); }
.plan-top3-rank.rank-3 { background: var(--text-muted); }

.plan-top3-content {
  flex: 1;
  min-width: 0;
}

.plan-top3-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 4px;
}

.plan-top3-reason {

  color: var(--text-muted);
  font-style: italic;
  line-height: 1.4;
  margin-bottom: 4px;
}

.plan-top3-meta {

  gap: 12px;

}

.plan-schedule-item {

.plan-schedule-item:last-child {

.plan-schedule-dot {

.plan-schedule-task {
  font-size: 14px;
  color: var(--text-primary);

.plan-type-tag {

.plan-risk-icon {

.plan-risk-content {

.plan-risk-text {

}

.plan-risk-suggestion {

  color: var(--text-muted);
}

  animation: reminderSlideIn 0.4s ease-out;
}

.reminder-avatar {

  height: 48px;
  border-radius: 50%;
  border: 2px solid var(--airi-pink);

.reminder-content {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}

.reminder-name {
  font-size: 12px;
  font-weight: 600;
  color: var(--airi-pink);
}

.reminder-text {
  background: rgba(255,183,197,0.06);
  border: 1px solid rgba(255,183,197,0.10);
  border-radius: 14px;
  border-top-left-radius: 4px;
  padding: 10px 14px;
  font-size: 14px;
  line-height: 1.6;
  color: var(--text-primary);
  word-break: break-word;
}

.reminder-image-container {
  width: 200px;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid var(--border-default);
}

.reminder-image-container img {
  width: 100%;
  display: block;
  cursor: pointer;
}

/* Image lightbox overlay */
.image-lightbox {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: rgba(58,46,42,0.75);
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.image-lightbox.active {
  display: flex;
}

.image-lightbox img {
  max-width: 90vw;
  max-height: 90vh;
  border-radius: 8px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.6);
}


.reminder-image-loading {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 16px;
  color: var(--text-muted);
  font-size: 12px;
  background: var(--bg-surface);
}

.reminder-image-loading .spinner {
  width: 14px;
  height: 14px;
  border-width: 2px;
}

.reminder-time {
  font-size: 11px;
  color: var(--text-faint);
}

@keyframes reminderSlideIn {
  from { opacity: 0; transform: translateX(-20px); }
  to { opacity: 1; transform: translateX(0); }
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.reminder-text-hidden {
  display: none;
}

.reminder-text-fadein {
  animation: fadeIn 0.5s ease-in forwards;
}

/* Empty chat state */
.empty-chat-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex: 1;
  color: var(--text-muted);
  gap: 8px;
}

.empty-chat-state .icon {
  font-size: 24px;
  font-family: "Zen Maru Gothic", "Noto Sans SC", system-ui, sans-serif;
  letter-spacing: 1px;
  width: 64px;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--airi-pink);
  border: 2px solid var(--airi-pink);
  border-radius: 50%;
  background: var(--airi-pink-dim);
  box-shadow: var(--airi-pink-glow);
  margin-bottom: 12px;
  animation: breathe 3.5s ease-in-out infinite;
}

.empty-chat-state p {
  font-size: 15px;
  font-family: "Zen Maru Gothic", "Noto Sans SC", system-ui, sans-serif;
  color: var(--text-secondary);
}

/* Scrollbar */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(58,46,42,0.15); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--airi-pink); }

/* Selection & Focus */
::selection { background: var(--airi-pink-mid); color: #FFFFFF; }
:focus-visible { outline: 2px solid var(--airi-pink); outline-offset: 2px; }

/* Bubble entrance animation */
.chat-bubble-wrapper { animation: bubbleIn 0.3s var(--ease-smooth); }
@keyframes bubbleIn {
  from { opacity: 0; transform: translateY(10px) scale(0.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
/* View fade in */
.chat-view, .detail-view { animation: viewFadeIn 0.25s ease-out; }
@keyframes viewFadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}
/* Breathe animation for empty states */
@keyframes breathe {
  0%, 100% { box-shadow: 0 0 20px var(--airi-pink-dim); transform: scale(1); }
  50% { box-shadow: 0 0 40px rgba(255,183,197,0.2); transform: scale(1.03); }
}

/* PWA update toast */
.update-toast {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 9998;
  background: linear-gradient(135deg, var(--airi-pink), var(--fn-special));
  color: #FFFFFF;
  font-weight: 600;
  padding: 10px 16px;
  font-size: 14px;
  text-align: center;
  cursor: pointer;
  animation: slideDown 0.3s ease;
}
.update-toast.show { display: block; }
@keyframes slideDown { from { transform: translateY(-100%); } to { transform: translateY(0); } }

/* Header refresh button */
.header-refresh-btn {
  display: none;
  margin-left: 0;
  background: none;
  border: 1px solid var(--border-default);
  color: var(--text-muted);
  border-radius: 8px;
  padding: 4px 10px;
  font-size: 13px;
  cursor: pointer;
  transition: color 0.2s, border-color 0.2s;
}
.header-refresh-btn:hover { color: var(--airi-pink); border-color: var(--airi-pink); }
.header-refresh-btn.spinning { animation: spin 0.8s linear; }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

.header-exit-btn {
  display: none;
  margin-left: 0;
  background: none;
  border: 1px solid rgba(208,120,120,0.4);
  color: var(--fn-danger);
  border-radius: 8px;
  padding: 4px 10px;
  font-size: 13px;
  cursor: pointer;
  transition: background 0.2s, color 0.2s;
}
.header-exit-btn:hover { background: var(--fn-danger); color: #fff; }

.header-pet-btn {
  margin-left: 0;
  background: none;
  border: 1px solid var(--airi-pink);
  color: var(--airi-pink);
  border-radius: 8px;
  padding: 4px 10px;
  font-size: 13px;
  cursor: pointer;
  transition: background 0.2s, color 0.2s;
  display: none;
}
.header-pet-btn:hover { background: var(--airi-pink); color: #fff; }





/* ===== Sync Settings ===== */
.sync-settings-form {
  max-width: 860px;
}

.sync-settings-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 12px;
}

.sync-settings-item {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: 10px;
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.sync-settings-item label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  line-height: 1.5;
}

.sync-toggle-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--text-primary);
}

.sync-status-box {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: 10px;
  padding: 12px 14px;
  font-size: 13px;
  line-height: 1.75;
  color: var(--text-primary);
}

.sync-status-ok { color: var(--fn-success); }
.sync-status-bad { color: var(--fn-danger); }

/* Identity settings — styles injected via settingsRenderIdentityPanel() */

.identity-timestamp {
  font-size: 12px;
  color: var(--text-muted);
}

/* ===== Miru Journal (new: narrative book + list) ===== */

/* List view — vertical timeline of days */
.journal-list {
  max-width: 680px;
  margin: 12px auto 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.journal-row {
  display: flex;
  gap: 16px;
  padding: 16px 18px;
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  border-radius: 14px;
  cursor: pointer;
  transition: transform 0.2s var(--ease-smooth), box-shadow 0.2s, border-color 0.2s;
}
.journal-row:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
  border-color: var(--airi-pink-mid);
}
.jr-left {
  flex: 0 0 64px;
  text-align: center;
  border-right: 1px solid var(--border-subtle);
  padding-right: 12px;
}
.jr-day {
  font-size: 32px;
  font-weight: 700;
  line-height: 1;
  color: var(--text-primary);
  font-family: Georgia, 'Songti SC', serif;
}
.jr-meta {
  font-size: 11px;
  color: var(--text-faint);
  margin-top: 6px;
  line-height: 1.5;
}
.jr-body { flex: 1; min-width: 0; }
.jr-title-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 4px;
}
.jr-emoji { font-size: 20px; }
.jr-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text-primary);
  line-height: 1.4;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.jr-mood {
  font-size: 12px;
  color: #C06878;
  letter-spacing: 0.03em;
}
.jr-legacy-hint {
  font-size: 11px;
  color: var(--text-faint);
  font-style: italic;
  margin-top: 4px;
}
.journal-row.jr-today-pending {
  cursor: default;
  opacity: 0.88;
  background: linear-gradient(135deg, var(--bg-elevated), rgba(192,104,120,0.04));
}
.journal-row.jr-today-pending:hover {
  transform: none;
  box-shadow: none;
  border-color: var(--border-subtle);
}
.journal-row.jr-today-pending .jr-today-wait {
  font-size: 12px;
  color: #C06878;
  margin-top: 6px;
  line-height: 1.5;
  font-style: normal;
}

/* Book view — single day, share-friendly */
.journal-book {
  max-width: 560px;
  margin: 0 auto;
  padding: 0 16px 24px;
}
.journal-book-page {
  background: linear-gradient(180deg, #FCF6EC 0%, #F5EEE1 100%);
  border: 1px solid #E8DCC7;
  border-radius: 18px;
  padding: 32px 28px 28px;
  box-shadow: 0 4px 20px rgba(100, 72, 50, 0.08);
  position: relative;
  font-family: Georgia, 'Songti SC', 'STSong', serif;
  color: #3A2A1E;
}
.journal-book-page::before {
  content: '';
  position: absolute;
  top: 0; left: 32px; right: 32px;
  height: 3px;
  background: linear-gradient(90deg, transparent, #C09672 30%, #C09672 70%, transparent);
  border-radius: 0 0 3px 3px;
}
.jb-cover {
  text-align: center;
  padding-bottom: 18px;
  margin-bottom: 20px;
  border-bottom: 1px dashed #D6C6AD;
}
.jb-date-big {
  font-size: 60px;
  font-weight: 400;
  line-height: 1;
  color: #5C4636;
  letter-spacing: -0.02em;
}
.jb-date-meta {
  font-size: 13px;
  color: #8B7358;
  margin-top: 8px;
  letter-spacing: 0.05em;
}
.jb-mood {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 14px;
  padding: 5px 14px;
  background: rgba(192, 104, 120, 0.1);
  border: 1px solid rgba(192, 104, 120, 0.25);
  border-radius: 14px;
}
.jb-mood-emoji { font-size: 18px; }
.jb-mood-label {
  font-size: 13px;
  color: #C06878;
  letter-spacing: 0.03em;
}
.jb-title {
  font-size: 20px;
  font-weight: 600;
  text-align: center;
  color: #3A2A1E;
  margin-bottom: 20px;
  line-height: 1.5;
  font-family: Georgia, 'Songti SC', serif;
}
.jb-narrative {
  font-size: 15px;
  line-height: 2.0;
  color: #3A2A1E;
  text-indent: 2em;
}
.jb-narrative p {
  margin: 0 0 14px;
}
.jb-narrative p:last-child {
  margin-bottom: 0;
}
.jb-highlights {
  margin-top: 28px;
  padding-top: 20px;
  border-top: 1px dashed #D6C6AD;
}
.jb-highlights-label {
  font-size: 12px;
  color: #8B7358;
  letter-spacing: 0.2em;
  margin-bottom: 12px;
  text-align: center;
}
.jb-highlight {
  padding: 8px 0;
  display: flex;
  gap: 12px;
  align-items: baseline;
  font-size: 13.5px;
  line-height: 1.7;
}
.jb-highlight-time {
  flex: 0 0 42px;
  font-family: 'SF Mono', Menlo, monospace;
  font-size: 12px;
  color: #C09672;
  letter-spacing: 0.03em;
}
.jb-highlight-text {
  color: #3A2A1E;
  flex: 1;
}
.jb-signature {
  text-align: right;
  margin-top: 28px;
  font-size: 15px;
  color: #5C4636;
  font-style: italic;
  letter-spacing: 0.08em;
}
.jb-stats {
  margin-top: 18px;
  padding-top: 14px;
  border-top: 1px dashed #D6C6AD;
  font-size: 11px;
  color: #A08869;
  text-align: center;
  letter-spacing: 0.03em;
}
.jb-stats span { margin: 0 2px; }
.jb-legacy-badge {
  margin-top: 16px;
  padding: 8px 12px;
  background: rgba(192, 150, 114, 0.12);
  border: 1px dashed #C09672;
  border-radius: 8px;
  font-size: 12px;
  color: #8B7358;
  text-align: center;
}

/* Action bar outside the page (not captured in PNG) */
.journal-book-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 18px;
  padding: 0 4px;
  gap: 8px;
}
.jba-center {
  display: flex;
  gap: 8px;
}
.jba-btn {
  border: 1px solid var(--border-default);
  background: var(--bg-elevated);
  color: var(--text-secondary);
  padding: 7px 14px;
  border-radius: 10px;
  font-size: 13px;
  cursor: pointer;
  transition: border-color 0.2s, color 0.2s;
}
.jba-btn:hover {
  border-color: var(--airi-pink);
  color: var(--airi-pink);
}
.jba-btn.jba-share {
  background: var(--airi-pink);
  border-color: var(--airi-pink);
  color: #fff;
}
.jba-btn.jba-share:hover {
  color: #fff;
  opacity: 0.9;
}

/* Mobile — tighter padding */
@media (max-width: 640px) {
  .journal-book { padding: 0 8px 20px; }
  .journal-book-page { padding: 24px 18px; border-radius: 14px; }
  .jb-date-big { font-size: 48px; }
  .jb-title { font-size: 17px; }
  .jb-narrative { font-size: 14.5px; line-height: 1.95; }
  .journal-row { padding: 12px 14px; }
  .jr-day { font-size: 26px; }
  .journal-list { max-width: 100%; }
}

/* ===== Memory Browser ===== */
.memory-browser {
  max-width: 720px;
  margin: 0 auto;
}
.memory-search-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
}
.memory-search-input {
  flex: 1;
  padding: 10px 14px;
  border: 1px solid var(--border-default);
  border-radius: 10px;
  background: var(--bg-input);
  color: var(--text-primary);
  font-size: 14px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.2s;
}
.memory-search-input:focus {
  border-color: var(--airi-pink);
}
.memory-search-input::placeholder {
  color: var(--text-faint);
}
.memory-dir-section {
  margin-bottom: 20px;
}
.memory-dir-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 0;
  cursor: pointer;
  user-select: none;
}
.memory-dir-icon {
  font-size: 18px;
  width: 28px;
  text-align: center;
}
.memory-dir-name {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
}
.memory-dir-count {
  font-size: 12px;
  color: var(--text-faint);
  margin-left: auto;
}
.memory-dir-arrow {
  font-size: 11px;
  color: var(--text-faint);
  transition: transform 0.2s;
}
.memory-dir-header.collapsed .memory-dir-arrow {
  transform: rotate(-90deg);
}
.memory-file-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px;
  padding-left: 36px;
}
.memory-file-card {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 12px 16px;
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  border-radius: 10px;
  cursor: pointer;
  transition: transform 0.2s var(--ease-smooth), box-shadow 0.2s, border-color 0.2s;
}
.memory-file-card:hover {
  transform: translateX(4px);
  box-shadow: var(--shadow-sm);
  border-color: var(--airi-pink-mid);
}
.memory-file-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
}
.memory-file-preview {
  font-size: 12.5px;
  color: var(--text-muted);
  line-height: 1.5;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.memory-file-meta {
  display: flex;
  gap: 10px;
  font-size: 11px;
  color: var(--text-faint);
}
.memory-index-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 18px;
  background: linear-gradient(135deg, #FFF9F2, #FFF0E8);
  border: 1px solid var(--airi-pink-mid);
  border-radius: 12px;
  cursor: pointer;
  margin-bottom: 20px;
  transition: box-shadow 0.2s;
}
.memory-index-card:hover {
  box-shadow: var(--shadow-md);
}

/* === Memory v2 — Slot UI === */
.memory-quick-entries .memory-index-card { margin-bottom: 12px; }
.memory-quick-entries { display: grid; gap: 8px; margin-bottom: 18px; }

.memory-tabs {
  display: flex;
  gap: 6px;
  margin: 18px 0 14px;
  border-bottom: 1px solid var(--border-subtle);
  padding-bottom: 0;
  overflow-x: auto;
}
.memory-tab-btn {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 14px;
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  color: var(--text-muted);
  font-size: 14px;
  border-radius: 6px 6px 0 0;
  transition: color 0.15s, border-color 0.15s, background 0.15s;
}
.memory-tab-btn:hover { background: var(--bg-elevated); color: var(--text-primary); }
.memory-tab-btn.active {
  color: var(--airi-pink);
  border-bottom-color: var(--airi-pink);
  font-weight: 600;
}
.memory-tab-icon { font-size: 16px; }
.memory-tab-count {
  background: var(--bg-elevated);
  padding: 1px 8px;
  border-radius: 10px;
  font-size: 12px;
  color: var(--text-secondary);
}
.memory-tab-btn.active .memory-tab-count {
  background: var(--airi-pink-mid);
  color: var(--airi-pink);
}

.memory-slots-area { min-height: 200px; }

.slot-empty {
  padding: 40px 20px;
  text-align: center;
  color: var(--text-muted);
  background: var(--bg-elevated);
  border-radius: 12px;
  border: 1px dashed var(--border-subtle);
}

.slot-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 12px;
  margin-bottom: 14px;
}
.slot-card {
  background: linear-gradient(135deg, #FFFCF8, #FFF6EE);
  border: 1px solid var(--airi-pink-mid);
  border-radius: 12px;
  padding: 14px 16px;
  cursor: pointer;
  transition: box-shadow 0.15s, transform 0.15s;
  display: flex; flex-direction: column; gap: 6px;
}
.slot-card:hover {
  box-shadow: var(--shadow-md);
  transform: translateY(-1px);
}
.slot-card-head {
  display: flex; align-items: center; gap: 8px;
}
.slot-card-icon { font-size: 22px; line-height: 1; }
.slot-card-title {
  flex: 1;
  font-weight: 600;
  font-size: 15px;
  color: var(--text-primary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.slot-card-status { font-size: 13px; }
.dot-active {
  display: inline-block;
  width: 8px; height: 8px;
  background: var(--fn-success, #4cc88c);
  border-radius: 50%;
}
.slot-card-summary {
  color: var(--text-secondary);
  font-size: 13px;
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.slot-card-meta {
  display: flex; gap: 10px;
  font-size: 11px; color: var(--text-muted);
  flex-wrap: wrap;
}
.slot-archived {
  margin-top: 14px;
  border-top: 1px dashed var(--border-subtle);
  padding-top: 12px;
}
.slot-archived summary {
  cursor: pointer;
  color: var(--text-muted);
  font-size: 13px;
  margin-bottom: 8px;
  user-select: none;
}
.slot-archived summary:hover { color: var(--text-secondary); }
.slot-archived .slot-card { opacity: 0.65; }

.memory-files-fallback {
  margin-top: 24px;
  border-top: 1px dashed var(--border-subtle);
  padding-top: 14px;
}
.memory-files-fallback summary {
  cursor: pointer;
  color: var(--text-muted);
  font-size: 13px;
  user-select: none;
  padding: 4px 0;
}
.memory-files-fallback summary:hover { color: var(--text-secondary); }

/* Slot detail page */
.slot-detail { padding: 0; }
.slot-detail-back {
  cursor: pointer;
  color: var(--airi-pink);
  font-size: 13px;
  margin-bottom: 12px;
  user-select: none;
}
.slot-detail-back:hover { text-decoration: underline; }

.slot-detail-header {
  display: flex; align-items: flex-start; gap: 14px;
  margin-bottom: 16px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--border-subtle);
  flex-wrap: wrap;
}
.slot-detail-icon { font-size: 36px; line-height: 1; }
.slot-detail-title-block { flex: 1; min-width: 200px; }
.slot-detail-title-block h2 { margin: 0; font-size: 22px; color: var(--text-primary); }
.slot-detail-status { color: var(--text-muted); font-size: 13px; margin-top: 2px; }
.slot-detail-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.slot-detail-actions button {
  padding: 6px 12px;
  font-size: 12px;
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  border-radius: 6px;
  cursor: pointer;
  color: var(--text-primary);
}
.slot-detail-actions button:hover { background: var(--airi-pink-mid); }
.slot-detail-actions button.btn-danger {
  background: rgba(255,107,107,0.1);
  border-color: rgba(255,107,107,0.3);
}
.slot-detail-actions button.btn-danger:hover { background: rgba(255,107,107,0.25); }

.slot-detail-meta {
  background: var(--bg-elevated);
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 16px;
  display: flex; flex-direction: column; gap: 6px;
  font-size: 13px;
  color: var(--text-secondary);
}
.slot-detail-meta strong { color: var(--text-primary); margin-right: 4px; }
.slot-detail-meta-row {
  display: flex; gap: 16px;
  font-size: 12px; color: var(--text-muted);
  margin-top: 4px;
}
.slot-detail-meta .chip {
  display: inline-block;
  padding: 2px 8px;
  margin-right: 4px;
  background: var(--airi-pink-mid);
  color: var(--airi-pink);
  border-radius: 10px;
  font-size: 11px;
  cursor: default;
}
.slot-detail-meta .chip[onclick] { cursor: pointer; }

.slot-detail-ddls {
  background: var(--bg-card, #FDF6EE);
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 16px;
}
.slot-detail-ddls h3 { margin: 0 0 8px; font-size: 14px; color: var(--text-primary); }
.slot-detail-ddls .ddl-line {
  font-size: 12px; color: var(--text-secondary);
  padding: 4px 0;
  font-family: ui-monospace, Menlo, monospace;
}

.slot-detail-content h3 {
  margin: 16px 0 10px;
  font-size: 14px;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.markdown-rendered {
  background: #fff;
  border: 1px solid var(--border-subtle);
  border-radius: 10px;
  padding: 16px 20px;
  line-height: 1.7;
  color: var(--text-primary);
}
.markdown-rendered h2 { font-size: 18px; margin: 0 0 10px; }
.markdown-rendered h3 { font-size: 15px; margin: 14px 0 6px; color: var(--airi-pink); }
.markdown-rendered h4 { font-size: 14px; margin: 10px 0 4px; }
.markdown-rendered ul { padding-left: 18px; margin: 6px 0; }
.markdown-rendered li { margin: 3px 0; }
.markdown-rendered p { margin: 6px 0; }

/* Slot edit / merge modal */
.slot-edit-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.4);
  display: flex; align-items: center; justify-content: center;
  z-index: 9999;
}
.slot-edit-modal {
  background: var(--bg-card, #fff);
  border-radius: 12px;
  padding: 24px;
  width: 480px; max-width: 92vw;
  max-height: 80vh;
  overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,0.2);
}
.slot-edit-modal h3 { margin: 0 0 14px; }
.slot-edit-modal label {
  display: block; margin-bottom: 12px;
  font-size: 13px; color: var(--text-secondary);
}
.slot-edit-modal input,
.slot-edit-modal textarea,
.slot-edit-modal select {
  display: block; width: 100%;
  margin-top: 4px;
  padding: 8px 10px;
  border: 1px solid var(--border-subtle);
  border-radius: 6px;
  font-size: 14px;
  background: var(--bg-elevated);
  color: var(--text-primary);
  box-sizing: border-box;
}
.slot-edit-modal textarea { min-height: 80px; resize: vertical; }
.slot-edit-actions {
  display: flex; gap: 10px; justify-content: flex-end;
  margin-top: 16px;
}
.slot-edit-actions button {
  padding: 8px 16px;
  border: 1px solid var(--border-subtle);
  border-radius: 6px;
  background: var(--bg-elevated);
  cursor: pointer;
  color: var(--text-primary);
}
.slot-edit-actions button.primary {
  background: var(--airi-pink);
  color: white;
  border-color: var(--airi-pink);
}

.memory-index-icon {
  font-size: 24px;
}
.memory-index-text {
  flex: 1;
}
.memory-index-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
}
.memory-index-desc {
  font-size: 12px;
  color: var(--text-muted);
}

/* Memory file detail */
.memory-detail {
  max-width: 720px;
  margin: 0 auto;
}
.memory-detail-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}
.memory-detail-back {
  cursor: pointer;
  color: var(--fn-info);
  font-size: 13px;
  padding: 4px 8px;
  border-radius: 6px;
  transition: background 0.15s;
}
.memory-detail-back:hover {
  background: var(--bg-hover);
}
.memory-detail-path {
  font-size: 13px;
  color: var(--text-muted);
}
.memory-detail-content {
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  border-radius: 14px;
  padding: 20px 24px;
  box-shadow: var(--shadow-sm);
  line-height: 1.8;
  font-size: 14px;
  color: var(--text-primary);
  max-height: 75vh;
  overflow-y: auto;
}

/* Search results */
.memory-search-results {
  margin-top: 8px;
}
.memory-search-result {
  padding: 10px 14px;
  border: 1px solid var(--border-subtle);
  border-radius: 10px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
}
.memory-search-result:hover {
  border-color: var(--airi-pink-mid);
  background: var(--bg-hover);
}
.memory-search-result-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
}
.memory-search-result-path {
  font-size: 11px;
  color: var(--text-faint);
}
.memory-search-result-snippet {
  font-size: 12.5px;
  color: var(--text-muted);
  margin-top: 4px;
  line-height: 1.5;
}

/* ===== Settings Modal ===== */
.settings-modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.55);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 2000;
  padding: 14px;
}

.settings-modal-backdrop.active {
  display: flex;
}

.settings-modal {
  width: min(920px, 100%);
  height: min(88vh, 840px);
  background: var(--bg-surface);
  border: 1px solid var(--border-default);
  border-radius: 16px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 24px 64px rgba(58,46,42,0.15);
}

.settings-modal-header {
  padding: 16px 24px;
  border-bottom: 1px solid var(--border-default);
  background: rgba(255,249,242,0.95);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.settings-modal-title {
  font-size: 17px;
  color: var(--text-primary);
  font-weight: 600;
  font-family: "Zen Maru Gothic", "Noto Sans SC", system-ui, sans-serif;
}

.settings-close-btn {
  background: transparent;
  border: 1px solid var(--border-default);
  color: var(--text-secondary);
  border-radius: 6px;
  min-width: 52px;
  height: 30px;
  padding: 0 10px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
}

.settings-close-btn:hover {
  background: var(--bg-hover);
}

.settings-tabs {
  display: flex;
  gap: 10px;
  padding: 14px 24px;
  border-bottom: 1px solid var(--border-default);
  background: rgba(255,249,242,0.95);
  overflow-x: auto;
  flex-shrink: 0;
}

.settings-tab-btn {
  border: 1px solid var(--border-default);
  border-radius: 9999px;
  background: var(--bg-elevated);
  color: var(--text-secondary);
  padding: 8px 18px;
  font-size: 14px;
  white-space: nowrap;
  cursor: pointer;
  transition: border-color 0.2s, color 0.2s;
}

.settings-tab-btn.active {
  border-color: var(--airi-pink);
  color: var(--airi-pink);
}

.settings-modal-body {
  flex: 1;
  overflow-y: auto;
  padding: 28px 32px;
  display: flex;
  flex-direction: column;
}

.settings-flash {
  margin-bottom: 10px;
  padding: 9px 10px;
  border-radius: 10px;
  font-size: 13px;
  border: 1px solid var(--border-default);
}

.settings-flash.ok {
  background: rgba(120,196,164,0.12);
  color: var(--fn-success);
  border-color: rgba(120,196,164,0.25);
}

.settings-flash.err {
  background: rgba(208,120,120,0.12);
  color: var(--fn-danger);
  border-color: rgba(208,120,120,0.25);
}

/* ===== Character Card Grid ===== */
.char-card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 16px;
  padding: 4px 0;
}

.char-card {
  background: var(--bg-surface);
  border: 1.5px solid var(--border-default);
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
}

.char-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
  border-color: var(--airi-pink);
}

.char-card.active {
  border-color: var(--airi-pink);
  box-shadow: 0 0 0 2px var(--airi-pink-dim);
}

.char-card-img-wrap {
  width: 100%;
  aspect-ratio: 420 / 760;
  overflow: hidden;
  background: #FFF0EC;
}

.char-card-img-wrap img, .char-card-img-wrap canvas {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.35s ease;
}

.char-card:hover .char-card-img-wrap img,
.char-card:hover .char-card-img-wrap canvas {
  transform: scale(1.12);
}

.char-card-info {
  padding: 10px 12px;
}

.char-card-name {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.char-card-badge {
  font-size: 11px;
  color: var(--fn-info);
  margin-top: 2px;
}

/* Character detail panel (inside settings modal) */
.char-detail-wrap {
  display: flex;
  gap: 24px;
  height: 100%;
  overflow: hidden;
}

.char-detail-preview {
  flex: 0 0 420px;
  max-width: 420px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.char-detail-preview iframe {
  width: 100%;
  flex: 1;
  border: 1px solid var(--border-default);
  border-radius: 12px;
  background: var(--bg-deepest);
}

.char-detail-form {
  flex: 1;
  overflow-y: auto;
  padding-right: 8px;
}

.char-field-group {
  margin-bottom: 20px;
}

.char-field-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 6px;
}

.char-field-hint {
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: 6px;
}

.char-field-input {
  width: 100%;
  border: 1px solid var(--border-default);
  border-radius: 8px;
  background: var(--bg-input);
  color: var(--text-primary);
  font-size: 13px;
  font-family: inherit;
  padding: 8px 12px;
  box-sizing: border-box;
  transition: border-color 0.2s;
}

.char-field-input:focus {
  outline: none;
  border-color: var(--airi-pink);
}

textarea.char-field-input {
  min-height: 80px;
  resize: vertical;
  line-height: 1.5;
}

.char-detail-actions {
  display: flex;
  gap: 8px;
  margin-top: 16px;
  padding-top: 12px;
  border-top: 1px solid var(--border-subtle);
}

.settings-panel {
  display: none;
}

.settings-panel.active {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
}

.confirm-modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 2500;
  padding: 14px;
}

.confirm-modal-backdrop.active {
  display: flex;
}

.confirm-modal {
  width: min(460px, 100%);
  background: var(--bg-surface);
  border: 1px solid rgba(208,120,120,0.4);
  border-radius: 14px;
  padding: 16px;
  box-shadow: 0 16px 48px rgba(58,46,42,0.15);
}

.confirm-modal-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--fn-danger);
}

.confirm-modal-text {
  margin-top: 8px;
  font-size: 13px;
  line-height: 1.7;
  color: var(--text-secondary);
}

@media (max-width: 640px) {
  .main {
    flex-direction: column;
  }
  .sidebar-panel {
    width: 100%;
    min-width: 0;
    border-right: none;
    border-bottom: 1px solid var(--border-default);
  }
  .sidebar-panel::after {
    display: none;
  }
  .sidebar-nav {
    flex-direction: row;
    overflow-x: auto;
    padding: 8px;
    gap: 8px;
  }
  .sidebar-nav-btn {
    flex: 0 0 auto;
    padding: 8px 10px;
  }
  .sidebar-nav-btn .nav-icon {
    min-width: 26px;
  }
  .airi-side-panel.open {
    width: 100%;
    min-width: 0;
    min-height: 340px;
    border-left-width: 0;
    border-top: 1px solid var(--border-default);
  }
  .airi-side-panel-header {
    padding: 10px 12px;
  }
  .major-switch-row {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .settings-modal {
    max-height: 92vh;
    border-radius: 10px;
  }
  .settings-modal-body {
    padding: 18px 16px;
  }
  .sync-settings-grid {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 1024px) and (min-width: 641px) {
  .sidebar-panel {
    width: 78px;
    min-width: 78px;
  }
  .sidebar-nav-btn {
    justify-content: center;
    padding: 8px 6px;
  }
  .sidebar-nav-btn .nav-label {
    display: none;
  }
  .airi-side-panel.open {
    width: 360px;
    min-width: 360px;
  }
}


/* Voice unsupported tooltip */
.voice-btn.voice-unsupported {
  opacity: 0.3;
  cursor: not-allowed;
  position: relative;
}

/* ===== Onboarding Overlay ===== */
.onboarding-overlay {
  position: fixed; inset: 0; z-index: 10000;
  background: linear-gradient(135deg, rgba(255,249,242,0.97), rgba(255,240,232,0.97));
  backdrop-filter: blur(20px);
  display: flex; align-items: center; justify-content: center;
  opacity: 1; transition: opacity 0.5s var(--ease-smooth);
}
.onboarding-overlay.fade-out { opacity: 0; pointer-events: none; }
.onboarding-card {
  background: var(--bg-surface); border-radius: 20px;
  padding: 40px 36px; max-width: 420px; width: 90%;
  box-shadow: var(--shadow-lg); text-align: center;
}
.onboarding-card h2 {
  font-family: 'Zen Maru Gothic', sans-serif;
  font-size: 1.5rem; color: var(--text-primary);
  margin-bottom: 8px;
}
.onboarding-card .ob-subtitle {
  font-size: 0.88rem; color: var(--text-muted); margin-bottom: 28px;
}
.onboarding-card .ob-question {
  font-size: 1rem; color: var(--text-primary);
  margin-bottom: 16px; font-weight: 500; min-height: 1.4em;
}
.onboarding-card input[type="text"] {
  width: 100%; padding: 12px 16px; border-radius: 12px;
  border: 1.5px solid var(--border-default); background: var(--bg-input);
  font-size: 1rem; color: var(--text-primary); outline: none;
  transition: border-color 0.2s;
}
.onboarding-card input[type="text"]:focus {
  border-color: var(--airi-pink);
}
.ob-options { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 0; }
.ob-option {
  padding: 10px 18px; border-radius: 20px; border: 1.5px solid var(--border-default);
  background: var(--bg-input); color: var(--text-secondary);
  font-size: 0.92rem; cursor: pointer; transition: all 0.2s;
}
.ob-option:hover { border-color: var(--airi-pink); background: var(--airi-pink-dim); }
.ob-option.selected { border-color: var(--airi-pink); background: var(--airi-pink-mid); color: var(--text-primary); font-weight: 500; }
.ob-actions {
  display: flex; gap: 12px; margin-top: 28px; justify-content: center;
}
.ob-btn {
  padding: 11px 28px; border-radius: 12px; border: none; font-size: 0.95rem;
  cursor: pointer; transition: all 0.2s;
}
.ob-btn-skip { background: transparent; color: var(--text-muted); }
.ob-btn-skip:hover { color: var(--text-secondary); }
.ob-btn-next { background: var(--airi-pink); color: #fff; font-weight: 500; }
.ob-btn-next:hover { filter: brightness(1.05); transform: translateY(-1px); }
.ob-progress {
  display: flex; gap: 6px; justify-content: center; margin-bottom: 20px;
}
.ob-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--border-default); transition: background 0.3s;
}
.ob-dot.active { background: var(--airi-pink); }

/* ===== Mobile PWA ===== */
.mobile-header { display: none; }
#screenCaptureHeaderBtn { color: var(--text-faint); transition: color 0.4s ease; }
#screenCaptureHeaderBtn.active { color: #4caf50; }
#screenCaptureHeaderBtn.active svg { filter: drop-shadow(0 0 4px rgba(76,175,80,0.4)); }
@keyframes capturePulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
#screenCaptureHeaderBtn.active circle:nth-child(2) { animation: capturePulse 2.5s ease-in-out infinite; }
.mobile-tab-bar {
  display: none; /* shown by JS on mobile */
  position: fixed; bottom: 0; left: 0; right: 0;
  height: calc(56px + env(safe-area-inset-bottom, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--bg-surface);
  border-top: 1px solid var(--border-subtle);
  z-index: 900;
  align-items: center; justify-content: space-around;
}
.mobile-tab-bar button {
  flex: 1; border: none; background: none;
  display: flex; flex-direction: column; align-items: center;
  padding: 8px 0; color: var(--text-muted); font-size: 0.72rem;
  cursor: pointer; transition: color 0.2s;
  gap: 2px;
}
.mobile-tab-bar button .tab-icon { font-size: 1.3rem; }
.mobile-tab-bar button.active { color: var(--airi-pink); }
.mobile-tab-bar button.active .tab-icon { filter: none; }

@media (max-width: 768px) {
  /* === Layout === */
  body.mobile-mode header { display: none; }
  body.mobile-mode .sidebar-panel { display: none !important; }
  body.mobile-mode .main { padding: 0; }
  body.mobile-mode .card-panel {
    margin: 0; border-radius: 0; max-width: 100%;
    height: 100vh; height: 100dvh;
    padding-bottom: calc(56px + env(safe-area-inset-bottom, 0px));
  }
  body.mobile-mode .chat-view { border-radius: 0; height: 100%; }
  body.mobile-mode .mobile-tab-bar { display: flex; }

  /* === Mobile header === */
  .mobile-header {
    display: none;
    position: fixed; top: 0; left: 0; right: 0;
    height: calc(44px + env(safe-area-inset-top, 0px));
    padding-top: env(safe-area-inset-top, 0px);
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border-subtle);
    z-index: 899;
    align-items: center; justify-content: space-between;
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 1.05rem; font-weight: 500; color: var(--text-primary);
  }
  .mobile-header-left, .mobile-header-right { width: 48px; display: flex; align-items: center; flex-shrink: 0; }
  .mobile-header-left { justify-content: flex-start; padding-left: 8px; }
  .mobile-header-right { justify-content: flex-end; padding-right: 8px; }
  .mobile-header-center { flex: 1; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .mobile-header-center > #mobileHeaderName { display: inline-flex; align-items: center; }
  body.mobile-mode .mobile-header { display: flex; }
  body.mobile-mode .card-panel {
    padding-top: calc(44px + env(safe-area-inset-top, 0px));
  }

  /* === Chat bubbles — compact === */
  body.mobile-mode .chat-bubble-wrapper { max-width: 88%; }
  body.mobile-mode .chat-bubble {
    padding: 8px 12px; font-size: 13.5px; line-height: 1.55;
    border-radius: 14px;
  }
  body.mobile-mode .chat-bubble.user-bubble { border-bottom-right-radius: 4px; }
  body.mobile-mode .chat-bubble.system-bubble { border-bottom-left-radius: 4px; }
  body.mobile-mode .system-avatar { width: 32px; height: 32px; border-width: 1.5px; }
  body.mobile-mode .chat-bubble-wrapper.system { gap: 8px; }
  body.mobile-mode .chat-bubble-image { max-width: 160px; max-height: 120px; }
  body.mobile-mode .chat-bubble-status,
  body.mobile-mode .chat-time-anchor { font-size: 10px; }
  body.mobile-mode .chat-messages { padding: 12px 10px 80px; }

  /* === Input bar — compact & bottom-fixed === */
  body.mobile-mode .input-bar-wrapper {
    position: fixed; bottom: calc(56px + env(safe-area-inset-bottom, 0px));
    left: 0; right: 0; z-index: 898;
    /* mobile sidebar 完全隐藏 → 必须 reset desktop 的 padding-left */
    padding-left: 0;
  }
  body.mobile-mode .input-bar {

  }

  }

  }

  /* === Detail view — fullscreen on mobile === */
  body.mobile-mode .detail-view {

    padding-bottom: calc(70px + env(safe-area-inset-bottom, 0px));
    overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  body.mobile-mode .detail-back-btn { display: none; }
  body.mobile-mode .detail-content { padding: 0; }

  /* === Hide AIRI side panel on mobile === */
  body.mobile-mode .airi-side-panel { display: none !important; }

  /* === Onboarding compact === */
