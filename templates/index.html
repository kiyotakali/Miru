// ===== SSE (Server-Sent Events) — real-time message push =====

let _eventSource = null;
let _sseReconnectTimer = null;
let _sseConnected = false;
let _sseBackoff = 3000; // exponential backoff: 3s → 6s → 12s → max 30s
const _SSE_BACKOFF_INIT = 3000;
const _SSE_BACKOFF_MAX = 30000;
let _lastSeenReplyId = '';
// Set of rendered message IDs — authoritative cross-channel dedup.
// Populated by loadCompanionChatHistory (full + silent) and SSE chat_message.
// Capped at 500 entries to prevent unbounded growth.
const _renderedMsgIds = new Set();
function _markRendered(id) {
  if (!id) return;
  _renderedMsgIds.add(id);
  if (_renderedMsgIds.size > 500) {
    // Drop oldest (first) entry — Set iteration order is insertion order
    const first = _renderedMsgIds.values().next().value;
    _renderedMsgIds.delete(first);
  }
}
let _typingIndicatorShown = false;
let _connectionBannerTimer = null;
let _sseLastHeartbeat = 0;       // epoch ms of last SSE event received
let _sseHeartbeatChecker = null; // setInterval id
const _SSE_HEARTBEAT_TIMEOUT = 45000; // server sends heartbeat every 30s; 45s = dead
let _sseHadSuccessfulConnection = false; // true after first successful connect
let _sseConsecutiveErrors = 0;          // count consecutive onerror events
const _SSE_ERROR_BANNER_THRESHOLD = 2;  // show banner only after N consecutive errors

// === Chat history full-reload control (no-flicker tab-switch) ===
// Goal: keep chat DOM intact across view switches (like WeChat). SSE + silent
// incremental poll already maintain consistency, so a full rebuild on every
// view re-entry is just paranoid — it makes the "messages flash" UX bug.
//
// We still trigger a full reload in three safety-net cases:
//   1. First entry into chat in this session (companionChatLoaded false)
//   2. SSE got disconnected after a successful connection (might have missed
//      cross-device messages during the gap, since= incremental can race)
//   3. >30min since last full reload (catch-all for any silent state drift)
let _sseHadDisconnect = false;            // SSE was connected then dropped; force next chat-view entry to full reload
let _lastFullChatReloadTs = 0;            // ms timestamp of last full chat history reload
const _CHAT_FULL_RELOAD_INTERVAL = 30 * 60 * 1000; // 30 min — staleness window before forcing full reload

function _startHeartbeatChecker() {
  _stopHeartbeatChecker();
  _sseHeartbeatChecker = setInterval(function() {
    if (_sseLastHeartbeat && Date.now() - _sseLastHeartbeat > _SSE_HEARTBEAT_TIMEOUT) {
      console.warn('[SSE] Heartbeat timeout — silent reconnect');
      _stopHeartbeatChecker();
      _sseConnected = false;
      if (_eventSource) { try { _eventSource.close(); } catch(e) {} _eventSource = null; }
      _sseBackoff = _SSE_BACKOFF_INIT;
      _sseConsecutiveErrors = 0;
      // Silent: only update dot, no banner for heartbeat-triggered reconnect
      var dot = document.getElementById('connectionDot');
      if (dot) dot.style.background = 'var(--fn-warning)';
      _connectSSE();
      setTimeout(function() { loadCompanionChatHistory({ silent: true }); }, 500);
    }
  }, 15000);
}

function _stopHeartbeatChecker() {
  if (_sseHeartbeatChecker) { clearInterval(_sseHeartbeatChecker); _sseHeartbeatChecker = null; }
}

// Global: callable from Java onResume via evaluateJavascript
// Silent reconnect — no banner shown. Banner only appears on persistent errors.
function _forceReconnectSSE() {
  console.log('[SSE] Force reconnect triggered (silent)');
  _stopHeartbeatChecker();
  _sseConnected = false;
  if (_eventSource) { try { _eventSource.close(); } catch(e) {} _eventSource = null; }
  if (_sseReconnectTimer) { clearTimeout(_sseReconnectTimer); _sseReconnectTimer = null; }
  _sseBackoff = _SSE_BACKOFF_INIT;
  _sseConsecutiveErrors = 0;
  // dot only — no banner for routine reconnects
  var dot = document.getElementById('connectionDot');
  if (dot) dot.style.background = 'var(--fn-warning)';
  _connectSSE();
  setTimeout(function() { loadCompanionChatHistory({ silent: true }); }, 500);
}
window._forceReconnectSSE = _forceReconnectSSE;

function _updateConnectionStatus(status) {
  // status: 'connected', 'reconnecting', 'offline'
  var dot = document.getElementById('connectionDot');
  var banner = document.getElementById('connectionBanner');
  var bannerText = document.getElementById('connectionBannerText');
  if (dot) {
    if (status === 'connected') {
      dot.style.background = 'var(--fn-success)';
    } else if (status === 'reconnecting') {
      dot.style.background = 'var(--fn-warning)';
    } else {
      dot.style.background = 'var(--fn-danger)';
    }
  }
  if (banner && bannerText) {
    if (_connectionBannerTimer) { clearTimeout(_connectionBannerTimer); _connectionBannerTimer = null; }
    if (status === 'connected') {
      _sseConsecutiveErrors = 0;
      // Only show "已重新连接" banner if we were showing an error/reconnecting banner
      if (banner.style.display === 'block') {
        bannerText.textContent = '已重新连接';
        banner.style.background = 'var(--fn-success)';
        _connectionBannerTimer = setTimeout(function() { banner.style.display = 'none'; }, 2000);
      }
      // First connect or silent reconnect: no banner at all
    } else if (status === 'reconnecting') {
      // Only show banner after multiple consecutive errors (not on first disconnect)
      if (_sseConsecutiveErrors >= _SSE_ERROR_BANNER_THRESHOLD) {
        bannerText.textContent = '连接中断，正在重连...';
        banner.style.background = 'var(--fn-warning)';
        banner.style.display = 'block';
      }
    } else {
      bannerText.textContent = '连接已断开';
      banner.style.background = 'var(--fn-danger)';
      banner.style.display = 'block';
    }
  }
}

function _connectSSE() {
  if (_eventSource) {
    try { _eventSource.close(); } catch(e) {}
  }
  if (_sseReconnectTimer) {
    clearTimeout(_sseReconnectTimer);
    _sseReconnectTimer = null;
  }

  const token = localStorage.getItem('miru_auth_token') || '';
  const params = new URLSearchParams();
  if (token) params.set('token', token);
  params.set('device_id', _getDeviceId());
  // In client mode, SSE connects directly to VPS
  const sseBase = _clientModeServerUrl || '';
  const url = sseBase + '/api/events?' + params.toString();

  _eventSource = new EventSource(url);

  // Update heartbeat on ANY SSE event (keeps timeout detector alive)
  _eventSource.onmessage = function() { _sseLastHeartbeat = Date.now(); };

  _eventSource.addEventListener('connected', function() {
    _sseConnected = true;
    _sseLastHeartbeat = Date.now();
    _sseBackoff = _SSE_BACKOFF_INIT; // reset backoff on successful connection
    _sseConsecutiveErrors = 0;
    _sseHadSuccessfulConnection = true;
    _startHeartbeatChecker();
    _updateConnectionStatus('connected');
    console.log('[SSE] Connected');
  });

  _eventSource.addEventListener('chat_message', function(e) {
    try {
      const msg = JSON.parse(e.data);
      // Skip user messages sent from THIS device (already rendered optimistically).
      // Show user messages from OTHER devices so cross-device chat syncs.
      // 2026-05-08: still register the id in _renderedMsgIds before returning —
      // otherwise a subsequent incremental poll (loadCompanionChatHistory
      // {silent:true}) would re-fetch this msg by `since=...`, find no entry
      // in the dedup set, and render the bubble a SECOND time on top of
      // the optimistic one.
      if (msg.role === 'user') {
        const localId = _getDeviceId();
        if (msg.device_id && msg.device_id === localId) {
          if (msg.id) _markRendered(msg.id);
          return;
        }
        if (!msg.device_id) {
          if (msg.id) _markRendered(msg.id);
          return; // legacy message without device_id — assume local
        }
      }
      // Deduplicate: skip if we already have this message (cross-channel Set check)
      if (msg.id && _renderedMsgIds.has(msg.id)) return;
      if (msg.id && msg.id === _lastSeenReplyId) return;
      _lastSeenReplyId = msg.id || '';
      _companionLastMsgId = msg.id || _companionLastMsgId;
      if (msg.id) _markRendered(msg.id);
      // Render the bubble
      _sseAppendMessage(msg);
      // Auto-play TTS for assistant messages
      if (msg.role === 'assistant' && msg.text) autoPlayTTS(msg.text);
      // Stop typing indicator
      _hideTypingIndicator();
    } catch(err) { console.warn('[SSE] parse error:', err); }
  });

  _eventSource.addEventListener('typing_start', function() {
    _showTypingIndicator();
  });

  _eventSource.addEventListener('typing_stop', function() {
    _hideTypingIndicator();
  });

  _eventSource.addEventListener('commitment_sync', function(e) {
    try {
      var payload = JSON.parse(e.data);
      if (payload.items) {
        _cachedCommitments = payload.items;
        // Refresh DDL view if currently visible
        if (document.getElementById('ddl-view-container')) {
          _loadDDLView();
        }
      }
    } catch(err) { console.warn('[SSE] commitment_sync parse error:', err); }
  });

  // Settings toggle state pushed by another UI (pet toolbar or main settings).
  // Keeps the screenshot switch + interval label + sensor health banner in
  // sync across all open windows without a page reload.
  _eventSource.addEventListener('user_settings_sync', function(e) {
    try {
      var payload = JSON.parse(e.data);
      var s = payload && payload.settings;
      if (!s) return;
      var sw = document.getElementById('settingsSysScreenshotEnabled');
      if (sw && sw.checked !== !!s.screenshot_enabled) {
        sw.checked = !!s.screenshot_enabled;
        var label = document.getElementById('settingsSysScreenshotLabel');
        var wrap = document.getElementById('settingsSysIntervalWrap');
        if (label) label.textContent = sw.checked ? '已开启 — Miru 会定时截取屏幕并分析' : '已关闭';
        if (wrap) { wrap.style.opacity = sw.checked ? '1' : '0.5'; wrap.style.pointerEvents = sw.checked ? '' : 'none'; }
      }
      // Re-check sensor health so the banner updates right away
      if (typeof _startSensorHealthWatch === 'function') _startSensorHealthWatch();
    } catch(err) { console.warn('[SSE] user_settings_sync parse error:', err); }
  });

  _eventSource.addEventListener('data_changed', function(e) {
    try {
      var payload = JSON.parse(e.data);
      var scope = payload.scope || '';
      // Map scope to IndexedDB cache keys and mark them stale
      var keyMap = {
        // memory hub uses BOTH memory_slots (4-tab card view) and memory_tree
        // (raw file tab). Settings → 身份 / chat-driven slot writes / sleep_agent
        // updates can change either, so invalidate both on any 'memory' event.
        'memory': ['memory_tree', 'memory_slots', 'core_memory'],
        'journal': ['journal_list'],
        'commitments': ['commitments'],
        'emotion': ['emotion_' + _miruLocalDateKey(), 'emotion_month_' + _miruLocalDateKey().slice(0,7), 'miru_emotion_current', 'miru_emotion_history'],
      };
      var keys = keyMap[scope] || [];
      keys.forEach(function(k) { MiruCache.markStale(k); });
      // 2026-05-17: memory scope 还要清 *所有* slot detail 缓存,
      // 因为 sleep_agent / chat / curator 写入会改某个 slot 的 main.md.
      // 不知道具体改的是哪个 slot, 用 prefix 标 stale 全清.
      if (scope === 'memory') {
        try { MiruCache.markStalePrefix('slot_detail_'); } catch(e) {}
      }
      // Note: we intentionally do NOT null _cachedCommitments here. The
      // commitment_sync event (which always fires alongside this one) has
      // already pushed the fresh list into the in-memory cache, so nulling
      // it would just force the next click to miss optimistic UI and issue
      // an extra round-trip refetch — visible to the user as a flicker.
      console.log('[SSE] data_changed: ' + scope + ', staled ' + keys.length + ' cache keys');
    } catch(err) { console.warn('[SSE] data_changed parse error:', err); }
  });

  _eventSource.addEventListener('device_list_changed', function(e) {
    try {
      var payload = JSON.parse(e.data);
      if (payload.devices) {
        // Refresh device list UI if settings panel or devices view is open
        if (document.getElementById('devicesListArea')) {
          _renderDevicesListFromSSE(payload.devices);
        }
        if (document.getElementById('mobileDevicesList')) {
          _renderMobileDevicesListFromSSE(payload.devices);
        }
      }
    } catch(err) { console.warn('[SSE] device_list_changed parse error:', err); }
  });

  // SSE emotion_updated: ambiance handler removed (feature disabled)

  _eventSource.addEventListener('force_refresh', function(e) {
    _clientDebugLog('SSE.force_refresh', 'clientMode=' + _isClientMode());
    console.log('[SSE] force_refresh received');
    if (_isClientMode()) {
      console.log('[SSE] Ignoring force_refresh in client mode');
      return;
    }
    try { forceUpdate(); } catch(err) {}
  });

  _eventSource.addEventListener('model_changed', function(e) {
    try {
      var payload = JSON.parse(e.data);
      console.log('[SSE] model_changed:', payload.model_id);
      // Refresh CHARACTER global + persona list
      fetch('/api/character', { cache: 'no-store' }).then(r => r.json()).then(function(c) {
        window.CHARACTER = c;
        if (document.getElementById('settingsPersonaList')) settingsLoadPersonaList();
      }).catch(function() {});
    } catch(err) { console.warn('[SSE] model_changed parse error:', err); }
  });

  _eventSource.onerror = function() {
    // Mark "had disconnect" only if we were previously connected — onerror also
    // fires on initial-connection failure, which we don't want to count as a
    // "drop" (no missed messages, since we never received any).
    if (_sseConnected) _sseHadDisconnect = true;
    _sseConnected = false;
    _sseConsecutiveErrors++;
    _stopHeartbeatChecker();
    _updateConnectionStatus('reconnecting'); // banner only shows after threshold
    console.warn('[SSE] Disconnected (errors=' + _sseConsecutiveErrors + '), reconnecting in ' + (_sseBackoff/1000) + 's...');
    try { _eventSource.close(); } catch(e) {}
    _eventSource = null;
    _sseReconnectTimer = setTimeout(function() {
      _connectSSE();
      setTimeout(function() {
        loadCompanionChatHistory({ silent: true });
      }, 500);
    }, _sseBackoff);
    // Exponential backoff: double each time, cap at 30s
    _sseBackoff = Math.min(_sseBackoff * 2, _SSE_BACKOFF_MAX);
  };
}

function _sseAppendMessage(msg) {
  // Only render if we're on the companion/chat view
  if (!companionChatMessages) return;
  const nearBottom = companionChatMessages.scrollHeight - companionChatMessages.scrollTop - companionChatMessages.clientHeight < 120;
  // Render using existing bubble functions; pass msg.time so the timeline
  // grouper can decide whether to insert a date separator / time anchor.
  const t = msg.time || null;
  if (msg.role === 'assistant') {
    addCompanionReplyBubble(msg.text || '', msg.tool_calls || msg.actions_executed || [], t);
  } else if (msg.role === 'user') {
    const imgUrl = msg.image ? _assetUrl('/data/uploads/' + msg.image) : null;
    addCompanionUserBubble(msg.text || '', imgUrl, t);
  }
  emptyCompanionState.style.display = 'none';
  // Auto-scroll if user is near bottom
  if (nearBottom) scrollCompanionChatToBottom();
  else _showCompanionNewMsgBadge(true);
}

function _getDeviceId() {
  if (window.MiruAndroid && typeof window.MiruAndroid.getInstallDeviceId === 'function') {
    try {
      var nativeId = window.MiruAndroid.getInstallDeviceId();
      if (nativeId) {
        localStorage.setItem('miru_device_id', nativeId);
        return nativeId;
      }
    } catch(e) {}
  }
  let id = localStorage.getItem('miru_device_id');
  if (!id) {
    // Generate a stable device ID based on device characteristics
    // so the same physical phone gets the same ID even across different tunnel URLs.
    var raw = [
      navigator.userAgent,
      screen.width + 'x' + screen.height,
      screen.colorDepth,
      navigator.language,
      navigator.hardwareConcurrency || '',
      new Date().getTimezoneOffset(),
    ].join('|');
    // Simple hash → stable 8-char hex
    var hash = 0;
    for (var i = 0; i < raw.length; i++) {
      hash = ((hash << 5) - hash + raw.charCodeAt(i)) | 0;
    }
    id = 'dev_' + (hash >>> 0).toString(16).padStart(8, '0');
    localStorage.setItem('miru_device_id', id);
  }
  return id;
}

// ===== Token persistence + device registration =====

function _initAuthToken() {
  // Check URL for ?token= (from QR code scan)
  const params = new URLSearchParams(window.location.search);
  const urlToken = params.get('token');
  const apiSetupState = params.get('api_setup');
  const hadLegacyApiSetupSkipped = params.has('api_setup_skipped');
  if (urlToken) {
    localStorage.setItem('miru_auth_token', urlToken);
  }
  if (apiSetupState === 'configured') {
    localStorage.removeItem('miru_api_setup_skipped');
  }
  if (urlToken || apiSetupState || hadLegacyApiSetupSkipped) {
    // Clean the URL to hide token and one-shot setup markers.
    params.delete('token');
    params.delete('api_setup');
    params.delete('api_setup_skipped');
    const cleanUrl = params.toString()
      ? window.location.pathname + '?' + params.toString()
      : window.location.pathname;
    history.replaceState(null, '', cleanUrl);
  }
}

function _getAuthToken() {
  return localStorage.getItem('miru_auth_token') || '';
}

// ===== Client Mode: redirect API calls to VPS =====
var _clientModeServerUrl = '';  // set by _initClientMode()
var _clientModeMode = '';       // "local" for single-device local mode
var _clientModeReady = false;   // true once client config is loaded
var _bootstrapComplete = false; // true after _initBootstrap finishes — guards fetch 401 handler

function _androidClientHeaders(headers) {
  var out = headers || {};
  try {
    var localHost = ['127.0.0.1', 'localhost', '::1'].indexOf(window.location.hostname) !== -1;
    if (localHost && window.MiruAndroid && typeof window.MiruAndroid.getClientSecret === 'function') {
      var secret = window.MiruAndroid.getClientSecret();
      if (secret && out instanceof Headers) out.set('X-Miru-Client-Secret', secret);
      else if (secret) out['X-Miru-Client-Secret'] = secret;
    }
  } catch(e) {}
  return out;
}

async function _initClientMode() {
  // Async fetch to get client config — does NOT block page rendering
  try {
    var res = await fetch('/api/client-config', { headers: _androidClientHeaders({}) });
    if (res.ok) {
      var cfg = await res.json();
      if (cfg.client_mode && cfg.server_url) {
        _clientModeServerUrl = cfg.server_url;
        _clientModeMode = cfg.mode || (cfg.local_only ? 'local' : '');
        if (cfg.auth_token && !localStorage.getItem('miru_auth_token')) {
          localStorage.setItem('miru_auth_token', cfg.auth_token);
        }
        console.log('[Client Mode] API → ' + _clientModeServerUrl + (_clientModeMode ? (' (' + _clientModeMode + ')') : ''));
      }
    }
  } catch(e) {}
  _clientModeReady = true;
}

// Show "桌宠" button — deferred until _initClientMode completes
function _showPetBtnIfClient() {
  if (_clientModeServerUrl && !/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)) {
    var petBtn = document.getElementById('launchPetBtn');
    if (petBtn) petBtn.style.display = '';
  }
}

// Helper: rewrite /data/ paths to VPS in client mode (for images, uploads)
function _assetUrl(path) {
  if (_clientModeServerUrl && typeof path === 'string' && path.startsWith('/data/')) {
    return _clientModeServerUrl + path;
  }
  return path;
}

// ----------------------------------------------------------------
// User settings IO — bridges native Mac MiruDesktop where available,
// falls back to fetch for PWA / Android / future Linux clients.
// LOCAL user_settings.json is the per-device source of truth on Mac DMG;
// the bridge writes there directly (no NSURLSession proxy bypass mess).
// ----------------------------------------------------------------
async function _loadUserSettings() {
  if (window.MiruDesktop && typeof window.MiruDesktop.getLocalSettings === 'function') {
    try {
      var r = await window.MiruDesktop.getLocalSettings();
      if (r && r.ok) return r.settings || {};
    } catch (e) { /* fall through to fetch */ }
  }
  var res = await fetch('/api/user-settings', { cache: 'no-store' });
  var data = await res.json();
  return (data && data.settings) ? data.settings : data;
}

async function _saveUserSettings(payload) {
  if (window.MiruDesktop && typeof window.MiruDesktop.setLocalSettings === 'function') {
    try {
      var r = await window.MiruDesktop.setLocalSettings(payload);
      if (r && r.ok) return r;
    } catch (e) { /* fall through to fetch */ }
  }
  var res = await fetch('/api/user-settings', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });
  var data = await res.json();
  return { ok: !!data.ok, settings: data.settings, error: data.error };
}

// Wrap fetch to auto-inject auth header + device ID
// In client mode, also redirect /api/* calls to VPS
const _originalFetch = window.fetch;
window.fetch = function(url, options) {
  options = options || {};
  if (typeof url === 'string' && url.startsWith('/api/')) {
    // Client mode: rewrite URL to point to VPS
    // Except local-only APIs (pet coordination, client config, static models)
    if (_clientModeServerUrl) {
      var _localOnlyApis = ['/api/client-config', '/api/auth/logout', '/api/pet/', '/api/models/', '/api/shutdown', '/api/version', '/api/settings/app', '/api/user-settings', '/api/admin/server-config'];
      var _keepLocal = _localOnlyApis.some(function(p) { return url.startsWith(p) || url === p; });
      if (!_keepLocal) {
        url = _clientModeServerUrl + url;
      }
    }
    options.headers = options.headers || {};
    var localControl = url.startsWith('/api/client')
      || url === '/api/auth/login' || url === '/api/auth/logout';
    if (localControl) options.headers = _androidClientHeaders(options.headers);
    const token = _getAuthToken();
    const deviceId = _getDeviceId();
    if (options.headers instanceof Headers) {
      if (token && !options.headers.has('Authorization')) {
        options.headers.set('Authorization', 'Bearer ' + token);
      }
      if (deviceId && !options.headers.has('X-Device-Id')) {
        options.headers.set('X-Device-Id', deviceId);
      }
    } else {
      if (token && !options.headers['Authorization']) {
        options.headers['Authorization'] = 'Bearer ' + token;
      }
      if (deviceId && !options.headers['X-Device-Id']) {
        options.headers['X-Device-Id'] = deviceId;
      }
    }
  }
  return _originalFetch.call(this, url, options).then(function(resp) {
    if (resp.status === 401 && typeof url === 'string' && url.indexOf('/api/auth/login') === -1 && _bootstrapComplete) {
      // Token expired or invalid — recover via shared auth-lost handler
      // (APK: relaunch to full-code entry; web/DMG: short-code overlay).
      // Only act after bootstrap is done, to prevent pre-bootstrap 401s
      // (e.g. device register) from clearing a valid token.
      _handleAuthLost();
    }
    return resp;
  });
};

function _registerThisDevice() {
  // Skip device registration for local desktop browser — the Mac is
  // already registered at startup by ScreenSensor. Only register
  // remote devices (phones connecting via QR code).
  var isLocal = ['localhost', '127.0.0.1', '::1'].indexOf(location.hostname) !== -1;
  var isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
  if (isLocal && !isMobile) return;

  // Skip desktop browsers accessing VPS remotely — they aren't real devices
  if (!isMobile) return;

  var isAndroid = /Android/i.test(navigator.userAgent);
  var isIOS = /iPhone|iPad/i.test(navigator.userAgent);
  var deviceType = 'phone';
  var devicePlatform = isAndroid ? 'android' : isIOS ? 'ios' : 'web';

  // Use real device name from Android JS bridge, or UA-based fallback
  var deviceName = 'Android';
  if (isIOS) {
    deviceName = 'iPhone';
  } else if (window.MiruAndroid && window.MiruAndroid.getDeviceName) {
    try { deviceName = window.MiruAndroid.getDeviceName(); } catch(e) {}
  }

  var body = {
    name: deviceName,
    type: deviceType,
    platform: devicePlatform,
    device_id: _getDeviceId(),
    token: _getAuthToken(),
  };
  fetch('/api/device/register', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  }).catch(function() {});
}

function _startHeartbeat() {
  // All devices send heartbeat (including local desktop)
  setInterval(function() {
    fetch('/api/device/heartbeat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ device_id: _getDeviceId() }),
    }).catch(function() {});
  }, 60000);
}

// Initialize on load
_initAuthToken();
_registerThisDevice();
_startHeartbeat();

// Start Android background connection service (keeps VPS link alive when backgrounded)
if (window.MiruAndroid && window.MiruAndroid.startConnectionService) {
  try {
    var serverUrl = location.origin;
    var token = _getAuthToken();
    var deviceId = _getDeviceId();
    if (token && deviceId) {
      window.MiruAndroid.startConnectionService(serverUrl, token, deviceId);
    }
  } catch(e) { console.warn('[MiruConnectionService] start failed:', e); }
}

// Legacy polling — kept as fallback, reduced frequency
let _replyPollInterval = null;
let _typingPollInterval = null;
let _lastKnownMsgCount = 0;

function _startReplyPolling() {
  // If SSE is connected, skip polling entirely
  if (_sseConnected) return;
  if (_replyPollInterval) return;
  _replyPollInterval = setInterval(async () => {
    await loadCompanionChatHistory({ silent: true });
    const history = await fetch('/api/chat/history?limit=5').then(r => r.json()).catch(() => []);
    if (history.length > 0) {
      const last = history[history.length - 1];
      if (last.role === 'assistant' && last.id && last.id !== _lastSeenReplyId) {
        _lastSeenReplyId = last.id;
        if (last.text) autoPlayTTS(last.text);
        _stopReplyPolling();
        _stopTypingPolling();
      }
    }
  }, 1500);
  setTimeout(() => { _stopReplyPolling(); _stopTypingPolling(); }, 90000);
}

function _stopReplyPolling() {
  if (_replyPollInterval) {
    clearInterval(_replyPollInterval);
    _replyPollInterval = null;
  }
}

function _startTypingPolling() {
  if (_sseConnected) return;
  if (_typingPollInterval) return;
  _typingPollInterval = setInterval(async () => {
    try {
      const res = await fetch('/api/chat/typing');
      const data = await res.json();
      if (data.typing && !_typingIndicatorShown) {
        _showTypingIndicator();
      } else if (!data.typing && _typingIndicatorShown) {
        _hideTypingIndicator();
      }
    } catch(e) { /* ignore */ }
  }, 1000);
  setTimeout(() => _stopTypingPolling(), 90000);
}

function _stopTypingPolling() {
  if (_typingPollInterval) {
    clearInterval(_typingPollInterval);
    _typingPollInterval = null;
  }
  _hideTypingIndicator();
}

// ===== Header subtitle (two-layer: days default + typing override) =====
// Days layer = steady relationship indicator (number highlighted in the
// brand line, set once after /api/relationship returns).
// Override layer = transient typing message ("Miru 正在输入..."), pushed
// by the typing indicator and popped when typing stops.
//
// Desktop: days live inline in the brand line (#brandDaysNum + sibling
// "THE"/"DAY" label spans inside #brandStatusRight); typing lives in
// #brandStatusLeft underneath. The two are visually separate so they
// coexist.
// Mobile: #mobileHeaderSubtitle wraps two structured children — a typing
// span and a days span (with its own prefix/num/suffix). The number gets
// the same serif/gradient styling as desktop.
var _headerDays = null;
var _headerOverride = null;

function _applyHeaderSubtitle() {
  var deskLeft = document.getElementById('brandStatusLeft');
  var deskNum = document.getElementById('brandDaysNum');
  var deskRight = document.getElementById('brandStatusRight');
  // Mobile uses structured slots so the number can pick up its own
  // serif/gradient styling (you can't restyle individual digits inside
  // a flat textContent string).
  var mobWrap = document.getElementById('mobileHeaderSubtitle');
  var mobTyping = document.getElementById('mobileHeaderTyping');
  var mobDays = document.getElementById('mobileHeaderDays');
  var mobDaysNum = document.getElementById('mobileHeaderDaysNum');

  if (deskLeft) deskLeft.textContent = _headerOverride || '';
  if (deskNum) deskNum.textContent = _headerDays != null ? String(_headerDays) : '';
  if (deskRight) deskRight.style.display = _headerDays != null ? '' : 'none';

  if (mobTyping) mobTyping.textContent = _headerOverride || '';
  if (mobDaysNum) mobDaysNum.textContent = _headerDays != null ? String(_headerDays) : '';
  // Days hidden whenever there's an active typing override (single-line
  // mobile slot can't show both at once) or no days available.
  if (mobDays) {
    mobDays.style.display = (!_headerOverride && _headerDays != null) ? '' : 'none';
  }
  // Wrapper hides entirely when both layers are empty so the name stays
  // vertically centered in the mobile-header-center column.
  if (mobWrap) {
    var hasContent = !!(_headerOverride || _headerDays != null);
    mobWrap.style.display = hasContent ? '' : 'none';
  }
}

function _setHeaderDays(days) {
  _headerDays = (typeof days === 'number' && days > 0) ? days : null;
  _applyHeaderSubtitle();
}

function _pushHeaderOverride(text) {
  _headerOverride = text || '';
  _applyHeaderSubtitle();
}

function _popHeaderOverride() {
  _headerOverride = null;
  _applyHeaderSubtitle();
}

// Typing indicator — pushes onto the override layer. 90s safety timeout
// so the indicator clears even if SSE typing_stop never arrives.
// Was 30s; bumped to match real-world API latency (90s LLM client timeout
// in prompt._get_client) so a single slow request can complete before the
// frontend gives up and hides the indicator.
var _typingIndicatorTimeout = null;
var _TYPING_SAFETY_TIMEOUT_MS = 90000;
function _showTypingIndicator() {
  if (_typingIndicatorShown) return;
  _typingIndicatorShown = true;
  var name = (window.CHARACTER && CHARACTER.name) || 'Miru';
  _pushHeaderOverride(name + ' 正在输入...');
  if (_typingIndicatorTimeout) clearTimeout(_typingIndicatorTimeout);
  _typingIndicatorTimeout = setTimeout(_hideTypingIndicator, _TYPING_SAFETY_TIMEOUT_MS);
}

function _hideTypingIndicator() {
  _typingIndicatorShown = false;
  _popHeaderOverride();
  if (_typingIndicatorTimeout) {
    clearTimeout(_typingIndicatorTimeout);
    _typingIndicatorTimeout = null;
  }
}

// One-shot sync of the typing indicator with the backend's authoritative
// _csm_typing[user_id] flag. Called when the user re-enters the chat view
// (showCompanionChat) so the indicator self-heals from any case where the
// frontend missed an SSE typing_start (because the safety timeout already
// fired, or the event arrived between view-switch state changes).
//
// No-op when the local state already matches the backend — won't disturb
// an actively-correct indicator.
function _syncTypingFromBackend() {
  fetch('/api/chat/typing')
    .then(function(r) { return r.ok ? r.json() : null; })
    .then(function(data) {
      if (!data) return;
      if (data.typing && !_typingIndicatorShown) {
        _showTypingIndicator();
      } else if (!data.typing && _typingIndicatorShown) {
        _hideTypingIndicator();
      }
    })
    .catch(function() { /* best-effort, ignore failures */ });
}

async function sendCompanionMessage() {
  const text = textInput.value.trim();
  if (!text) return;

  // Show user bubble immediately.
  // No explicit msgTime → grouper falls back to wall-clock (within ms of
  // when the server will actually log it, good enough for 5-min bucket).
  addCompanionUserBubble(text, null, null);
  scrollCompanionChatToBottom();

  const fetchOptions = {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text: text }),
  };

  // Clear input
  textInput.value = '';
  textInput.style.height = '44px';

  // Send async — don't wait for reply
  try {
    const res = await fetch('/api/chat', fetchOptions);
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      const errWrapper = document.createElement('div');
      errWrapper.className = 'chat-bubble-wrapper system';
      errWrapper.innerHTML = wrapSystemContent(
        '<div class="chat-bubble system-bubble" style="color:var(--fn-danger)">' +
        escapeHtml(friendlyChatErrorMessage(data.error || '未知错误')) + '</div>'
      );
      companionChatMessages.appendChild(errWrapper);
      scrollCompanionChatToBottom();
      return;
    }
  } catch (err) {
    const errWrapper = document.createElement('div');
    errWrapper.className = 'chat-bubble-wrapper system';
    errWrapper.innerHTML = wrapSystemContent(
      '<div class="chat-bubble system-bubble" style="color:var(--fn-danger)">' +
      escapeHtml(friendlyChatErrorMessage(err.message)) + '</div>'
    );
    companionChatMessages.appendChild(errWrapper);
    scrollCompanionChatToBottom();
    return;
  }

  // Snapshot current last message ID before polling starts
  // Also update _companionLastMsgId so incremental poll won't re-add user's own message
  try {
    const snap = await fetch('/api/chat/history?limit=1').then(r => r.json()).catch(() => []);
    if (snap.length > 0) {
      _lastSeenReplyId = snap[snap.length - 1].id || '';
      _companionLastMsgId = snap[snap.length - 1].id || snap.length;
    }
  } catch(e) { /* ignore */ }

  // SSE will deliver the reply in real time. Polling is only a fallback.
  if (!_sseConnected) {
    _startReplyPolling();
    _startTypingPolling();
  }
}

let _companionLastMsgId = null; // track last message ID to detect real changes
let _companionLastMsgTime = ''; // track last message time for incremental fetch

async function loadCompanionChatHistory(options) {
  try {
    // Use 'since' for silent reconnect to reduce bandwidth
    const isSilent = options && options.silent;
    let items;
    if (options && options._bootstrapData) {
      // Use pre-fetched data from /api/bootstrap
      items = options._bootstrapData;
    } else {
      let url = '/api/chat/history?limit=200';
      if (isSilent && _companionLastMsgTime) {
        url += '&since=' + encodeURIComponent(_companionLastMsgTime);
      }
      const res = await fetch(url);
      items = await res.json();
    }

    const newLastId = items.length > 0 ? (items[items.length - 1].id || items.length) : null;
    // Update last message time for future 'since' queries
    if (items.length > 0) {
      var lastTime = items[items.length - 1].time || '';
      if (lastTime > _companionLastMsgTime) _companionLastMsgTime = lastTime;
    }

    // === Silent poll: check for new messages ===
    if (isSilent) {
      if (!items.length) return; // since-filtered: no new items = no changes
      const atBottom = companionChatMessages.scrollHeight - companionChatMessages.scrollTop - companionChatMessages.clientHeight < 80;
      if (!atBottom) {
        _showCompanionNewMsgBadge(true);
        return;
      }
      // User is at bottom + new messages → incremental append
      _hideTypingIndicator();
      for (let i = 0; i < items.length; i++) {
        const item = items[i];
        // Cross-channel dedup: skip if already rendered (from SSE or a prior poll)
        if (item.id && _renderedMsgIds.has(item.id)) continue;
        if (item.id && item.id === _companionLastMsgId) continue;
        if (item.role === 'user') {
          const imgUrl = item.image ? _assetUrl('/data/uploads/' + item.image) : null;
          addCompanionUserBubble(item.text || '', imgUrl, item.time);
        } else if (item.role === 'assistant') {
          addCompanionReplyBubble(item.text || '', item.tool_calls || item.actions_executed || [], item.time);
          if (item.type === 'reminder') shownReminderIds.add(item.id);
        }
        if (item.id) _markRendered(item.id);
      }
      _companionLastMsgId = newLastId;
      emptyCompanionState.style.display = 'none';
      scrollCompanionChatToBottom();
      return;
    }

    // === Full rebuild + scroll to bottom ===
    _companionLastMsgId = newLastId;
    _companionRebuilding = true;

    resetCompanionChatHistoryDom();
    // Reset dedup set since DOM is cleared; repopulate below as items render
    _renderedMsgIds.clear();

    if (items.length === 0) {
      emptyCompanionState.style.display = 'flex';
      return;
    }

    emptyCompanionState.style.display = 'none';

    // Timeline ctx was reset by resetCompanionChatHistoryDom above; each
    // bubble function calls _appendChatTimeMarkers internally so the
    // date separator / time anchor logic is centralized.
    for (const item of items) {
      if (item.id) _markRendered(item.id);
      if (item.role === 'user') {
        const imgUrl = item.image ? _assetUrl('/data/uploads/' + item.image) : null;
        addCompanionUserBubble(item.text || '', imgUrl, item.time);
      } else if (item.role === 'assistant') {
        addCompanionReplyBubble(item.text || '', item.tool_calls || item.actions_executed || [], item.time);
        if (item.type === 'reminder') {
          shownReminderIds.add(item.id);
        }
      }
    }

    _companionRebuilding = false;
    _lastFullChatReloadTs = Date.now();
    scrollCompanionChatToBottom();
    setTimeout(scrollCompanionChatToBottom, 300);
  } catch (err) {
    _companionRebuilding = false;
    if (!(options && options.silent)) {
      console.error('Failed to load chat history:', err);
    }
  }
}

function addReminderBubble(reminder) {

        '<div class="reminder-image-loading"><div class="spinner"></div><span>' + CHARACTER.name + ' 正在画画中...</span></div>' +

    '</div>';

    pollReminderImage(imgContainerId, filename, textId);
  }
}

function pollReminderImage(containerId, filename, textId) {
  let attempts = 0;
  const maxAttempts = 30; // 30 * 2s = 60s

  function revealText() {
    if (!textId) return;
    const textEl = document.getElementById(textId);
    if (textEl && textEl.classList.contains('reminder-text-hidden')) {
      textEl.classList.remove('reminder-text-hidden');
      textEl.classList.add('reminder-text-fadein');
      scrollCompanionChatToBottom();
    }
  }

  const interval = setInterval(async () => {
    attempts++;
    if (attempts > maxAttempts) {
      clearInterval(interval);
      const container = document.getElementById(containerId);
      if (container) container.innerHTML = '';
      revealText();
      return;
    }

    try {
      const res = await fetch('/api/reminders/image-ready/' + encodeURIComponent(filename));
      const data = await res.json();
      if (data.ready) {
        clearInterval(interval);
        const container = document.getElementById(containerId);
        if (container) {
          const imgUrl = escapeHtml(data.url) + '?' + Date.now();
          container.innerHTML = '<img src="' + imgUrl + '" alt="' + CHARACTER.name + '" style="width:100%;cursor:pointer" onclick="openLightbox(this.src)">';
        }
        revealText();
      }
    } catch (e) {
      // Silently retry
    }
  }, 2000);
}

function startReminderPolling() {
  // Reminders now delivered via SSE chat_message events (proactive messages).
  // No polling needed — kept as empty stub for backward compatibility.
}

function _tryImageExtensions(imgEl, basePath, exts, onAllFailed) {
  // Try loading image with different extensions; on onerror cycle to next
  let idx = 0;
  imgEl.onerror = function() {
    idx++;
    if (idx < exts.length) {
      imgEl.src = basePath + exts[idx];
    } else {
      imgEl.onerror = null;
      if (onAllFailed) onAllFailed();
    }
  };
  imgEl.src = basePath + exts[idx];
}

function addHistoryReminderBubble(reminder) {
  // Goes through the timeline grouper (cross-day + 5-min cluster).
  _appendChatTimeMarkers(reminder.created_at || reminder.time || null);

  const wrapper = document.createElement('div');
  wrapper.className = 'reminder-bubble-wrapper';

  const rawImage = reminder.image_url || (reminder.image ? reminder.image : '');

  wrapper.innerHTML =
    '<img class="reminder-avatar" src="' + CHARACTER.avatar_url + '" alt="' + CHARACTER.name + '">' +
    '<div class="reminder-content">' +
      '<div class="reminder-name">' + CHARACTER.name + '</div>' +
      (rawImage ? '<div class="reminder-image-container"></div>' : '') +
      '<div class="reminder-text">' + escapeHtml(reminder.text || '') + '</div>' +
    '</div>';

  companionChatMessages.appendChild(wrapper);
  emptyCompanionState.style.display = 'none';
  shownReminderIds.add(reminder.id);

  // Dynamically try .png / .jpg / .webp until one loads
  if (rawImage) {
    const container = wrapper.querySelector('.reminder-image-container');
    const filename = rawImage.split('/').pop();
    const base = filename.lastIndexOf('.') > 0 ? filename.substring(0, filename.lastIndexOf('.')) : filename;
    const basePath = _assetUrl('/data/uploads/' + base);

  }

var __currentVersion = '{{ build_version }}';
var __updateTimer = null;

function _hasUnsavedDraft() {

    return hasText;
  } catch (e) {

function showUpdateToast(message) {
  // Suppress toast for 30s after a forced update to prevent loop
  var justUpdated = sessionStorage.getItem('_cl_updated_at');
  if (justUpdated && (Date.now() - parseInt(justUpdated, 10)) < 30000) {
    return;
  }
  sessionStorage.removeItem('_cl_updated_at');
  var toast = document.getElementById('updateToast');
  if (toast && message) toast.textContent = message;
  if (toast) toast.classList.add('show');
}

// Best-effort backend logger — silent on failure, used for debug-reload tracing
function _clientDebugLog(tag, msg) {
  try {
    fetch('/api/debug/client_log', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tag: tag, msg: msg }),
      keepalive: true,
    }).catch(function(){});
  } catch(e) {}
}

// Client-mode (Mac DMG) is a thick client with bundled code. Auto-reload is
// meaningless here — the only way to get new code is to reinstall DMG. So
// we swallow all auto-reload triggers and only honor user-initiated refresh.
function _isClientMode() {
  return !!window.__MIRU_CLIENT_MODE__;
}

function scheduleAutoUpdate(reason) {
  _clientDebugLog('scheduleAutoUpdate', reason + ' | clientMode=' + _isClientMode()
                   + ' | stack=' + (new Error().stack || '').substring(0, 400));
  if (_isClientMode()) {
    console.log('[Update] scheduleAutoUpdate suppressed in client mode:', reason);
    return;
  }
  if (__updateTimer) return;
  var tip = reason
    ? ('检测到新版本，正在自动刷新（' + reason + '）')
    : '检测到新版本，正在自动刷新';
  showUpdateToast(tip);
  __updateTimer = setTimeout(function() {
    forceUpdate();
  }, 1200);
}

async function forceUpdate() {
  _clientDebugLog('forceUpdate', 'clientMode=' + _isClientMode()
                   + ' | stack=' + (new Error().stack || '').substring(0, 400));
  if (_isClientMode()) {
    console.log('[Update] forceUpdate suppressed in client mode — user must reinstall DMG for real updates');
    return;
  }
  if (__updateTimer) {
    clearTimeout(__updateTimer);
    __updateTimer = null;
  }
  // Mark update time so post-reload SW activation won't re-trigger toast
  sessionStorage.setItem('_cl_updated_at', Date.now().toString());
  // Clear all SW caches
  if ('caches' in window) {
    var keys = await caches.keys();
    await Promise.all(keys.map(function(k) { return caches.delete(k); }));
  }
  // Unregister service worker so next load gets fresh one
  if ('serviceWorker' in navigator) {
    var regs = await navigator.serviceWorker.getRegistrations();
    await Promise.all(regs.map(function(r) { return r.unregister(); }));
  }
  // Hard reload (bypass cache)
  _clientDebugLog('RELOAD', 'window.location.reload(true) about to fire');
  window.location.reload(true);
}

// Instrument location.reload so we capture any caller that bypasses forceUpdate
(function() {
  try {
    var _origReload = window.location.reload.bind(window.location);
    window.location.reload = function() {
      var stack = (new Error().stack || '').substring(0, 500);
      _clientDebugLog('LOCATION.RELOAD',
        'clientMode=' + _isClientMode() + ' | args=' + JSON.stringify([].slice.call(arguments)) +
        ' | stack=' + stack);
      if (_isClientMode()) {
        console.warn('[Debug] location.reload() suppressed in client mode. Stack:', stack);
        return;
      }
      return _origReload.apply(null, arguments);
    };
  } catch(e) { /* older browsers may disallow overriding location.reload */ }
})();

// --- Model change polling: auto-refresh persona list + CHARACTER when active model changes ---
var _lastKnownActiveModelId = null;
var _lastKnownModelCount = -1;
function startModelPolling() {
  // Seed with current state
  Promise.all([
    fetch('/api/models/active', { cache: 'no-store' }).then(r => r.json()),
    fetch('/api/models', { cache: 'no-store' }).then(r => r.json()),
  ]).then(([active, models]) => {
    _lastKnownActiveModelId = active.id || active.active || null;
    _lastKnownModelCount = Array.isArray(models) ? models.length : -1;
  }).catch(() => {});
  setInterval(async function() {
    if (_sseConnected) return; // SSE handles model_changed events
    try {
      var [activeRes, listRes] = await Promise.all([
        fetch('/api/models/active', { cache: 'no-store' }),
        fetch('/api/models', { cache: 'no-store' }),
      ]);
      var activeData = await activeRes.json();
      var listData = await listRes.json();
      var activeId = activeData.id || activeData.active || null;
      var modelCount = Array.isArray(listData) ? listData.length : -1;
      var changed = false;
      if (_lastKnownActiveModelId !== null && activeId !== _lastKnownActiveModelId) {
        console.log('[ModelPoll] Active model changed:', _lastKnownActiveModelId, '->', activeId);
        changed = true;
      }
      if (_lastKnownModelCount >= 0 && modelCount !== _lastKnownModelCount) {
        console.log('[ModelPoll] Model count changed:', _lastKnownModelCount, '->', modelCount);
        changed = true;
      }
      _lastKnownActiveModelId = activeId;
      _lastKnownModelCount = modelCount;
      if (changed) {
        // Refresh CHARACTER global
        try { var cr = await fetch('/api/character', { cache: 'no-store' }); window.CHARACTER = await cr.json(); } catch(e) {}
        // Refresh persona list if settings panel is visible
        if (document.getElementById('settingsPersonaList')) settingsLoadPersonaList();
      }
    } catch(e) {}
  }, 5000);
}

function startVersionPolling() {
  // Skip entirely in client mode (DMG) — thick client, bundled code,
  // auto-update is not a feature there.
  if (_isClientMode()) {
    console.log('[Update] Version polling disabled in client mode');
    return;
  }
  setInterval(async function() {
    try {
      var res = await fetch('/api/version', { cache: 'no-store' });
      var data = await res.json();
      if (data.version && data.version !== __currentVersion) {
        console.log('[Update] New version:', data.version, '(current:', __currentVersion + ')');
        scheduleAutoUpdate('版本轮询');
      }
    } catch (e) { /* offline or error, ignore */ }
  }, 15000);
}

async function initPWA() {
  if (!('serviceWorker' in navigator)) return;
  // In client mode (DMG), skip SW entirely. SW's version-change activation
  // broadcasts NEW_VERSION → auto-reload, which is pointless for bundled apps
  // and causes the "window reloads on focus" UX bug.
  if (_isClientMode()) {
    console.log('[PWA] ServiceWorker skipped in client mode');
    // Also unregister any existing SW so it stops interfering
    try {
      var regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(function(r) { return r.unregister(); }));
      if (regs.length > 0) console.log('[PWA] Unregistered', regs.length, 'legacy SW');
    } catch(e) {}
    return;
  }

  try {
    var reg = await navigator.serviceWorker.register('/service-worker.js');

    // Detect new service worker updates → show toast
    reg.addEventListener('updatefound', function() {
      var newSW = reg.installing;
      if (!newSW) return;
      newSW.addEventListener('statechange', function() {
        if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
          scheduleAutoUpdate('SW 更新');
        }
      });
    });

    // Listen for messages from service worker (only show if version differs)
    navigator.serviceWorker.addEventListener('message', function(event) {
      if (event.data && event.data.type === 'NEW_VERSION'
          && event.data.version && event.data.version !== __currentVersion) {
        scheduleAutoUpdate('SW 消息');
      }
    });

    // Subscribe to push notifications if supported
    if (!('PushManager' in window)) return;

    // Android APK has MiruConnectionService native SSE + notification.
    // Web push would be a duplicate channel — skip subscription and clean up
    // any stale subscription left over from older installs.
    var isAndroidAPK = (typeof window.MiruAndroid !== 'undefined');
    if (isAndroidAPK) {
      try {
        var existing = await reg.pushManager.getSubscription();
        if (existing) {
          var endpoint = existing.endpoint;
          await existing.unsubscribe();
          fetch('/api/push/unsubscribe', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ endpoint: endpoint }),
          }).catch(function(){});
          console.log('[PWA] Unsubscribed web push on Android APK (native SSE replaces it)');
        }
      } catch (e) { console.log('[PWA] Cleanup push on Android failed:', e.message); }
      return;
    }

    // Request notification permission (needed on mobile)
    if (Notification.permission === 'default') {
      // On mobile, prompt after a short delay so it's not jarring
      if (_isMobile) {
        setTimeout(function() { Notification.requestPermission(); }, 3000);
      } else {
        await Notification.requestPermission();
      }
    }
    if (Notification.permission !== 'granted') return;

    var sub = await reg.pushManager.getSubscription();
    if (!sub) {
      var res = await fetch('/api/push/vapid-key');
      var data = await res.json();
      if (!data.publicKey) return;

      var padding = '='.repeat((4 - data.publicKey.length % 4) % 4);
      var raw = atob(data.publicKey.replace(/-/g, '+').replace(/_/g, '/') + padding);
      var arr = new Uint8Array(raw.length);
      for (var i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);

      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: arr,
      });

      await fetch('/api/push/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(sub.toJSON()),
      });
    }
  } catch (e) {
    console.log('PWA init:', e.message);
  }

  // Start version polling (works even without SW)
  startVersionPolling();
  startModelPolling();
}

  ]},
];
var _obStep = 0;
var _obAnswers = {};

function _obRender() {
  var overlay = document.getElementById('onboardingOverlay');
  var q = _obQuestions[_obStep];
  document.getElementById('obTitle').textContent = _obStep === 0 ? '初次见面！' : '';
  document.getElementById('obSubtitle').textContent = _obStep === 0 ? '回答几个问题，让 Miru 更了解你' : '';
  document.getElementById('obQuestion').textContent = q.q;
  // Progress dots
  var dotsHtml = '';
  for (var i = 0; i < _obQuestions.length; i++) {
    dotsHtml += '<div class="ob-dot' + (i <= _obStep ? ' active' : '') + '"></div>';
  }
  document.getElementById('obProgress').innerHTML = dotsHtml;
  // Input area
  var inputDiv = document.getElementById('obInput');
  if (q.type === 'text') {
    inputDiv.innerHTML = '<input type="text" id="obTextInput" placeholder="' + (q.placeholder || '') + '" value="' + (_obAnswers[q.key] || '') + '">';
    var inp = document.getElementById('obTextInput');
    inp.focus();
    inp.addEventListener('keydown', function(e) { if (e.key === 'Enter') _obNext(false); });
  } else if (q.type === 'options') {
    var html = '<div class="ob-options">';
    q.options.forEach(function(opt) {
      var sel = _obAnswers[q.key] === opt.value ? ' selected' : '';
      html += '<div class="ob-option' + sel + '" onclick="_obSelect(\'' + q.key + '\',\'' + opt.value + '\')">' + opt.label + '</div>';
    });
    html += '</div>';
    inputDiv.innerHTML = html;
  }
  // Button text
  document.getElementById('obNext').textContent = _obStep === _obQuestions.length - 1 ? '完成' : '下一步';
}

function _obSelect(key, value) {
  _obAnswers[key] = value;
  document.querySelectorAll('#obInput .ob-option').forEach(function(el) {
    el.classList.toggle('selected', el.textContent === _obQuestions[_obStep].options.find(function(o){return o.value===value}).label);
  });
}

function _obNext(skip) {
  var q = _obQuestions[_obStep];
  if (!skip) {
    if (q.type === 'text') {
      var val = (document.getElementById('obTextInput') || {}).value || '';
      if (val.trim()) _obAnswers[q.key] = val.trim();
    }
    // For options, already stored by _obSelect
  }
  if (_obStep < _obQuestions.length - 1) {
    _obStep++;
    _obRender();
  } else {
    _obSubmit();
  }
}

function _obSubmit() {
  // Fire-and-forget. Backend now returns ms-fast (greeting LLM runs in a
  // background thread; result arrives via SSE). 2026-05-08 fix: previously
  // this was `await fetch(...)` which blocked 5-30s on the LLM call →
  // overlay stayed up → impatient user re-tapped → duplicate greetings.
  fetch('/api/onboarding/submit', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(_obAnswers),
  }).catch(function(e) { console.warn('[Onboarding] submit failed:', e); });
  // Close overlay immediately so user sees the chat view.
  localStorage.setItem('miru_onboarded', '1');
  var overlay = document.getElementById('onboardingOverlay');
  overlay.classList.add('fade-out');
  setTimeout(function() { overlay.style.display = 'none'; }, 600);

  // Show typing indicator so the user knows Miru is composing the
  // first greeting; it will be cleared when SSE delivers chat_message.
  try {
    if (typeof _showTypingIndicator === 'function') {
      _showTypingIndicator();
    }
  } catch(e) { /* indicator is optional */ }
}

function _checkOnboarding(preloadedData) {
  // No localStorage short-circuit — VPS origin's localStorage is shared
  // across all users on the same domain. A previous user's "onboarded=1"
  // flag would silently suppress the questionnaire for a new account
  // (admin-side delete + new invitation, or QR re-pair to a different
  // account on the same browser). The server's needs_onboarding flag
  // is computed per-user from human.md so it's authoritative.
  function _apply(data) {
    if (data.needs_onboarding) {
      _obStep = 0;
      _obAnswers = {};
      document.getElementById('onboardingOverlay').style.display = 'flex';
      _obRender();
    }
  }
  if (preloadedData) {
    _apply(preloadedData);
  } else {
    fetch('/api/onboarding/status').then(function(r) { return r.json(); }).then(_apply).catch(function() {});
  }
}

// Desktop screenshot + permission guide.
// macOS uses TCC permission state. Windows has no equivalent prompt, so it
// performs a real local capture probe only after the user clicks Enable.
var _desktopScreenshotGuideShown = false;

function _persistScreenCaptureSettings(payload) {
  payload = payload || {};
  // Mac DMG remote mode has two places that matter:
  //   1. the private server, for UI/account state;
  //   2. the local native bridge, for the actual ScreenSensor process.
  // Keep them in sync when first-launch permission flow auto-enables capture.
  try {
    if (window.MiruDesktop && typeof window.MiruDesktop.setLocalSettings === 'function') {
      window.MiruDesktop.setLocalSettings(payload).catch(function(){});
    }
  } catch(e) {}
  try {
    fetch('/api/user-settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
      keepalive: true,
    }).catch(function(){});
  } catch (e) {
    try {
      var blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
      navigator.sendBeacon && navigator.sendBeacon('/api/user-settings', blob);
    } catch (_) {}
  }
}

function _showDesktopScreenshotGuide() {
  if (_desktopScreenshotGuideShown) return;
  var isClient = !!window.__MIRU_CLIENT_MODE__;
  if (isClient) {
    // Three skip conditions, in order (any-true → never show modal):
    //   1. **Native permission check** (ground truth, most authoritative)
    //      via MiruDesktop.checkScreenPermission() →
    //      CGPreflightScreenCaptureAccess(). If macOS itself says we
    //      already have the permission, there's literally no reason to
    //      show a "grant me permission" modal — that was the whole bug.
    //   2. localStorage flag (fast path, no network)
    //   3. server `screenshot_perm_guided` sticky flag (cross-device,
    //      survives localStorage wipes / origin mismatches)
    //
    // The native check (1) makes the persistence layer fixes redundant
    // in the common case, but we keep (2)+(3) because:
    //   - User may dismiss the guide BEFORE granting permission
    //     (intent: "I'll do it later, stop nagging"). Native check would
    //     still say "denied" — sticky flag is the only way to honor that.
    //   - Bridge may be unavailable (older DMG, non-Mac browser).

    // Helper that runs (2)+(3) — used as the slow fallback path.
    function _maybeShowModalFallback(platformName) {
      if (localStorage.getItem('miru_desktop_perm_guided')) return;
      fetch('/api/user-settings', { cache: 'no-store' }).then(function(r) { return r.json(); }).then(function(body) {
        var data = (body && body.settings) ? body.settings : body;
        if (data && (data.screenshot_perm_guided || data.screenshot_enabled)) {
          try { localStorage.setItem('miru_desktop_perm_guided', '1'); } catch(e) {}
          return;
        }
        _desktopScreenshotGuideShown = true;
        _showClientScreenRecordingModal(false, 'first', platformName);
      }).catch(function() {
        _desktopScreenshotGuideShown = true;
        _showClientScreenRecordingModal(false, 'first', platformName);
      });
    }

    // Try the native check first.
    var nativeChecked = false;
    try {
      if (window.MiruDesktop && typeof window.MiruDesktop.checkScreenPermission === 'function') {
        nativeChecked = true;
        window.MiruDesktop.checkScreenPermission().then(function(res) {
          var nativePlatform = (res && res.platform) || window.__MIRU_DESKTOP_PLATFORM__ || 'macos';
          if (nativePlatform === 'windows') {
            // Capability is not consent. Do not capture or enable anything
            // until the user explicitly clicks the Windows modal button.
            _maybeShowModalFallback('windows');
            return;
          }
          if (res && res.ok && res.granted === true) {
            // macOS confirms we have the permission — never bother the
            // user. Latch all the persistence layers so the slow paths
            // also short-circuit on subsequent loads.
            try { localStorage.setItem('miru_desktop_perm_guided', '1'); } catch(e) {}
            // Also check whether this user has ever been guided. If not,
            // this is the "permission exists from a previous install or
            // was granted manually before first launch" path — treat the
            // pre-existing permission as implicit consent to enable
            // capture, otherwise the sensor would stay silently off and
            // the user would have to dig into Settings to figure out why
            // nothing is being captured.
            //
            // If they HAVE been guided before, leave screenshot_enabled
            // alone — they may have intentionally toggled it off later
            // and we don't want to re-enable behind their back.
            fetch('/api/user-settings', { cache: 'no-store' }).then(function(r) { return r.json(); }).then(function(body) {
              var data = (body && body.settings) ? body.settings : body;
              var payload = { screenshot_perm_guided: true };
              if (data && !data.screenshot_perm_guided) {
                payload.screenshot_enabled = true;
              }
              _persistScreenCaptureSettings(payload);
            }).catch(function() {
              // GET failed — fall back to enabling both (safer than
              // silently never starting the sensor for this user).
              _persistScreenCaptureSettings({
                screenshot_enabled: true,
                screenshot_perm_guided: true,
              });
            });
            return;
          }
          // Native says denied OR bridge errored — fall through to the
          // sticky-flag path so we still honor "user dismissed it once".
          _maybeShowModalFallback(nativePlatform);
        }).catch(function() {
          _maybeShowModalFallback(window.__MIRU_DESKTOP_PLATFORM__ || 'macos');
        });
      }
    } catch (e) { nativeChecked = false; }
    if (!nativeChecked) _maybeShowModalFallback(window.__MIRU_DESKTOP_PLATFORM__ || 'macos');
    return;
  }
  // Plain browser fallback (old toast)
  fetch('/api/user-settings', { cache: 'no-store' }).then(function(r) { return r.json(); }).then(function(body) {
    var data = (body && body.settings) ? body.settings : body;
    if (data.screenshot_enabled) return;
    if (localStorage.getItem('miru_desktop_ss_guide_dismissed')) return;
    _desktopScreenshotGuideShown = true;
    var toast = document.createElement('div');
    toast.id = 'desktopScreenshotGuideToast';
    toast.style.cssText = 'position:fixed;bottom:72px;left:12px;right:12px;max-width:420px;margin:0 auto;background:var(--bg-surface);border:1px solid var(--border-default);border-radius:14px;padding:14px 16px;z-index:1500;box-shadow:0 8px 32px rgba(0,0,0,0.12);display:flex;align-items:center;gap:12px;animation:slideUp 0.3s ease;';
    toast.innerHTML = '<div style="flex:1;"><div style="font-size:14px;font-weight:500;color:var(--text-primary);margin-bottom:4px;">开启屏幕观察？</div><div style="font-size:12px;color:var(--text-muted);">开启后 Miru 会定时截取屏幕内容，理解你在做什么并主动陪伴你</div></div>'
      + '<button onclick="_acceptDesktopScreenshotGuide()" style="border:none;background:var(--airi-pink);color:#fff;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;white-space:nowrap;">开启</button>'
      + '<button onclick="_dismissDesktopScreenshotGuide()" style="border:none;background:none;color:var(--text-muted);font-size:12px;cursor:pointer;padding:4px;">以后再说</button>';
    document.body.appendChild(toast);
  }).catch(function(){});
}

async function _permModalEnableWindows() {
  var button = document.getElementById('permModalEnableBtn');
  var error = document.getElementById('permModalError');
  if (button) {
    button.disabled = true;
    button.textContent = '正在测试截屏';
  }
  if (error) error.style.display = 'none';
  try {
    if (!window.MiruDesktop || typeof window.MiruDesktop.probeScreenCapture !== 'function') {
      throw new Error('Windows 本机桥接尚未准备好，请稍后重试。');
    }
    var result = await window.MiruDesktop.probeScreenCapture();
    if (!result || !result.ok) throw new Error((result && result.error) || '截屏测试失败。');
    try { localStorage.setItem('miru_desktop_perm_guided', '1'); } catch(e) {}
    _persistScreenCaptureSettings({
      screenshot_enabled: true,
      screenshot_perm_guided: true,
    });
    if (button) button.textContent = '截屏测试成功，已开启';
    var overlay = document.getElementById('permModalOverlay');
    setTimeout(function() {
      if (overlay) overlay.remove();
    }, 900);
    _startSensorHealthWatch();
  } catch (e) {
    if (error) {
      error.textContent = (e && e.message) || '截屏测试失败，请检查后重试。';
      error.style.display = 'block';
    }
    if (button) {
      button.disabled = false;
      button.textContent = '重新测试截屏';
    }
  }
}

function _permModalDismissWithoutEnable() {

// Reset sensor backoff + close modal. Backend's set_enabled(true) clears
// _capture_disabled and _capture_fail_count, so the next tick (≤ the user's
// configured auto_screenshot_interval) tries capturing again.
function _permModalRetryNow() {
  _persistScreenCaptureSettings({ screenshot_enabled: true });

function _permModalOpenSettings() {
  // CRITICAL: dismiss FIRST so localStorage flag is set + flushed before any
  // navigation. Bug we just fixed: previously `window.location.assign(...)`
  // ran first and made WKWebView navigate away from /app — the synchronous
  // localStorage.setItem call below technically ran, but the LocalStorage
  // backend hadn't flushed to disk when the document got destroyed, so the
  // flag was lost. Next launch the modal re-showed.
  _permModalDismiss();
  // Prefer the native launcher bridge so the WebView never navigates away.
  // MiruDesktop.openExternalUrl routes through NSWorkspace.openURL on the
  // main thread, keeping /app alive. Falls back to direct navigation only
  // when the bridge is missing (e.g. SPA opened in a plain browser, where
  // macOS handles the URL externally without unloading the page anyway).
  var url = 'x-apple.systempreferences:com.apple.preference.security?Privacy_ScreenCapture';
  try {
    if (window.MiruDesktop && typeof window.MiruDesktop.openExternalUrl === 'function') {
      window.MiruDesktop.openExternalUrl(url);
      return;
    }
  } catch (e) {}
  try { window.location.assign(url); } catch (e) {
    try { window.location.assign('x-apple.systempreferences:com.apple.preference.security'); } catch(_) {}
  }
}

function _permModalDismiss() {
  var o = document.getElementById('permModalOverlay');
  if (o) o.remove();
  try { localStorage.setItem('miru_desktop_perm_guided', '1'); } catch(e) {}
  // Latch the sticky server flag so this modal never shows again, no
  // matter what happens to localStorage. screenshot_enabled is also set
  // so the sensor starts capturing as soon as permission is granted.
  // keepalive:true ensures the request survives a page navigation/quit
  // (e.g. user immediately Cmd+Q after dismissing).
  _persistScreenCaptureSettings({
    screenshot_enabled: true,
    screenshot_perm_guided: true,
  });
  // Start the runtime health banner poll so we can tell the user if
  // permission never actually gets granted.
  _startSensorHealthWatch();
}

// ===== Runtime sensor health watch =====
// Poll /api/debug/sensor_status every 20s. When the sensor has backed off
// (capture_disabled=true, after 3 consecutive capture failures), escalate
// with the same permission modal the first-launch guide uses — reason=
// 'disabled' gives it a stronger headline ("一直没能看到屏幕") and an
// "already authorized, retry now" action. Rate-limited to once per 10 min
// so we don't re-nag while the user is on the way to System Settings.
//
// No banner: the modal alone is enough, per user feedback. A persistent
// banner would clutter the main chat view without adding new information.
var _sensorHealthTimer = null;
function _startSensorHealthWatch() {
  // Intentionally NOT gated on __MIRU_CLIENT_MODE__ — on web / APK the
  // debug endpoint returns `running: false`, so the modal never fires
  // anyway. Dropping the gate removes a dependency on WKUserScript
  // injection timing.
  if (_sensorHealthTimer) return;
  var check = function() {
    fetch('/api/debug/sensor_status', { cache: 'no-store' })
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (!d || !d.ok || !d.running) return;
        // Only escalate if the user has actually opted in.
        if (!d.user_enabled) return;
        if (d.capture_disabled && _canShowDisabledPermModal()) {
          var platformName = window.__MIRU_DESKTOP_PLATFORM__ || '';
          if (!platformName && window.pywebview && window.pywebview.api) platformName = 'windows';
          _showClientScreenRecordingModal(false, 'disabled', platformName);
          _markDisabledPermModalShown();
        }
      })
      .catch(function() { /* transient errors are fine, retry next tick */ });
  };
  check();
  _sensorHealthTimer = setInterval(check, 20 * 1000);
}

// Rate-limit the "disabled" permission modal to 10 min so we don't re-show
// it every 20s poll while the user is on the way to System Settings.
function _canShowDisabledPermModal() {
  try {
    var last = parseInt(localStorage.getItem('miru_disabled_perm_modal_at') || '0', 10);
    return (Date.now() - last) > 10 * 60 * 1000;
  } catch (e) { return true; }
}
function _markDisabledPermModalShown() {
  try { localStorage.setItem('miru_disabled_perm_modal_at', String(Date.now())); } catch(e) {}
}

// ===== APK version check =====
// Cached for the click handler (onclick attribute calls into window scope)
window._apkUpdateCtx = null;

// Unified click handler — robust against bridge typeof quirks + fallback to
// system browser if bridge is unavailable. Exposed globally so the inline
// onclick attribute can reach it (avoids addEventListener timing bugs).
window._handleApkUpdateClick = function() {
  var ctx = window._apkUpdateCtx || {};
  var absUrl = ctx.url || '';
  var versionName = ctx.versionName || '';
  var btn = document.getElementById('apkUpdateBtn');
  var label = document.getElementById('apkUpdateLabel');

  // Immediate visual feedback so user knows click registered
  if (btn) { btn.disabled = true; btn.textContent = '准备中…'; }
  console.log('[ApkUpdate] click → url=' + absUrl + ' v=' + versionName);

  // Try the native bridge (DownloadManager + FileProvider install)
  var bridgeTried = false;
  if (window.MiruAndroid) {
    try {
      // typeof can be 'function' OR 'object' across Android WebView versions
      // — just check !== 'undefined' and call with try/catch
      if (typeof window.MiruAndroid.startApkUpdate !== 'undefined') {
        bridgeTried = true;
        window.MiruAndroid.startApkUpdate(absUrl, versionName);
        if (label) label.textContent = '正在下载新版本…';
        return;
      }
    } catch(e) {
      console.error('[ApkUpdate] bridge call failed', e);
      if (label) label.textContent = '原生下载失败，改用浏览器下载';
    }
  }

  // Fallback: copy download URL to clipboard (window.open is blocked in Capacitor WebView)
  try {
    navigator.clipboard.writeText(absUrl).then(function() {
      if (label) label.textContent = '下载链接已复制到剪贴板';
      if (btn) { btn.textContent = '已复制'; btn.disabled = false; }
    }).catch(function() {
      // clipboard API blocked — show the URL inline so user can long-press to copy
      if (label) label.textContent = absUrl;
      if (label) { label.style.wordBreak = 'break-all'; label.style.whiteSpace = 'normal'; label.style.fontSize = '11px'; }
      if (btn) { btn.style.display = 'none'; }
    });
  } catch(e) {
    console.error('[ApkUpdate] clipboard failed', e);
    if (label) label.textContent = absUrl;
    if (btn) { btn.style.display = 'none'; }
  }
};

function _checkAppUpdate() {
  // 暂时禁用 APK 内置版本检查弹窗 — DownloadManager 在当前签名下经常显示"下载失败",
  // 且自动比对 latest.json 容易让"刚装完就弹更新"误导用户。要重新启用直接删掉下面这行 return。
  return;
  if (!window.MiruAndroid || typeof window.MiruAndroid.getAppVersionCode === 'undefined') return;
  var localCode = -1;
  try { localCode = window.MiruAndroid.getAppVersionCode(); } catch(e) { return; }
  if (localCode < 0) return;

  fetch('/api/app/latest').then(function(r) { return r.json(); }).then(function(meta) {
    if (!meta || !meta.version_code || meta.version_code <= localCode) return;
    // Resolve an absolute download URL (DownloadManager needs absolute http(s))
    var rawUrl = meta.download_url || '/api/app/download';

    // string-escaping pitfalls with URLs / version strings containing quotes)
    window._apkUpdateCtx = { url: absUrl, versionName: meta.version_name || '' };

    // Sparkle icon + body + action + close
    banner.innerHTML =
      '<span style="flex:0 0 auto;font-size:16px;filter:drop-shadow(0 1px 2px rgba(0,0,0,0.14))">\u{1F338}</span>' +
      '<span id="apkUpdateLabel" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;' +
        'font-weight:500;line-height:1.3;letter-spacing:0.2px;' +
        'text-shadow:0 1px 1px rgba(180,90,110,0.25)">' +

      '</span>' +
      '<button id="apkUpdateBtn" type="button" onclick="_handleApkUpdateClick()" style="' +
        'flex:0 0 auto;border:none;cursor:pointer;' +
        'background:rgba(255,255,255,0.32);color:#fff;' +
        'padding:6px 14px;border-radius:999px;' +
        'font-size:13px;font-weight:600;letter-spacing:0.3px;' +

        '-webkit-tap-highlight-color:rgba(255,255,255,0.3);' +

        'aria-label="关闭" style="' +

    document.body.appendChild(banner);

// Invoked by ApkUpdateManager (Java) during download
window._onApkUpdateProgress = function(payload) {
  try {
    var label = document.getElementById('apkUpdateLabel');
    var btn = document.getElementById('apkUpdateBtn');
    if (!label) return;
    if (payload.state === 'running' || payload.state === 'pending' || payload.state === 'paused') {
      var pct = (typeof payload.pct === 'number' && payload.pct >= 0) ? payload.pct : null;
      label.textContent = pct !== null
        ? '正在下载… ' + pct + '%'
        : '正在下载…';
      if (btn) { btn.disabled = true; btn.textContent = '下载中'; }
    } else if (payload.state === 'done') {
      label.textContent = '下载完成，准备安装…';
      if (btn) { btn.textContent = '已下载'; }
    } else if (payload.state === 'error') {
      label.textContent = '下载失败，请稍后重试';
      if (btn) { btn.disabled = false; btn.textContent = '重试'; }
    }
  } catch(e) {}
};

(async function _initBootstrap() {

    + ' | time=' + new Date().toISOString().substring(11, 19));

  try {
    var res = await fetch('/api/bootstrap');
    if (res.status === 401) {

      _handleAuthLost();
      return;
    }

    _fallbackLoadRelationship();

  startReminderPolling();

          path: window.location.pathname,

        }).catch(function(){});

  var _splash = document.getElementById('bootSplash');
  if (_splash) {
    _splash.style.opacity = '0';
    setTimeout(function() {
      _splash.remove();
      _notifyDesktopAppReady();

})();

})();

// Network offline/online detection
window.addEventListener('offline', function() { _updateConnectionStatus('offline'); });
window.addEventListener('online', function() {
  // Silent reconnect — just update dot, no banner
  _sseBackoff = _SSE_BACKOFF_INIT;
  _sseConsecutiveErrors = 0;
  var dot = document.getElementById('connectionDot');
  if (dot) dot.style.background = 'var(--fn-warning)';
  _connectSSE();
  setTimeout(function() { loadCompanionChatHistory({ silent: true }); }, 1000);
});

// Visibility change: reconnect SSE only when it's actually dead.
// Background motivation — Android's WebView JS engine is frozen while
// backgrounded so `_sseConnected` can be stale (true even though the TCP
// connection is long dead). On Mac/desktop the connection usually survives
// background; unconditionally force-reconnecting there causes visible
// UI churn (chat re-fetch, SSE toast) that feels like a full reload.
// Strategy: only reconnect if the heartbeat went stale while backgrounded.
document.addEventListener('visibilitychange', function() {
  if (document.visibilityState !== 'visible') return;
  var now = Date.now();
  var stale = _sseLastHeartbeat ? (now - _sseLastHeartbeat) : Infinity;
  var sseHealthy = _sseConnected && stale < _SSE_HEARTBEAT_TIMEOUT;
  if (!sseHealthy) {
    console.log('[SSE] Page visible + connection stale (' + stale + 'ms), reconnecting');
    _forceReconnectSSE();
  } else {
    console.log('[SSE] Page visible + SSE healthy, no-op');
  }
  // Always check pending shared image (cheap, view-safe)
  _checkSharedImage();
});

// ===== Pet ↔ Main-UI visibility coordination =====
// LEGACY: while this page is open, send heartbeat to Flask so the desktop
// pet knows it should hide itself (AIRI was shown as the sidebar instead).
//
// Design C (DMG client mode): the floating Tauri pet stays visible AT ALL
// TIMES and the companion panel inside this page is hidden. So the
// "mutex heartbeat" must NOT run — if it did, the pet would auto-hide
// on seeing this page open. The launcher injects
// window.__MIRU_CLIENT_MODE__ = true at documentStart for DMG pages.
// Mobile/APK: no pet, no heartbeat either.
// Plain browser: keep legacy behavior (companion panel + heartbeat).
(function startUiHeartbeat() {
  if (_isMobile) return;
  if (window.__MIRU_CLIENT_MODE__) return;  // Design C: pet is always-on
  function beat() {
    fetch('/api/pet/ui-active', { method: 'POST', keepalive: true }).catch(function() {});
  }
  beat();
  setInterval(beat, 1500);

  // Auto-show AIRI sidebar when the page loads (desktop browser only —
  // the pet will auto-hide itself via the heartbeat above)
  setTimeout(function() { if (!airiPanelOpen) showAiriPanel(); }, 1500);

  // When the user is about to leave / close the page, stop the heartbeat.
  window.addEventListener('pagehide', function() {
    navigator.sendBeacon('/api/pet/ui-active', 'reset');
  });
})();

// ===== Mobile: iOS keyboard handling (visualViewport API) =====
if (_isMobile && window.visualViewport) {
  var _inputBarWrapper = document.querySelector('.input-bar-wrapper');
  var _mobileTabBar = document.getElementById('mobileTabBar');
  window.visualViewport.addEventListener('resize', function() {
    // When keyboard opens, visualViewport.height shrinks
    var keyboardHeight = window.innerHeight - window.visualViewport.height;
    var msgs = document.querySelector('.chat-messages');
    if (keyboardHeight > 100) {
      // Keyboard is open — move input bar above keyboard, hide tab bar
      if (_inputBarWrapper) {
        _inputBarWrapper.style.bottom = keyboardHeight + 'px';
      }
      if (_mobileTabBar) _mobileTabBar.style.display = 'none';
      // Expand chat bottom padding so content isn't hidden behind input bar
      if (msgs) msgs.style.paddingBottom = (keyboardHeight + 80) + 'px';
      // Scroll chat to bottom after layout reflow
      requestAnimationFrame(function() {
        if (msgs) msgs.scrollTop = msgs.scrollHeight;
      });
    } else {
      // Keyboard closed — restore
      if (_inputBarWrapper) {
        _inputBarWrapper.style.bottom = '';
      }
      if (msgs) msgs.style.paddingBottom = '';
      if (_mobileTabBar && document.body.classList.contains('mobile-mode')) {
        _mobileTabBar.style.display = 'flex';
      }
    }
  });
  window.visualViewport.addEventListener('scroll', function() {
    // Prevent iOS Safari rubber-banding from misplacing the input bar
    if (_inputBarWrapper) {
      _inputBarWrapper.style.transform = 'translateY(' + (-window.visualViewport.offsetTop) + 'px)';
    }
  });
}
</script>
