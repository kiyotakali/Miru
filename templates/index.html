// ─────────────────────────────────────────────────────────────
// Mood River — shared canvas renderer for user/Miru emotion charts.
// Why canvas not SVG: SVG filter:blur for the soft glow chokes on mobile;
// canvas with shadowBlur stays smooth.
// ─────────────────────────────────────────────────────────────

// One global tooltip DOM, lazily created.
let _moodRiverTooltip = null;
function _ensureMoodRiverTooltip() {
  if (_moodRiverTooltip) return _moodRiverTooltip;
  _moodRiverTooltip = document.createElement('div');
  _moodRiverTooltip.style.cssText = (
    'position:fixed;pointer-events:none;z-index:9999;' +
    'background:rgba(20,20,28,0.96);border:1px solid rgba(255,255,255,0.18);' +
    'border-radius:10px;padding:8px 12px;font-size:12px;line-height:1.5;' +
    'color:#ECECF1;max-width:280px;opacity:0;transition:opacity 0.12s ease;' +
    'box-shadow:0 6px 20px rgba(0,0,0,0.4);' +
    'font-family:inherit;backdrop-filter:blur(6px)'
  );
  document.body.appendChild(_moodRiverTooltip);
  return _moodRiverTooltip;
}
function _showMoodTooltip(html, ev) {
  const tip = _ensureMoodRiverTooltip();
  tip.innerHTML = html;
  // position with viewport edge guard
  const tw = 280, th = 80;
  let x = ev.clientX + 14, y = ev.clientY + 14;
  if (x + tw > window.innerWidth - 8) x = ev.clientX - tw - 14;
  if (y + th > window.innerHeight - 8) y = ev.clientY - th - 14;
  tip.style.left = x + 'px';
  tip.style.top = y + 'px';
  tip.style.opacity = '1';
}
function _hideMoodTooltip() {
  if (_moodRiverTooltip) _moodRiverTooltip.style.opacity = '0';
}

// Active river instances — used by ResizeObserver to redraw on layout change.
const _moodRivers = new WeakMap();

/**
 * Render a Mood River into the given canvas.
 *
 * @param {HTMLCanvasElement} canvas
 * @param {Array} points - [{t, v, intensity, color, label, timeStr, desc, source, isLast?}]
 *                        t = x value (minutes since 00:00 or arbitrary)
 *                        v = valence (-1 to 1)
 * @param {Object} options - {
 *   xMin, xMax,         // x-axis bounds; default 0..1440 (full day)
 *   height,             // canvas height in CSS px; default 240
 *   showAxis,           // bottom time labels; default true
 *   xTicks,             // [{x, label}] for axis; auto if omitted
 *   ySign,              // 'two-pole' shows 愉悦/低落; default true
 *   emptyText,          // shown if 0 points; default "暂无数据"
 *   noFill,             // if true, no ribbon fill (rare)
 * }
 */
function drawMoodRiver(canvas, points, options) {
  options = options || {};
  const xMin = options.xMin !== undefined ? options.xMin : 0;
  const xMax = options.xMax !== undefined ? options.xMax : 1440;
  const showAxis = options.showAxis !== false;
  const ySign = options.ySign !== false;
  const emptyText = options.emptyText || '暂无数据';

  const dpr = window.devicePixelRatio || 1;
  const W = Math.max(1, canvas.clientWidth || canvas.offsetWidth || 600);
  const H = options.height || 240;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.height = H + 'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  // Canvas is transparent — the wrapper card around it provides the dark
  // glass look. We just paint the ribbon on top.

  const PAD_L = 36, PAD_R = 16, PAD_T = 14;
  const PAD_B = showAxis ? 22 : 10;
  const plotW = W - PAD_L - PAD_R;
  const plotH = H - PAD_T - PAD_B;
  const cy = PAD_T + plotH / 2;

  // poles
  if (ySign) {
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.font = '10px -apple-system, sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText('愉悦', 4, PAD_T);
    ctx.textBaseline = 'bottom';
    ctx.fillText('低落', 4, H - PAD_B + 2);
  }

  // neutral baseline
  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.setLineDash([3, 6]);
  ctx.beginPath();
  ctx.moveTo(PAD_L, cy);
  ctx.lineTo(W - PAD_R, cy);
  ctx.stroke();
  ctx.setLineDash([]);

  // x-axis ticks
  if (showAxis) {
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.font = '10px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    let ticks = options.xTicks;
    if (!ticks) {
      const span = xMax - xMin;
      const step = span >= 720 ? 360 : span >= 240 ? 120 : 60;
      ticks = [];
      for (let t = Math.ceil(xMin / step) * step; t <= xMax; t += step) {
        const hh = Math.floor(t / 60);
        const mm = Math.round(t % 60);
        ticks.push({ x: t, label: String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0') });
      }
    }
    ticks.forEach(tk => {
      if (tk.x < xMin || tk.x > xMax) return;
      const x = PAD_L + ((tk.x - xMin) / (xMax - xMin)) * plotW;
      ctx.fillText(tk.label, x, H - PAD_B + 4);
    });
  }

  // ─── Empty data ──────────────────────────────────────────────────────
  if (!points || points.length === 0) {
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = '13px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(emptyText, W / 2, cy);
    return;
  }

  // ─── Map points to plot coords ───────────────────────────────────────
  const range = xMax - xMin || 1;
  const pts = points.map(p => {
    const x = PAD_L + ((p.t - xMin) / range) * plotW;
    const v = Math.max(-1, Math.min(1, +p.v || 0));
    const y = cy - v * (plotH / 2 - 6);
    const it = Math.max(0, Math.min(1, +p.intensity || 0.3));
    const ht = 12 + it * 26; // ribbon half-thickness
    return {
      x, y, ht,
      color: p.color || '#B8B8C4',
      raw: p,
    };
  });

  // ─── Single-point: just a glowing dot ────────────────────────────────
  if (pts.length === 1) {
    const p = pts[0];
    const halo = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 32);
    halo.addColorStop(0, p.color + 'BB');
    halo.addColorStop(1, p.color + '00');
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 32, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 16;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    _moodRivers.set(canvas, { pts });
    return;
  }

  // ─── Build closed ribbon path (top fwd → bottom rev) ─────────────────
  function ribbonPath() {
    const path = new Path2D();
    const topYs = pts.map(p => p.y - p.ht);
    path.moveTo(pts[0].x, topYs[0]);
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i - 1] || pts[i];
      const p1 = pts[i];
      const p2 = pts[i + 1];
      const p3 = pts[i + 2] || p2;
      const y0 = topYs[i - 1] !== undefined ? topYs[i - 1] : topYs[i];
      const y1 = topYs[i];
      const y2 = topYs[i + 1];
      const y3 = topYs[i + 2] !== undefined ? topYs[i + 2] : y2;
      const cp1x = p1.x + (p2.x - p0.x) / 5;
      const cp1y = y1 + (y2 - y0) / 5;
      const cp2x = p2.x - (p3.x - p1.x) / 5;
      const cp2y = y2 - (y3 - y1) / 5;
      path.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, p2.x, y2);
    }
    const botYs = pts.map(p => p.y + p.ht);
    path.lineTo(pts[pts.length - 1].x, botYs[pts.length - 1]);
    for (let i = pts.length - 1; i > 0; i--) {
      const p0 = pts[i + 1] || pts[i];
      const p1 = pts[i];
      const p2 = pts[i - 1];
      const p3 = pts[i - 2] || p2;
      const y0 = botYs[i + 1] !== undefined ? botYs[i + 1] : botYs[i];
      const y1 = botYs[i];
      const y2 = botYs[i - 1];
      const y3 = botYs[i - 2] !== undefined ? botYs[i - 2] : y2;
      const cp1x = p1.x - (p0.x - p2.x) / 5;
      const cp1y = y1 - (y0 - y2) / 5;
      const cp2x = p2.x + (p1.x - p3.x) / 5;
      const cp2y = y2 + (y1 - y3) / 5;
      path.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, p2.x, y2);
    }
    path.closePath();
    return path;
  }
  function smoothPath(side) {
    const ys = pts.map(p => side === 'top' ? p.y - p.ht : p.y + p.ht);
    const path = new Path2D();
    path.moveTo(pts[0].x, ys[0]);
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i - 1] || pts[i];
      const p1 = pts[i];
      const p2 = pts[i + 1];
      const p3 = pts[i + 2] || p2;
      const y0 = i - 1 >= 0 ? ys[i - 1] : ys[i];
      const y1 = ys[i];
      const y2 = ys[i + 1];
      const y3 = i + 2 < ys.length ? ys[i + 2] : y2;
      const cp1x = p1.x + (p2.x - p0.x) / 5;
      const cp1y = y1 + (y2 - y0) / 5;
      const cp2x = p2.x - (p3.x - p1.x) / 5;
      const cp2y = y2 - (y3 - y1) / 5;
      path.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, p2.x, y2);
    }
    return path;
  }

  // mood gradient along ribbon
  const moodGrad = ctx.createLinearGradient(PAD_L, 0, W - PAD_R, 0);
  pts.forEach((p, i) => {
    const stop = pts.length === 1 ? 0.5 : i / (pts.length - 1);
    moodGrad.addColorStop(Math.max(0, Math.min(1, stop)), p.color);
  });

  // soft pink glow under ribbon
  ctx.save();
  ctx.shadowColor = '#FFB7C5';
  ctx.shadowBlur = 22;
  ctx.fillStyle = moodGrad;
  ctx.globalAlpha = 0.18;
  ctx.fill(ribbonPath());
  ctx.restore();

  // ribbon body
  ctx.save();
  ctx.fillStyle = moodGrad;
  ctx.globalAlpha = 0.42;
  ctx.fill(ribbonPath());
  ctx.restore();

  // top + bottom glowing edges
  ctx.save();
  ctx.strokeStyle = moodGrad;
  ctx.lineWidth = 2;
  ctx.shadowColor = '#FFB7C5';
  ctx.shadowBlur = 8;
  ctx.stroke(smoothPath('top'));
  ctx.stroke(smoothPath('bottom'));
  ctx.restore();

  // center axis line (true valence)
  const centerPath = new Path2D();
  centerPath.moveTo(pts[0].x, pts[0].y);
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i];
    const p1 = pts[i];
    const p2 = pts[i + 1];
    const p3 = pts[i + 2] || p2;
    const cp1x = p1.x + (p2.x - p0.x) / 5;
    const cp1y = p1.y + (p2.y - p0.y) / 5;
    const cp2x = p2.x - (p3.x - p1.x) / 5;
    const cp2y = p2.y - (p3.y - p1.y) / 5;
    centerPath.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, p2.x, p2.y);
  }
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.55)';
  ctx.lineWidth = 1.3;
  ctx.stroke(centerPath);
  ctx.restore();

  // ─── Dot decimation (hard-capped) ────────────────────────────────
  // Ribbon shape uses ALL points (continuous & smooth). Dots are
  // capped at MAX_DOTS regardless of how many anchors qualify, so a
  // busy day (137 entries) doesn't turn into a swarm of overlapping
  // circles. Hover hit-test still uses the full point set.
  const MAX_DOTS = 18;
  let dotIdx;
  if (pts.length <= MAX_DOTS) {
    dotIdx = pts.map((_, i) => i);
  } else {
    // Score every point; keep top-N globally significant ones.
    // Tier order (high → low):
    //   100  endpoints + breathing-last
    //    50  strong intensity (≥ 0.65)
    //    40  mood transition (only the new-mood side, not both)
    //    30  local valence extremum over window ±2
    //    20  large valence delta from previous (≥ 0.25)
    //     1  baseline (lets us fill remaining slots evenly)
    const scored = pts.map((p, i) => {
      let s = 1;
      const v = p.raw.v;
      const it = +p.raw.intensity || 0;
      if (i === 0 || i === pts.length - 1 || p.raw.isLast) s = Math.max(s, 100);
      if (it >= 0.65) s = Math.max(s, 50);
      if (i > 0 && (pts[i].raw.mood || '') !== (pts[i-1].raw.mood || '')) s = Math.max(s, 40);
      // Window-of-5 extremum (more selective than ±1 — skips small jitter)
      const lo = Math.max(0, i - 2), hi = Math.min(pts.length - 1, i + 2);
      let isMax = true, isMin = true;
      for (let j = lo; j <= hi; j++) {
        if (j === i) continue;
        if (pts[j].raw.v > v) isMax = false;
        if (pts[j].raw.v < v) isMin = false;
      }
      if ((isMax || isMin) && hi > lo) s = Math.max(s, 30);
      if (i > 0 && Math.abs(v - pts[i-1].raw.v) >= 0.25) s = Math.max(s, 20);
      return { i, s };
    });
    // Greedy: take by score desc, but enforce a min spacing so we don't
    // dump 18 dots on one cluster of "frustrated" peaks.
    scored.sort((a, b) => b.s - a.s || a.i - b.i);
    const minSpacing = Math.max(1, Math.floor(pts.length / (MAX_DOTS * 1.5)));
    const picked = [];
    for (const { i } of scored) {
      if (picked.length >= MAX_DOTS) break;
      if (picked.every(j => Math.abs(j - i) >= minSpacing)) picked.push(i);
    }
    dotIdx = picked.sort((a, b) => a - b);
  }

  // bright dots — white core with mood-color glow
  dotIdx.forEach((i) => {
    const p = pts[i];
    const halo = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 16);
    halo.addColorStop(0, p.color + '99');
    halo.addColorStop(1, p.color + '00');
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 16, 0, Math.PI * 2);
    ctx.fill();

    const it = Math.max(0, Math.min(1, +p.raw.intensity || 0.3));
    ctx.beginPath();
    ctx.arc(p.x, p.y, 2.5 + it * 2.5, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 12;
    ctx.fill();
    ctx.shadowBlur = 0;
  });

  // last point breathing ring (today only)
  const last = pts[pts.length - 1];
  if (last && last.raw.isLast) {
    ctx.beginPath();
    ctx.arc(last.x, last.y, 7, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  // store for hover
  _moodRivers.set(canvas, { pts });
}

// Bind hover tooltip to a canvas previously rendered with drawMoodRiver
function attachMoodRiverHover(canvas, formatTooltip) {
  canvas.style.cursor = 'default';
  function onMove(ev) {
    const data = _moodRivers.get(canvas);
    if (!data || !data.pts) { _hideMoodTooltip(); return; }
    const rect = canvas.getBoundingClientRect();
    const mx = ev.clientX - rect.left;
    const my = ev.clientY - rect.top;
    let hit = null, best = 22;
    data.pts.forEach(p => {
      const dx = mx - p.x, dy = my - p.y;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d < best) { best = d; hit = p; }
    });
    if (hit) {
      _showMoodTooltip(formatTooltip(hit.raw), ev);
      canvas.style.cursor = 'pointer';
    } else {
      _hideMoodTooltip();
      canvas.style.cursor = 'default';
    }
  }
  canvas.addEventListener('mousemove', onMove);
  canvas.addEventListener('mouseleave', _hideMoodTooltip);
}

// Auto-redraw when canvas container resizes (panel show/window resize)
function attachMoodRiverResize(canvas, drawFn) {
  if (typeof ResizeObserver === 'undefined') return;
  let rafId = null;
  const ro = new ResizeObserver(() => {
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(() => {
      if (canvas.clientWidth > 0) drawFn();
    });
  });
  ro.observe(canvas);
  // also tag canvas so GC can release if removed
  canvas._riverObserver = ro;
}

// User-side valence ramp: -1 紫蓝 → 0 灰白 → +1 粉色. 3-stop interp.
// Distinct from _miruValenceColor — Miru's ramp is warmer (lavender mid),
// the user's ramp passes through neutral gray to read as "no emotion" rather
// than "calm/lavender". Used to paint the emotion river as a continuous
// gradient instead of mosaic per-mood discrete colors.
function _userValenceColor(v) {
  v = Math.max(-1, Math.min(1, +v || 0));
  const stops = [
    { v: -1.0, c: [110, 123, 196] },  // #6E7BC4
    { v:  0.0, c: [168, 170, 190] },  // #A8AABE
    { v:  1.0, c: [244, 181, 197] },  // #F4B5C5
  ];
  for (let i = 0; i < stops.length - 1; i++) {
    if (v <= stops[i + 1].v) {
      const a = stops[i], b = stops[i + 1];
      const t = (v - a.v) / (b.v - a.v);
      const r = Math.round(a.c[0] + (b.c[0] - a.c[0]) * t);
      const g = Math.round(a.c[1] + (b.c[1] - a.c[1]) * t);
      const bl = Math.round(a.c[2] + (b.c[2] - a.c[2]) * t);
      return '#' + [r, g, bl].map(n => n.toString(16).padStart(2, '0')).join('');
    }
  }
  return '#F4B5C5';
}

// Centered moving-average smoothing for a numeric series. Window auto-scaled
// from series length if not provided. Symmetric (no lag) so the latest value
// is honest. Used to mask LLM valence jitter so the river stops looking like
// a seismograph.
function _smoothSeriesCenter(arr, win) {
  if (!Array.isArray(arr) || arr.length === 0) return [];
  const N = arr.length;
  const w = Math.max(1, Math.min(N, win || (N >= 10 ? 5 : N >= 5 ? 3 : 1)));
  const half = Math.floor(w / 2);
  const out = new Array(N);
  for (let i = 0; i < N; i++) {
    let sum = 0, count = 0;
    for (let j = Math.max(0, i - half); j <= Math.min(N - 1, i + half); j++) {
      sum += +arr[j] || 0;
      count++;
    }
    out[i] = count ? sum / count : 0;
  }
  return out;
}

function _emoTextSimilarity(a, b) {
  const left = String(a || '').replace(/\s+/g, '');
  const right = String(b || '').replace(/\s+/g, '');
  if (!left && !right) return 1;
  if (!left || !right) return 0;
  if (left === right) return 1;
  const grams = (s) => {
    const out = new Map();
    if (s.length <= 2) {
      out.set(s, 1);
      return out;
    }
    for (let i = 0; i < s.length - 1; i++) {
      const g = s.slice(i, i + 2);
      out.set(g, (out.get(g) || 0) + 1);
    }
    return out;
  };
  const ga = grams(left);
  const gb = grams(right);
  let overlap = 0;
  let total = 0;
  const keys = new Set([...ga.keys(), ...gb.keys()]);
  keys.forEach(k => {
    const av = ga.get(k) || 0;
    const bv = gb.get(k) || 0;
    overlap += Math.min(av, bv);
    total += Math.max(av, bv);
  });
  return total ? overlap / total : 0;
}

function _emoEntryMinutes(e) {
  const t = String((e && e.timestamp) || '');
  const parts = t.split(' ')[1] || (t.includes('T') ? t.split('T')[1] : '12:00:00');
  const [h, m] = parts.split(':').map(Number);
  return (h || 0) * 60 + (m || 0);
}

function _emoStableAffectLike(mood, trend) {
  const tr = String(trend || '').toLowerCase();
  const text = String(mood || '');
  if (tr === 'stable' || tr === 'uncertain' || !tr) return true;
  return /平稳|稳定|平静|专注|观察|安心/.test(text);
}

function _isCompactableAttentionEmotion(prev, cur) {
  if (!prev || !cur) return false;
  const prevSrc = prev.source_type || prev.source || '';
  const curSrc = cur.source_type || cur.source || '';
  if (prevSrc !== 'attention' || curSrc !== 'attention') return false;
  const sameMoodTrend = (prev.mood || '') === (cur.mood || '') && (prev.trend || '') === (cur.trend || '');
  const sameStableFamily = _emoStableAffectLike(prev.mood, prev.trend) && _emoStableAffectLike(cur.mood, cur.trend);
  if (!sameMoodTrend && !sameStableFamily) return false;
  if (Math.abs((+prev.valence || 0) - (+cur.valence || 0)) > 0.04) return false;
  if (Math.abs((+prev.intensity || +prev.arousal || 0) - (+cur.intensity || +cur.arousal || 0)) > 0.06) return false;
  if (Math.abs(_emoEntryMinutes(cur) - _emoEntryMinutes(prev)) > 120) return false;
  const trend = cur.trend || prev.trend || '';
  if (trend === 'stable' || trend === 'uncertain' || !trend || sameStableFamily) return true;
  return _emoTextSimilarity(prev.source || prev.trigger, cur.source || cur.trigger) >= 0.65;
}

function _compactEmotionEntries(entries) {
  const raw = Array.isArray(entries) ? entries : [];
  const out = [];
  raw.forEach(e => {
    if (!e || typeof e !== 'object') return;
    const last = out[out.length - 1];
    if (_isCompactableAttentionEmotion(last, e)) {
      last._repeatCount = (last._repeatCount || 1) + 1;
      last.timestamp = e.timestamp || last.timestamp;
      last.valence = e.valence;
      last.intensity = e.intensity;
      last.arousal = e.arousal;
      last.source = e.source || last.source;
      last.trigger = e.trigger || last.trigger;
      last.device_id = e.device_id || last.device_id;
    } else {
      out.push(Object.assign({_repeatCount: 1}, e));
    }
  });
  return out;
}

function _miruHistoryMinutes(e) {
  const t = String((e && e.timestamp) || '');
  const parts = t.includes('T') ? t.split('T')[1] : (t.split(' ')[1] || '12:00:00');
  const [h, m] = parts.split(':').map(Number);
  return (h || 0) * 60 + (m || 0);
}

function _isCompactableMiruEmotion(prev, cur) {
  if (!prev || !cur) return false;
  if ((prev.trigger || '') !== 'attention' || (cur.trigger || '') !== 'attention') return false;
  if ((prev.mood || '') !== (cur.mood || '')) return false;
  if (Math.abs((+prev.valence || 0) - (+cur.valence || 0)) > 0.08) return false;
  if (Math.abs((+prev.arousal || 0) - (+cur.arousal || 0)) > 0.10) return false;
  if (Math.abs(_miruHistoryMinutes(cur) - _miruHistoryMinutes(prev)) > 120) return false;
  return true;
}

function _compactMiruEmotionEntries(history) {
  const raw = Array.isArray(history) ? history : [];
  const out = [];
  raw.forEach(h => {
    if (!h || typeof h !== 'object') return;
    const last = out[out.length - 1];
    if (_isCompactableMiruEmotion(last, h)) {
      last._repeatCount = (last._repeatCount || 1) + 1;
      last.timestamp = h.timestamp || last.timestamp;
      last.valence = h.valence;
      last.arousal = h.arousal;
      last.reason = h.reason || last.reason;
    } else {
      out.push(Object.assign({_repeatCount: 1}, h));
    }
  });
  return out;
}

function buildEmotionCurveHtml(entries, dateStr) {
  const rawEntryCount = Array.isArray(entries) ? entries.length : 0;
  entries = _compactEmotionEntries(entries);
  // ── v2: everything wrapped in one <div class="emo-panel"> ─────────
  // Calendar / day-detail / Miru relationship ALL share .emo-panel CSS class.
  // Inside the panel CSS vars get overridden so child elements pick up the
  // dark theme automatically.
  if (!entries || entries.length === 0) {
    return '<div class="emo-panel">' +
      '<div class="emo-section-h">' +
      '<span class="title">情绪河 · 今日</span>' +
      '<span class="spacer"></span>' +
      '<span class="meta">' + escapeHtml(dateStr) + '</span>' +
      '</div>' +
      '<div style="padding:60px 0;text-align:center;color:rgba(255,255,255,0.5);font-size:14px">今天还没有情绪记录</div>' +
      '</div>';
  }

  let html = '<div class="emo-panel">';

  // ── Mood River header + canvas ────────────────────────────────────
  const todayStr = _miruLocalDateKey();
  const isToday = dateStr === todayStr;
  const times = entries.map(e => {
    const t = e.timestamp || '';
    const parts = t.split(' ')[1] || (t.includes('T') ? t.split('T')[1] : '12:00:00');
    const [h, m] = parts.split(':').map(Number);
    return (h || 0) * 60 + (m || 0);
  });
  const rawMin = Math.min.apply(null, times);
  const rawMax = Math.max.apply(null, times);
  const spanMin = rawMax - rawMin;
  // Zoom when data covers < 70% of day AND doesn't touch midnight.
  const coversFullDay = rawMin <= 60 && rawMax >= 1380;
  const dataSpanRatio = spanMin / 1440;
  const useZoom = !coversFullDay && dataSpanRatio < 0.7 && entries.length >= 2;
  const xMin = useZoom ? Math.max(0, rawMin - 60) : 0;
  const xMax = useZoom ? Math.min(1440, rawMax + 60) : 1440;
  const lastIdx = entries.length - 1;
  // Smooth valence + intensity to mask LLM jitter. The river paints with
  // smoothed values; tooltips still expose the raw labelled values for
  // honesty when hovering an individual entry.
  const rawV = entries.map(e => Math.max(-1, Math.min(1, +e.valence || 0)));
  const rawI = entries.map(e => Math.max(0, Math.min(1, +e.intensity || 0.3)));
  const smoothV = _smoothSeriesCenter(rawV);
  const smoothI = _smoothSeriesCenter(rawI);
  const riverPoints = entries.map((e, i) => ({
    t: times[i],
    v: smoothV[i],
    intensity: smoothI[i],
    color: _userValenceColor(smoothV[i]),
    mood: e.mood,
    rawValence: rawV[i],
    rawIntensity: rawI[i],
    timestamp: e.timestamp,
    source_type: e.source_type || e.source,
    trigger: e.trigger || e.source || '',
    device_id: e.device_id,
    _repeatCount: e._repeatCount || 1,
    isLast: isToday && i === lastIdx,
  }));
  const riverId = 'emoRiver' + Math.floor(Math.random() * 1000000);
  html += '<div class="emo-section-h">' +
          '<span class="title">情绪河 · 今日</span>' +
          '<span class="spacer"></span>' +
          '<span class="meta">' + escapeHtml(dateStr) + '</span>' +
          '</div>';
  html += '<div class="emo-subtitle">每条情绪记录是一片光鳞，按时间从左到右排列。色带厚度 = intensity，颜色由 valence 渐变（紫蓝→灰→粉）。像液态金属一样流动，能看出全天的情绪节奏。鼠标悬停可看到具体心情。</div>';
  html += '<canvas id="' + riverId + '" style="width:100%;display:block"></canvas>';
  // Defer rendering until canvas is in the DOM.
  setTimeout(() => {
    const cv = document.getElementById(riverId);
    if (!cv) return;
    const draw = () => drawMoodRiver(cv, riverPoints, {
      xMin, xMax, height: 240, showAxis: true,
      emptyText: '今天还没有情绪记录',
    });
    draw();
    attachMoodRiverHover(cv, (raw) => {
      const ts = (raw.timestamp || '').split(/[ T]/)[1] || '';
      const sg = _EMO_SOURCE_GLYPHS[raw.source_type] || { icon: '•', label: raw.source_type || '' };
      const dev = raw.device_id ? ' · ' + escapeHtml(raw.device_id.slice(0, 16)) : '';
      const rep = raw._repeatCount > 1 ? ' · 连续' + raw._repeatCount + '次已压缩' : '';
      const trig = raw.trigger ? '<div style="opacity:0.85;margin-top:4px;font-size:11px">' + escapeHtml(String(raw.trigger).slice(0, 140)) + '</div>' : '';
      const moodColor = (MOOD_COLORS && raw.mood && MOOD_COLORS[raw.mood]) || raw.color || '#fff';
      const dispV = (raw.rawValence !== undefined ? raw.rawValence : raw.v) || 0;
      const dispI = (raw.rawIntensity !== undefined ? raw.rawIntensity : raw.intensity) || 0;
      return (
        '<b style="color:' + moodColor + '">' + escapeHtml(raw.mood || '') + '</b>' +
        ' · <span style="font-variant-numeric:tabular-nums">' + escapeHtml(ts) + '</span>' +
        '<div style="opacity:0.7;font-size:11px;margin-top:2px">valence ' +
        (dispV >= 0 ? '+' : '') + dispV.toFixed(2) +
        ' · int ' + dispI.toFixed(2) +
        ' · ' + sg.icon + ' ' + sg.label + dev + rep + '</div>' +
        trig
      );
    });
    attachMoodRiverResize(cv, draw);
  }, 0);

  // --- Summary stats ---
  const total = entries.length;
  const valences = entries.map(e => +(e.valence || 0));
  const intensities = entries.map(e => +(e.intensity || 0));
  const avgV = valences.reduce((a, b) => a + b, 0) / total;
  const avgA = intensities.reduce((a, b) => a + b, 0) / total;
  const peakV = Math.max.apply(null, valences);
  const troughV = Math.min.apply(null, valences);

  html += '<div class="emo-stat-pills">';
  const pill = (label, value, color) =>
    '<div class="emo-stat-pill" style="border-color:' + color + '38">' +
    '<div class="label">' + label + '</div>' +
    '<div class="value" style="color:' + color + '">' + value + '</div>' +
    '</div>';
  html += pill('平均愉悦', (avgV >= 0 ? '+' : '') + avgV.toFixed(2), '#FFB7C5');
  html += pill('平均唤起', avgA.toFixed(2), '#6C9BD2');
  html += pill('峰值', (peakV >= 0 ? '+' : '') + peakV.toFixed(2), '#FFD700');
  html += pill('谷底', (troughV >= 0 ? '+' : '') + troughV.toFixed(2), '#7B9BA6');
  html += pill('记录', rawEntryCount === total ? total + ' 条' : total + '/' + rawEntryCount + ' 条', '#DDA0DD');
  html += '</div>';

  // --- Mood distribution ---
  const moodCounts = {};
  entries.forEach(e => {
    const m = e.mood || 'unknown';
    moodCounts[m] = (moodCounts[m] || 0) + 1;
  });
  const sortedMoods = Object.entries(moodCounts).sort((a, b) => b[1] - a[1]);
  html += '<div class="emo-chips" style="padding-bottom:4px">';
  sortedMoods.forEach(([mood, count]) => {
    const color = MOOD_COLORS[mood] || '#AAA';
    const pct = Math.round(count / total * 100);
    html += '<span class="emo-chip"><i style="background:' + color + '"></i>' +
            escapeHtml(mood) + ' <span class="pct">' + pct + '%</span></span>';
  });
  html += '</div>';

  // --- Source / device breakdown ---
  const sourceCounts = {};
  const deviceCounts = {};
  entries.forEach(e => {
    const s = e.source_type || e.source || 'unknown';
    sourceCounts[s] = (sourceCounts[s] || 0) + 1;
    const d = e.device_id || '';
    if (d) deviceCounts[d] = (deviceCounts[d] || 0) + 1;
  });
  const deviceKeys = Object.keys(deviceCounts).sort((a, b) => deviceCounts[b] - deviceCounts[a]);
  if (Object.keys(sourceCounts).length + deviceKeys.length > 0) {
    html += '<div class="emo-section-divider"></div>';
    html += '<div class="emo-section-h"><span class="title">输入来源</span></div>';
    html += '<div class="emo-chips" style="margin-top:10px">';
    Object.entries(sourceCounts).forEach(([s, c]) => {
      const g = _EMO_SOURCE_GLYPHS[s] || { icon: '•', label: s };
      html += '<span class="emo-chip source"><span style="font-size:13px">' + g.icon + '</span>' +
              escapeHtml(g.label) + ' ×' + c + '</span>';
    });
    deviceKeys.forEach(dev => {
      const short = dev.length > 14 ? dev.slice(0, 12) + '…' : dev;
      html += '<span class="emo-chip device" title="' + escapeHtml(dev) +
              '" style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' +
              '<i style="background:#DDA0DD"></i>' + escapeHtml(short) + ' ×' + deviceCounts[dev] + '</span>';
    });
    html += '</div>';
  }

  // --- Timeline list ---
  html += '<div class="emo-section-divider"></div>';
  html += '<div class="emo-section-h"><span class="title">情绪记录</span>' +
          '<span class="spacer"></span><span class="meta">' +
          (rawEntryCount === entries.length ? entries.length + ' 条' : entries.length + ' 条 · 已压缩 ' + rawEntryCount + ' 条原始记录') +
          '</span></div>';
  html += '<div class="emo-timeline" style="margin-top:6px">';
  entries.slice().reverse().forEach(e => {
    const color = MOOD_COLORS[e.mood] || '#AAA';
    const timeStr = (e.timestamp || '').split(/[ T]/)[1] || '';
    const valSign = (e.valence || 0) >= 0 ? '+' : '';
    const srcKey = e.source_type || e.source || '';
    const srcGlyph = _EMO_SOURCE_GLYPHS[srcKey] || { icon: '•', label: srcKey };
    const devTxt = e.device_id ? '<span class="dev">· ' +
                   escapeHtml(e.device_id.length > 14 ? e.device_id.slice(0, 12) + '…' : e.device_id) + '</span>' : '';
    const repeatTxt = e._repeatCount > 1 ? '<span class="dev">· 连续' + e._repeatCount + '次</span>' : '';
    html += '<div class="emo-timeline-row">' +
            '<span class="dot" style="background:' + color + ';box-shadow:0 0 6px ' + color + '80"></span>' +
            '<span class="time">' + escapeHtml(timeStr) + '</span>' +
            '<span class="mood-label" style="color:' + color + '">' + escapeHtml(e.mood || '') + '</span>' +
            '<span class="val">' + valSign + (e.valence || 0).toFixed(2) + '</span>' +
            '<span class="glyph" title="' + escapeHtml(srcGlyph.label) + '">' + srcGlyph.icon + '</span>' +
            '<span class="reason">' + escapeHtml(e.source || '') + devTxt + repeatTxt + '</span>' +
            '</div>';
  });
  html += '</div>';

  html += '</div>'; // /.emo-panel
  return html;
}

// ===== Miru Emotion Visualization =====

async function navMiruEmotion() {
  setSidebarActive('navMiruEmotion');
  _nextNavGen();
  showDetailView('<div class="loading"><div class="spinner"></div><span>加载我的心情...</span></div>', 'chat');
  // Load both caches in parallel
  var curDone = false, histDone = false;
  var curData = null, histData = null;
  function tryRender() {
    if (!curDone || !histDone) return;
    if ((curData && curData._error) || (histData && histData._error)) {
      detailContent.innerHTML = '<div class="no-data-hint">加载失败</div>';
      return;
    }
    detailContent.innerHTML = buildMiruEmotionHtml(curData, histData);
  }
  cachedFetch('/api/miru-emotion/current', 'miru_emotion_current', function(d) {
    curData = d; curDone = true; tryRender();
  });
  cachedFetch('/api/miru-emotion/history?limit=50', 'miru_emotion_history', function(d) {
    histData = d; histDone = true; tryRender();
  });
}

function buildMiruEmotionHtml(curData, history) {
  const rawHistoryCount = Array.isArray(history) ? history.length : 0;
  history = _compactMiruEmotionEntries(history);
  const current = curData.current || {};
  const firstMeet = curData.first_meet_date || '';
  const rawDays = curData.days_together || 0;
  // 1-based: 首次相遇当天 = 第 1 天 (与 header "THE 1 DAY" / _applyRelationshipData 一致).
  // 三处显示走同一个变量, 避免再分裂.
  const displayDays = rawDays + 1;
  // ── v2: whole view inside one .emo-panel (dark glass) ────────────
  let html = '<div class="emo-panel">';

  html += '<div class="emo-section-h">' +
          '<span class="title">心情仪表盘</span>' +
          '<span class="spacer"></span>' +
          '<span class="meta">第 ' + displayDays + ' 天</span>' +
          '</div>';
  html += '<div class="emo-subtitle">我现在的心情，以及最近 50 段心情变化的轨迹。</div>';

  // --- Hero card (pink glass on dark — looks like a glass card) ---
  html += '<div class="emo-rel-hero">';
  html += '<div class="row">';
  html += '<span class="label">我们在一起</span>';
  html += '<span class="days">' + displayDays + '</span>';
  html += '<span class="day-label">天</span>';
  html += '</div>';
  if (firstMeet) {
    html += '<div class="first-meet">\u{1F5D3}\u{FE0F}  首次相遇 ' + escapeHtml(firstMeet) + '</div>';
  }
  html += '</div>';

  // --- Current mood: orb + name + reason ---
  const moodDisplay = current.mood || '平静';
  const valence = (current.valence || 0);
  const arousal = (current.arousal || 0.2);
  const reason = current.reason || '';

  html += '<div class="emo-miru-current">';
  html += '<div class="emo-miru-orb"></div>';
  html += '<div class="info">';
  html += '<div class="name">' + escapeHtml(moodDisplay) + '</div>';
  if (reason) {
    html += '<div class="reason">' + escapeHtml(reason) + '</div>';
  }
  html += '<div class="stats">valence ' + (valence >= 0 ? '+' : '') + valence.toFixed(2) +
          '  ·  arousal ' + arousal.toFixed(2) + '</div>';
  html += '</div></div>';

  // --- Mood River curve ---
  if (history && history.length > 1) {
    html += '<div class="emo-section-divider"></div>';
    html += '<div class="emo-section-h">' +
            '<span class="title">心情长河</span>' +
            '<span class="spacer"></span>' +
            '<span class="meta">最近 ' + history.length + (rawHistoryCount === history.length ? ' 段' : '/' + rawHistoryCount + ' 段') + '</span>' +
            '</div>';
    html += '<div class="emo-subtitle" style="margin-bottom:10px">' +
            'valence 越高色带越粉，越低越紫蓝。我每次心情真正变化，都会留一道光。</div>';
    html += buildMiruEmotionRiver(history);
  }

  // --- History timeline ---
  if (history && history.length > 0) {
    html += '<div class="emo-section-divider"></div>';
    html += '<div class="emo-section-h"><span class="title">心情记录</span>' +
            '<span class="spacer"></span><span class="meta">' +
            (rawHistoryCount === history.length ? history.length + ' 段' : history.length + ' 段 · 已压缩 ' + rawHistoryCount + ' 条原始记录') +
            '</span></div>';
    html += '<div class="emo-timeline" style="margin-top:6px">';
    history.slice().reverse().forEach(function(h) {
      const v = +h.valence || 0;
      const color = _miruValenceColor(v);
      const ts = (h.timestamp || '').slice(11, 16);
      const valSign = v >= 0 ? '+' : '';
      const repeatTxt = h._repeatCount > 1 ? '<span class="dev">· 连续' + h._repeatCount + '次</span>' : '';
      html += '<div class="emo-timeline-row">' +
              '<span class="dot" style="background:' + color + ';box-shadow:0 0 6px ' + color + '80"></span>' +
              '<span class="time">' + escapeHtml(ts) + '</span>' +
              '<span class="mood-label" style="color:' + color + '">' + escapeHtml(h.mood || '') + '</span>' +
              '<span class="val">' + valSign + v.toFixed(2) + '</span>' +
              '<span class="reason">' + escapeHtml(h.reason || '') + repeatTxt + '</span>' +
              '</div>';
    });
    html += '</div>';
  } else {
    html += '<div style="padding:40px 0;text-align:center;color:rgba(255,255,255,0.5)">还没有心情记录</div>';
  }

  html += '</div>'; // /.emo-panel
  return html;
}

// Map a Miru valence in [-1, 1] to a color along a pink↔purple↔blue ramp.
// Miru's mood field is free-form text ("温柔挂念"), so we colour by valence
// alone instead of mapping to MOOD_COLORS like the user-side does.
function _miruValenceColor(v) {
  v = Math.max(-1, Math.min(1, +v || 0));
  // -1 (deep blue) → 0 (lavender) → +1 (warm pink)
  // Three-stop linear interp.
  const stops = [
    { v: -1.0, c: [108, 155, 210] },   // #6C9BD2
    { v: -0.3, c: [159, 123, 184] },   // #9F7BB8
    { v:  0.3, c: [201, 160, 220] },   // #C9A0DC
    { v:  1.0, c: [255, 183, 197] },   // #FFB7C5
  ];
  for (let i = 0; i < stops.length - 1; i++) {
    if (v <= stops[i + 1].v) {
      const a = stops[i], b = stops[i + 1];
      const t = (v - a.v) / (b.v - a.v);
      const r = Math.round(a.c[0] + (b.c[0] - a.c[0]) * t);
      const g = Math.round(a.c[1] + (b.c[1] - a.c[1]) * t);
      const bl = Math.round(a.c[2] + (b.c[2] - a.c[2]) * t);
      return '#' + [r, g, bl].map(n => n.toString(16).padStart(2, '0')).join('');
    }
  }
  return '#FFB7C5';
}

function buildMiruEmotionRiver(entries) {
  // Miru entries are uniformly spaced in time order; we treat the array
  // index as the x coordinate so the ribbon shows the *trajectory* not
  // calendar position. Most Miru records cluster around the same minute
  // anyway because they're event-driven.
  const N = entries.length;
  const points = entries.map((e, i) => {
    const v = +e.valence || 0;
    return {
      t: i,
      v,
      intensity: Math.max(0.25, Math.min(0.85, +e.arousal || 0.4)),
      color: _miruValenceColor(v),
      mood: e.mood,
      reason: e.reason,
      arousal: +e.arousal || 0.2,
      timestamp: e.timestamp,
      _repeatCount: e._repeatCount || 1,
      isLast: i === N - 1,
    };
  });

  const id = 'miruRiver' + Math.floor(Math.random() * 1000000);
  // No inner dark wrapper — caller (buildMiruEmotionHtml) is already inside
  // an .emo-panel, so we just emit the canvas. Heading lives in the caller.
  let html = '<canvas id="' + id + '" style="width:100%;display:block"></canvas>';
  setTimeout(() => {
    const cv = document.getElementById(id);
    if (!cv) return;
    // x ticks: timestamps of first / middle / last entry
    const tickIdx = N >= 5 ? [0, Math.floor(N / 2), N - 1] : [0, N - 1];
    const xTicks = tickIdx.map(i => {
      const ts = (entries[i] && entries[i].timestamp) || '';
      const date = ts.slice(0, 10);
      const time = ts.slice(11, 16);
      return { x: i, label: time || date.slice(5) };
    });
    const draw = () => drawMoodRiver(cv, points, {
      xMin: 0, xMax: Math.max(1, N - 1),
      height: 200, showAxis: true,
      xTicks,
      emptyText: '还没有心情记录',
    });
    draw();
    attachMoodRiverHover(cv, (raw) => {
      const ts = (raw.timestamp || '').slice(0, 16).replace('T', ' ');
      const reason = raw.reason ? '<div style="opacity:0.85;margin-top:4px;font-size:11px">' + escapeHtml(String(raw.reason).slice(0, 140)) + '</div>' : '';
      const rep = raw._repeatCount > 1 ? ' · 连续' + raw._repeatCount + '次已压缩' : '';
      return (
        '<b style="color:' + (raw.color || '#fff') + '">' + escapeHtml(raw.mood || '心情') + '</b>' +
        ' · <span style="font-variant-numeric:tabular-nums">' + escapeHtml(ts) + '</span>' +
        '<div style="opacity:0.7;font-size:11px;margin-top:2px">valence ' +
        (raw.v >= 0 ? '+' : '') + raw.v.toFixed(2) +
        ' · arousal ' + (raw.arousal || 0).toFixed(2) + rep + '</div>' +
        reason
      );
    });
    attachMoodRiverResize(cv, draw);
  }, 0);
  return html;
}

// ===== DDL Tracker =====

var _ddlViewMode = 'list'; // 'list' or 'calendar'
var _ddlCalendarMonth = null; // Date object for displayed month
var _cachedCommitments = null; // SSE-pushed commitment cache

async function navDDLTracker(backTarget) {
  // Sidebar's "DDL" button was removed; DDL now enters from the memory hub.
  setSidebarActive('navMemoryBrowser');
  _nextNavGen();
  showDetailView('<div class="loading"><div class="spinner"></div><span>加载承诺...</span></div>',
                 backTarget || 'chat');
  currentView = 'ddl';
  await _loadDDLView();
}

async function _loadDDLView() {
  // Use SSE-pushed cache if available
  if (_cachedCommitments) {
    detailContent.innerHTML = _buildDDLViewHTML(_cachedCommitments);
    return;
  }
  cachedFetch('/api/commitments?include_done=true', 'commitments', function(data) {
    if (data._error) {
      detailContent.innerHTML = '<div style="padding:20px;color:var(--text-muted)">加载失败</div>';
      return;
    }
    var items = data.items || [];
    _cachedCommitments = items;
    detailContent.innerHTML = _buildDDLViewHTML(items);
  });
}

function _buildDDLViewHTML(items) {
  var statsRes = '';
  var active = items.filter(function(i){ return i.status !== 'completed'; });
  var completed = items.filter(function(i){ return i.status === 'completed'; });
  var overdue = active.filter(function(i){ return i.urgency === 'overdue'; });

  // id="ddl-view-container" lets the SSE commitment_sync handler know the DDL
  // view is visible so it can push fresh data into the DOM without a manual
  // refresh. Without this id, the handler silently updated _cachedCommitments
  // but never re-rendered, so the UI could fall out of sync with the server.
  var h = '<div id="ddl-view-container" style="padding:16px">';
  // Header
  h += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">';
  h += '<h3 style="margin:0;color:var(--text-primary);font-size:18px">DDL 追踪</h3>';
  h += '<div style="display:flex;gap:8px">';
  h += '<button onclick="_ddlSwitchView(\'list\')" style="padding:4px 12px;border-radius:8px;border:1px solid var(--border);background:' + (_ddlViewMode==='list'?'var(--airi-pink-mid)':'transparent') + ';color:' + (_ddlViewMode==='list'?'var(--airi-pink)':'var(--text-secondary)') + ';font-size:12px;cursor:pointer">列表</button>';
  h += '<button onclick="_ddlSwitchView(\'calendar\')" style="padding:4px 12px;border-radius:8px;border:1px solid var(--border);background:' + (_ddlViewMode==='calendar'?'var(--airi-pink-mid)':'transparent') + ';color:' + (_ddlViewMode==='calendar'?'var(--airi-pink)':'var(--text-secondary)') + ';font-size:12px;cursor:pointer">月历</button>';
  h += '<button onclick="_ddlShowAddForm()" style="padding:4px 12px;border-radius:8px;border:none;background:var(--airi-pink);color:#fff;font-size:12px;cursor:pointer">+ 新建</button>';
  h += '</div></div>';

  // Stats bar
  h += '<div style="display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap">';
  h += _ddlStatBadge(active.length, '进行中', 'var(--airi-pink)');
  if (overdue.length > 0) h += _ddlStatBadge(overdue.length, '逾期', '#e74c3c');
  h += _ddlStatBadge(completed.length, '已完成', '#27ae60');
  h += '</div>';

  // Add form (hidden by default)
  h += '<div id="ddlAddForm" style="display:none;background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px">';
  h += '<input id="ddlAddTitle" type="text" placeholder="承诺标题" style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg-secondary);color:var(--text-primary);font-size:14px;box-sizing:border-box;margin-bottom:8px">';
  h += '<div style="display:flex;gap:8px;align-items:center">';
  h += '<input id="ddlAddDeadline" type="date" style="flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg-secondary);color:var(--text-primary);font-size:14px">';
  h += '<button onclick="_ddlSubmitAdd()" style="padding:8px 16px;border-radius:8px;border:none;background:var(--airi-pink);color:#fff;font-size:13px;cursor:pointer;white-space:nowrap">添加</button>';
  h += '<button onclick="document.getElementById(\'ddlAddForm\').style.display=\'none\'" style="padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text-secondary);font-size:13px;cursor:pointer">取消</button>';
  h += '</div></div>';

  if (_ddlViewMode === 'list') {
    h += _buildDDLListView(active, completed);
  } else {
    h += _buildDDLCalendarView(items);
  }

  h += '</div>';
  return h;
}

function _ddlStatBadge(count, label, color) {
  return '<div style="display:flex;align-items:center;gap:6px;padding:6px 12px;background:var(--card-bg);border-radius:8px;border:1px solid var(--border)">'
    + '<span style="font-size:18px;font-weight:700;color:' + color + '">' + count + '</span>'
    + '<span style="font-size:12px;color:var(--text-muted)">' + label + '</span></div>';
}

function _buildDDLListView(active, completed) {
  var h = '';
  var urgencyGroups = {overdue: [], today: [], soon: [], normal: [], no_deadline: []};
  active.forEach(function(it) { (urgencyGroups[it.urgency] || urgencyGroups.normal).push(it); });

  var groupLabels = {
    overdue: {label: '逾期', color: '#e74c3c', bg: 'rgba(231,76,60,0.08)'},
    today: {label: '今天截止', color: '#e67e22', bg: 'rgba(230,126,34,0.08)'},
    soon: {label: '3天内', color: '#f1c40f', bg: 'rgba(241,196,15,0.08)'},
    normal: {label: '进行中', color: 'var(--airi-pink)', bg: 'var(--airi-pink-dim)'},
    no_deadline: {label: '无截止日期', color: 'var(--text-muted)', bg: 'var(--bg-secondary)'},
  };

  ['overdue','today','soon','normal','no_deadline'].forEach(function(key) {
    var group = urgencyGroups[key];
    if (group.length === 0) return;
    var meta = groupLabels[key];
    h += '<div style="margin-bottom:16px">';
    h += '<div style="font-size:12px;font-weight:600;color:' + meta.color + ';margin-bottom:8px;padding-left:4px">' + meta.label + ' (' + group.length + ')</div>';
    group.forEach(function(it) {
      h += _ddlItemCard(it, meta);
    });
    h += '</div>';
  });

  // Completed (collapsible)
  if (completed.length > 0) {
    h += '<div style="margin-top:20px">';
    h += '<button onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display===\'none\'?\'block\':\'none\';this.querySelector(\'span\').textContent=this.nextElementSibling.style.display===\'none\'?\'▶\':\'▼\'" style="background:none;border:none;color:var(--text-muted);font-size:12px;cursor:pointer;padding:4px 0"><span>▶</span> 已完成 (' + completed.length + ')</button>';
    h += '<div style="display:none">';
    completed.forEach(function(it) {
      h += '<div style="padding:8px 12px;margin-bottom:4px;background:var(--bg-secondary);border-radius:8px;opacity:0.6">';
      h += '<div style="font-size:13px;color:var(--text-muted);text-decoration:line-through">' + escapeHtml(it.title) + '</div>';
      if (it.completed) h += '<div style="font-size:11px;color:var(--text-faint);margin-top:2px">完成于 ' + it.completed + '</div>';
      h += '</div>';
    });
    h += '</div></div>';
  }

  return h;
}

function _ddlItemCard(it, meta) {
  var h = '<div style="padding:10px 14px;margin-bottom:6px;background:' + meta.bg + ';border-radius:10px;border:1px solid var(--border);display:flex;align-items:center;gap:10px">';
  // Checkbox
  h += '<button onclick="_ddlComplete(\'' + it.id + '\')" style="width:22px;height:22px;border-radius:6px;border:2px solid ' + meta.color + ';background:transparent;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:0" title="标记完成"></button>';
  // Content
  h += '<div style="flex:1;min-width:0">';
  h += '<div style="font-size:14px;color:var(--text-primary);line-height:1.5;word-break:break-word;overflow-wrap:anywhere">' + escapeHtml(it.title) + '</div>';
  var subParts = [];
  if (it.deadline) subParts.push('截止 ' + it.deadline);
  if (it.added) subParts.push('添加 ' + it.added.substring(0,10));
  if (subParts.length) h += '<div style="font-size:11px;color:var(--text-muted);margin-top:2px">' + subParts.join(' · ') + '</div>';
  h += '</div>';
  // Delete button
  h += '<button onclick="_ddlDelete(\'' + it.id + '\')" style="background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:16px;padding:4px" title="删除">×</button>';
  h += '</div>';
  return h;
}

function _buildDDLCalendarView(items) {
  var now = new Date();
  if (!_ddlCalendarMonth) _ddlCalendarMonth = new Date(now.getFullYear(), now.getMonth(), 1);
  var year = _ddlCalendarMonth.getFullYear();
  var month = _ddlCalendarMonth.getMonth();
  var monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

  var h = '<div style="margin-bottom:16px">';
  // Month nav
  h += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">';
  h += '<button onclick="_ddlCalendarNav(-1)" style="background:none;border:none;color:var(--text-secondary);font-size:18px;cursor:pointer;padding:4px 8px">‹</button>';
  h += '<span style="font-size:15px;font-weight:600;color:var(--text-primary)">' + year + '年 ' + monthNames[month] + '</span>';
  h += '<button onclick="_ddlCalendarNav(1)" style="background:none;border:none;color:var(--text-secondary);font-size:18px;cursor:pointer;padding:4px 8px">›</button>';
  h += '</div>';

  // Weekday headers
  var weekdays = ['一','二','三','四','五','六','日'];
  h += '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;margin-bottom:4px">';
  weekdays.forEach(function(d) {
    h += '<div style="font-size:11px;color:var(--text-muted);padding:4px 0">' + d + '</div>';
  });
  h += '</div>';

  // Build deadline map: date_str → [items]
  var dlMap = {};
  items.forEach(function(it) {
    if (it.deadline) {
      if (!dlMap[it.deadline]) dlMap[it.deadline] = [];
      dlMap[it.deadline].push(it);
    }
  });

  // Calendar grid
  var firstDay = new Date(year, month, 1);
  var startDay = (firstDay.getDay() + 6) % 7; // Monday = 0
  var daysInMonth = new Date(year, month + 1, 0).getDate();
  var todayStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');

  h += '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px">';
  for (var i = 0; i < startDay; i++) {
    h += '<div style="aspect-ratio:1;padding:2px"></div>';
  }
  for (var d = 1; d <= daysInMonth; d++) {
    var dateStr = year + '-' + String(month+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
    var isToday = dateStr === todayStr;
    var cellItems = dlMap[dateStr] || [];
    var bg = isToday ? 'var(--airi-pink-mid)' : 'var(--card-bg)';
    var border = isToday ? '2px solid var(--airi-pink)' : '1px solid var(--border)';

    h += '<div style="aspect-ratio:1;padding:4px;background:' + bg + ';border:' + border + ';border-radius:8px;display:flex;flex-direction:column;align-items:center;cursor:' + (cellItems.length ? 'pointer' : 'default') + '"';
    if (cellItems.length) h += ' onclick="_ddlShowDayDetail(\'' + dateStr + '\')"';
    h += '>';
    h += '<div style="font-size:12px;color:' + (isToday ? 'var(--airi-pink)' : 'var(--text-primary)') + ';font-weight:' + (isToday ? '700' : '400') + '">' + d + '</div>';
    // Dots for items
    if (cellItems.length) {
      h += '<div style="display:flex;gap:2px;margin-top:2px;flex-wrap:wrap;justify-content:center">';
      cellItems.slice(0,3).forEach(function(ci) {
        var dotColor = ci.status === 'completed' ? '#27ae60' : (ci.urgency === 'overdue' ? '#e74c3c' : ci.urgency === 'today' ? '#e67e22' : ci.urgency === 'soon' ? '#f1c40f' : 'var(--airi-pink)');
        h += '<div style="width:5px;height:5px;border-radius:50%;background:' + dotColor + '"></div>';
      });
      if (cellItems.length > 3) h += '<div style="font-size:8px;color:var(--text-muted)">+' + (cellItems.length-3) + '</div>';
      h += '</div>';
    }
    h += '</div>';
  }
  h += '</div></div>';

  return h;
}

async function _ddlSubmitAdd() {
  var title = document.getElementById('ddlAddTitle').value.trim();
  if (!title) return;
  var deadline = document.getElementById('ddlAddDeadline').value || '';
  // Optimistic: add to cache and re-render immediately
  if (_cachedCommitments) {
    var now = new Date();
    var added = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    _cachedCommitments.push({id:'tmp-'+Date.now(), title:title, deadline:deadline||null, detail:'', status:'active', urgency:deadline?'normal':'no_deadline', added:added, completed_at:null});
    _loadDDLView();
  }
  try {
    var res = await fetch('/api/commitments', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({title: title, deadline: deadline})
    });
    if (!res.ok) { _cachedCommitments = null; await _loadDDLView(); }
  } catch(e) { _cachedCommitments = null; await _loadDDLView(); }
}

// Tracks in-flight complete/delete requests by cid. Needed because a fast
// tap + the WebView's queued click event can fire the handler twice; without
// a guard the 2nd PUT hits the server AFTER the item is already done, gets a
// 404, and the error path (`_cachedCommitments = null; _loadDDLView()`) then
// triggers a full refetch + re-render — visible as the stutter / "闪退感".
var _ddlInFlight = new Set();

async function _ddlComplete(cid) {
  if (_ddlInFlight.has(cid)) return;           // dedupe duplicate taps
  // Also skip if the item is already marked completed in the local cache —
  // the 2nd click in a fast double-tap would otherwise retry the PUT.
  if (_cachedCommitments) {
    var existing = _cachedCommitments.find(function(it) { return it.id === cid; });
    if (existing && existing.status === 'completed') return;
  }
  _ddlInFlight.add(cid);
  // Optimistic: mark as completed in cache
  if (_cachedCommitments) {
    _cachedCommitments.forEach(function(it) {
      if (it.id === cid) { it.status = 'completed'; it.urgency = 'normal'; }
    });
    _loadDDLView();
  }
  try {
    var res = await fetch('/api/commitments/' + cid, {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({action: 'complete'})
    });
    if (!res.ok) { _cachedCommitments = null; await _loadDDLView(); }
  } catch(e) {
    _cachedCommitments = null; await _loadDDLView();
  } finally {
    _ddlInFlight.delete(cid);
  }
}

async function _ddlDelete(cid) {
  if (_ddlInFlight.has(cid)) return;
  _ddlInFlight.add(cid);
  // Optimistic: remove from cache
  if (_cachedCommitments) {
    _cachedCommitments = _cachedCommitments.filter(function(it) { return it.id !== cid; });
    _loadDDLView();
  }
  try {
    var res = await fetch('/api/commitments/' + cid, { method: 'DELETE' });
    if (!res.ok) { _cachedCommitments = null; await _loadDDLView(); }
  } catch(e) {
    _cachedCommitments = null; await _loadDDLView();
  } finally {
    _ddlInFlight.delete(cid);
  }
}

async function _ddlShowDayDetail(dateStr) {
  try {
    var allItems;
    if (_cachedCommitments) {
      allItems = _cachedCommitments;
    } else {
      var res = await fetch('/api/commitments?include_done=true', { cache: 'no-store' });
      var data = await res.json();
      allItems = data.items || [];
      _cachedCommitments = allItems;
    }
    var dayItems = allItems.filter(function(i){ return i.deadline === dateStr; });
    if (!dayItems.length) return;
    var h = '<div style="padding:16px"><h3 style="margin:0 0 12px;color:var(--text-primary)">' + dateStr + ' 的承诺</h3>';
    dayItems.forEach(function(it) {
      var color = it.status === 'completed' ? '#27ae60' : (it.urgency === 'overdue' ? '#e74c3c' : 'var(--airi-pink)');
      h += '<div style="padding:10px 14px;margin-bottom:6px;background:var(--card-bg);border-radius:10px;border-left:3px solid ' + color + '">';
      h += '<div style="font-size:14px;color:var(--text-primary);' + (it.status==='completed'?'text-decoration:line-through;opacity:0.6':'') + '">' + escapeHtml(it.title) + '</div>';
      if (it.detail) h += '<div style="font-size:12px;color:var(--text-muted);margin-top:4px">' + escapeHtml(it.detail) + '</div>';
      h += '</div>';
    });
    h += '<button onclick="_loadDDLView()" style="margin-top:12px;padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text-secondary);font-size:13px;cursor:pointer">← 返回月历</button>';
    h += '</div>';
    detailContent.innerHTML = h;
  } catch(e) {}
}

// === Custom modal dialogs (2026-05-17) ============================
// 原生 confirm/alert/prompt 在 macOS DMG 的 WKWebView 里默认失效
// (host 未注册 WKUIDelegate → completionHandler 默认 NO).
// 自定义 modal 替换, DMG/APK/浏览器三端一致行为. 返回 Promise.
//
// 用法:
//   await _confirm('确认删除？')          → 返回 true/false
//   await _confirm('删账号？', {danger:true, confirmText:'删除'})
//   await _alert('保存失败 (500)')        → 返回 void
//   await _prompt('输入 DELETE 确认:')   → 返回 string 或 null
function _miruModalBuild(opts) {
  var ov = document.createElement('div');
  ov.className = 'miru-modal-overlay';
  var box = document.createElement('div');
  box.className = 'miru-modal-box';
  var msg = document.createElement('div');
  msg.className = 'miru-modal-msg';
  msg.textContent = opts.message || '';
  box.appendChild(msg);

  var inputEl = null;
  if (opts.kind === 'prompt') {
    inputEl = document.createElement('input');
    inputEl.type = 'text';
    inputEl.className = 'miru-modal-input';
    inputEl.value = opts.defaultValue || '';
    box.appendChild(inputEl);
  }

  var actions = document.createElement('div');
  actions.className = 'miru-modal-actions';

  if (opts.kind !== 'alert') {
    var cancel = document.createElement('button');
    cancel.type = 'button';
    cancel.className = 'miru-modal-btn-cancel';
    cancel.textContent = opts.cancelText || '取消';
    cancel.dataset.role = 'cancel';
    actions.appendChild(cancel);
  }

  var confirmBtn = document.createElement('button');
  confirmBtn.type = 'button';
  confirmBtn.className = 'miru-modal-btn-confirm' + (opts.danger ? ' danger' : '');
  confirmBtn.textContent = opts.confirmText || '确定';
  confirmBtn.dataset.role = 'confirm';
  actions.appendChild(confirmBtn);

  box.appendChild(actions);
  ov.appendChild(box);
  return { ov: ov, inputEl: inputEl, confirmBtn: confirmBtn };
}

function _confirm(message, opts) {
  opts = Object.assign({ kind: 'confirm', message: message }, opts || {});
  return new Promise(function(resolve) {
    var built = _miruModalBuild(opts);
    function close(result) {
      try { built.ov.parentNode && built.ov.parentNode.removeChild(built.ov); } catch(e) {}
      document.removeEventListener('keydown', onKey, true);
      resolve(result);
    }
    function onKey(e) {
      if (e.key === 'Escape') { e.preventDefault(); close(false); }
      else if (e.key === 'Enter') { e.preventDefault(); close(true); }
    }
    built.ov.addEventListener('click', function(e) {
      var role = e.target && e.target.dataset && e.target.dataset.role;
      if (role === 'cancel') close(false);
      else if (role === 'confirm') close(true);
    });
    document.body.appendChild(built.ov);
    document.addEventListener('keydown', onKey, true);
    setTimeout(function() { built.confirmBtn.focus(); }, 50);
  });
}

function _alert(message) {
  return new Promise(function(resolve) {
    var built = _miruModalBuild({ kind: 'alert', message: message, confirmText: '确定' });
    function close() {
      try { built.ov.parentNode && built.ov.parentNode.removeChild(built.ov); } catch(e) {}
      document.removeEventListener('keydown', onKey, true);
      resolve();
    }
    function onKey(e) {
      if (e.key === 'Escape' || e.key === 'Enter') { e.preventDefault(); close(); }
    }
    built.ov.addEventListener('click', function(e) {
      if (e.target && e.target.dataset && e.target.dataset.role === 'confirm') close();
    });
    document.body.appendChild(built.ov);
    document.addEventListener('keydown', onKey, true);
    setTimeout(function() { built.confirmBtn.focus(); }, 50);
  });
}

function _prompt(message, defaultValue) {
  return new Promise(function(resolve) {
    var built = _miruModalBuild({
      kind: 'prompt', message: message, defaultValue: defaultValue || ''
    });
    function close(result) {
      try { built.ov.parentNode && built.ov.parentNode.removeChild(built.ov); } catch(e) {}
      document.removeEventListener('keydown', onKey, true);
      resolve(result);
    }
    function onKey(e) {
      if (e.key === 'Escape') { e.preventDefault(); close(null); }
      else if (e.key === 'Enter') { e.preventDefault(); close(built.inputEl.value || ''); }
    }
    built.ov.addEventListener('click', function(e) {
      var role = e.target && e.target.dataset && e.target.dataset.role;
      if (role === 'cancel') close(null);
      else if (role === 'confirm') close(built.inputEl.value || '');
    });
    document.body.appendChild(built.ov);
    document.addEventListener('keydown', onKey, true);
    setTimeout(function() { built.inputEl && built.inputEl.focus(); }, 50);
  });
}

  ':camping:':'🏕️',':night:':'🌃',':sunrise:':'🌅',':sunset:':'🌇',
  ':fireworks:':'🎆',':sparkler:':'🎇',':lantern:':'🏮',
};

// ASCII emoticons → emoji (order: longest first to avoid partial matches)
// Note: after escapeHtml, < becomes &lt; and > becomes &gt;
var ASCII_EMOTICONS = [
  ["&gt;:(","😠"],["&gt;:)","😈"],[":'(","😭"],[":'-)","😂"],
  ["&lt;3","❤️"],["&lt;/3","💔"],["XD","🤣"],["xD","🤣"],
  [":D","😄"],[":)","😊"],[":-)","😊"],[":(","😢"],[":-(",  "😢"],
  [";)","😉"],[";-)","😉"],[":P","😛"],[":p","😛"],[":-P","😛"],
  [":O","😮"],[":o","😮"],[":/","😕"],[":-/","😕"],
  [":|","😐"],[":-|","😐"],[":*","😘"],[":-*","😘"],
  ["=)","😊"],["=D","😄"],["B)","😎"],
  ["^^","😊"],["^_^","😊"],["T_T","😭"],["T.T","😭"],
  ["&gt;_&lt;","😣"],["-_-","😑"],["o.O","😳"],["O.o","😳"],
  ["._.","😔"],["QAQ","😭"],["TAT","😭"],["orz","🙇"],["OTZ","🙇"],
];

/**
 * Convert emoji shortcodes (:smile:) and ASCII emoticons (:D) to emoji.
 * Skips content inside HTML tags, <code> and <pre> blocks.
 */
function convertEmojis(html) {
  // Split into segments: HTML tags vs text content
  // Also protect <code>...</code> and <pre>...</pre> blocks
  var inCode = false;
  return html.replace(/(<\/?(?:code|pre)[^>]*>)|(<[^>]+>)|([^<]+)/gi, function(m, codeTag, otherTag, text) {
    if (codeTag) {
      if (/^<\//.test(codeTag)) inCode = false;
      else inCode = true;
      return codeTag;
    }
    if (otherTag) return otherTag;
    if (!text || inCode) return text || '';
    // Replace :shortcodes:
    text = text.replace(/:[\w+_-]+:/g, function(code) {
      return EMOJI_SHORTCODES[code.toLowerCase()] || code;
    });
    // Replace ASCII emoticons (longest first)
    for (var i = 0; i < ASCII_EMOTICONS.length; i++) {
      var pair = ASCII_EMOTICONS[i];
      if (text.indexOf(pair[0]) !== -1) {
        text = text.split(pair[0]).join(pair[1]);
      }
    }
    return text;
  });
}

function renderMarkdown(md) {
  if (!md) return '';
  var html = escapeHtml(md);
  // Code blocks (``` ... ```)
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, function(m, lang, code) {
    return '<pre class="md-code-block"><code>' + code.trim() + '</code></pre>';
  });
  // Inline code
  html = html.replace(/`([^`]+)`/g, '<code class="md-inline-code">$1</code>');
  // Bold + italic
  html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  // Bold
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // Italic
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  // Strikethrough
  html = html.replace(/~~(.+?)~~/g, '<del>$1</del>');
  // Links [text](url)
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
  // Auto-linkify bare URLs (not already inside an <a> tag)
  html = html.replace(/(?<!href="|">)(https?:\/\/[^\s<"')\]]+)/g, '<a href="$1" target="_blank" rel="noreferrer">$1</a>');
  // Headings (### / ## / #)
  html = html.replace(/^### (.+)$/gm, '<strong>$1</strong>');
  html = html.replace(/^## (.+)$/gm, '<strong>$1</strong>');
  html = html.replace(/^# (.+)$/gm, '<strong>$1</strong>');
  // Unordered list items
  html = html.replace(/^[\-\*] (.+)$/gm, '<li>$1</li>');
  // Ordered list items
  html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
  // Wrap consecutive <li> in <ul>
  html = html.replace(/((?:<li>.*<\/li>(?:<br>)?)+)/g, '<ul>$1</ul>');
  // Emoji conversion (after markdown, before line breaks)
  html = convertEmojis(html);
  // Line breaks (double newline = paragraph, single = <br>)
  html = html.replace(/\n\n+/g, '</p><p>');
  html = html.replace(/\n/g, '<br>');
  html = '<p>' + html + '</p>';
  html = html.replace(/<p>\s*<\/p>/g, '');
  return html;
}

// Timeline grouper state (微信式时间锚) — 2026-05-16
// Tracks the last rendered message's date + datetime so that:
//   1. Cross-day → insert a chat-time-separator (日期横条)
//   2. Same day but ≥5min from prev msg → insert a chat-time-anchor (HH:MM)
//   3. Role-agnostic: user / Miru reply / Miru proactive / reminder all share
//      the same timeline.
const _chatTimeline = {
  lastDate: '',
  lastMessageTime: null,    // Date object of the previous rendered msg
};
const _CHAT_TIME_ANCHOR_GAP_MS = 5 * 60 * 1000;

function _resetChatTimeline() {
  _chatTimeline.lastDate = '';
  _chatTimeline.lastMessageTime = null;
}

// Convert various input formats to "YYYY-MM-DD HH:MM:SS" string (server style).
// - undefined / null / '' → use current local time
// - Date instance        → format from it
// - already-string       → return as-is
function _normalizeChatTimeStr(t) {
  if (t && typeof t === 'string') return t;
  const d = (t instanceof Date) ? t : new Date();
  const p = function(n) { return String(n).padStart(2, '0'); };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
         ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}

// The grouper — call this BEFORE appending any bubble. It decides whether
// to insert a date separator and/or a time anchor, then updates state.
// Pass the source message's time string ("2026-05-16 15:30:45") if known,
// otherwise pass null/undefined and the current wall-clock time is used.
function _appendChatTimeMarkers(timeStr) {
  if (!companionChatMessages) return;
  const str = _normalizeChatTimeStr(timeStr);
  const datePart = str.split(' ')[0] || '';
  const timePart = (str.split(' ')[1] || '').substring(0, 5);
  const itemDate = new Date(str.replace(' ', 'T'));
  if (isNaN(itemDate.getTime())) return;  // unparsable → silently skip

  let insertDateSep = false;
  let insertTimeAnchor = false;

  if (datePart && datePart !== _chatTimeline.lastDate) {
    insertDateSep = true;
    insertTimeAnchor = true;            // cross-day forces a new cluster
    _chatTimeline.lastDate = datePart;
  }
  if (!insertTimeAnchor) {
    if (!_chatTimeline.lastMessageTime ||
        (itemDate - _chatTimeline.lastMessageTime) >= _CHAT_TIME_ANCHOR_GAP_MS) {
      insertTimeAnchor = true;
    }
  }
  _chatTimeline.lastMessageTime = itemDate;

  if (insertDateSep) {
    const sep = document.createElement('div');
    sep.className = 'chat-time-separator';
    sep.textContent = datePart;
    companionChatMessages.appendChild(sep);
  }
  if (insertTimeAnchor && timePart) {
    const anchor = document.createElement('div');
    anchor.className = 'chat-time-anchor';
    anchor.textContent = timePart;
    companionChatMessages.appendChild(anchor);
  }
}

function addCompanionUserBubble(text, imageUrl, msgTime) {
  _appendChatTimeMarkers(msgTime);
  const wrapper = document.createElement('div');

function buildToolCallTagsHtml(toolCalls) {
  if (!toolCalls || toolCalls.length === 0) return '';
  let html = '<div class="companion-actions-row">';
  for (const tc of toolCalls) {
    const tool = tc.tool || '';
    const args = tc.args || {};
    const result = tc.result || {};
    const status = result.status || '';

    // Write tools — colored action tags
    if (tool === 'add_commitment') {
      const cls = status === 'ok' ? 'action-add-task' : 'action-error';
      html += '<span class="companion-action-tag ' + cls + '">新增承诺: ' + escapeHtml(args.title || result.title || '') + '</span>';
    } else if (tool === 'complete_commitment') {
      if (status === 'ok') {
        html += '<span class="companion-action-tag action-complete-task">完成承诺: ' + escapeHtml(result.title || args.title || '') + '</span>';
      } else if (status === 'not_found') {
        html += '<span class="companion-action-tag action-error">未找到: ' + escapeHtml(args.title || '') + '</span>';
      } else {
        html += '<span class="companion-action-tag action-error">失败: ' + escapeHtml(args.title || '') + '</span>';
      }
    // Read tools — grey info tags
    } else if (tool.startsWith('query_') || tool.startsWith('search_') || tool.startsWith('read_') || tool.startsWith('write_')) {
      const queryLabels = {
        read_memory: '读取记忆',
        search_memory: '搜索记忆',
      };
      const label = queryLabels[tool] || tool;
      html += '<span class="companion-action-tag action-query">' + label + '</span>';
    }
  }
  html += '</div>';
  return html;
}

function addCompanionReplyBubble(reply, toolCalls, msgTime) {

  wrapper.className = 'chat-bubble-wrapper system';

  contentHtml += buildToolCallTagsHtml(toolCalls);
  wrapper.innerHTML = wrapSystemContent(contentHtml);
  companionChatMessages.appendChild(wrapper);
  emptyCompanionState.style.display = 'none';
  return wrapper;
}

// --- TTS Auto-Playback ---
let _ttsAudio = null;
let TTS_AUTO_PLAY = false; // Voice output is not part of the first public build.

async function autoPlayTTS(text) {
  if (!TTS_AUTO_PLAY || !text) return;
  try {
    const res = await fetch('/api/tts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: text }),
    });
    if (!res.ok) return;
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    if (_ttsAudio) { _ttsAudio.pause(); _ttsAudio = null; }
    _ttsAudio = new Audio(url);
    _ttsAudio.onended = function() {
      URL.revokeObjectURL(url);
      _ttsAudio = null;
    };
    _ttsAudio.play();
  } catch (e) { console.error('Auto TTS error:', e); }
}
