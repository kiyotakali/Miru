function _loadSettingsInvitationCode() {
  var input = document.getElementById('settingsInvitationCode');
  var hint = document.getElementById('settingsInvitationHint');
  var btn = document.getElementById('settingsCopyInvitationBtn');
  if (!input) return;
  input.value = '加载中...';
  if (btn) btn.disabled = true;
  fetch('/api/auth/invitation', { cache: 'no-store' }).then(function(r) {
    return r.json().then(function(data) {
      return { ok: r.ok, data: data };
    });
  }).then(function(result) {
    var data = result.data || {};
    if (result.ok && (data.local_only || data.mode === 'local')) {
      input.value = '';
      input.placeholder = '本地模式不需要邀请码';
      try { localStorage.removeItem('miru_invitation_code'); } catch(e) {}
      if (btn) btn.disabled = true;
      if (hint) {
        hint.textContent = window.MiruAndroid
          ? '当前 Miru 只在这部手机上使用，其他设备不会同步。需要多设备时，请回到首启页选择私有服务器。'
          : window.__MIRU_DESKTOP_PLATFORM__ === 'windows'
            ? '当前 Miru 只在这台 Windows 电脑上使用，手机和其他电脑不会同步。需要多设备时，请回到首启页选择私有服务器。'
            : '当前 Miru 只在这台 Mac 上使用，手机和其他电脑不会同步。需要多设备时，请回到首启页选择私有服务器。';
      }
      return;
    }
    if (!result.ok || !data.ok || !data.invitation_code) {
      input.value = '';
      input.placeholder = '暂时无法读取邀请码';
      if (hint) hint.textContent = data.error || '暂时无法读取邀请码，请稍后再试。';
      return;
    }
    input.value = data.invitation_code;
    try { localStorage.setItem('miru_invitation_code', data.invitation_code); } catch(e) {}
    if (btn) btn.disabled = false;
    if (hint) {
      var server = data.server_url ? ('当前服务器：' + data.server_url + '。') : '';
      hint.textContent = server + '给自己的手机或另一台电脑登录用，请不要发给别人。';
    }
  }).catch(function() {
    input.value = '';
    input.placeholder = '暂时无法读取邀请码';
    if (hint) hint.textContent = '网络不稳定，暂时无法读取邀请码。';
  });
}

function _copySettingsInvitationCode() {
  var input = document.getElementById('settingsInvitationCode');
  var btn = document.getElementById('settingsCopyInvitationBtn');
  var code = input && input.value ? input.value.trim() : '';
  if (!code || code === '加载中...') {
    settingsShowFlash('邀请码还没有加载好', 'error');
    return;
  }
  function copied() {
    settingsShowFlash('邀请码已复制，可以发到你的另一台设备上登录。');
    if (btn) {
      var old = btn.textContent;
      btn.textContent = '已复制';
      setTimeout(function() { btn.textContent = old || '复制邀请码'; }, 1400);
    }
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(code).then(copied).catch(function() {
      try {
        input.focus();
        input.select();
        document.execCommand('copy');
        copied();
      } catch(e) {
        settingsShowFlash('复制失败，可以手动选中邀请码复制', 'error');
      }
    });
    return;
  }
  try {
    input.focus();
    input.select();
    document.execCommand('copy');
    copied();
  } catch(e) {
    settingsShowFlash('复制失败，可以手动选中邀请码复制', 'error');
  }
}

async function settingsSwitchAccount() {
  var isLocal = _clientModeMode === 'local';
  var isWindowsDesktop = window.__MIRU_DESKTOP_PLATFORM__ === 'windows';
  var msg = isLocal
    ? (window.MiruAndroid
      ? '要回到 Miru 初始界面吗？\n\n本地单设备数据会继续留在这部手机上。之后再次选择“只在这部手机使用”，会回到同一个本地 Miru。'
      : isWindowsDesktop
      ? '要回到 Miru 初始界面吗？\n\n本地单设备数据会继续留在这台 Windows 电脑上。之后再次选择“只在这台电脑使用”，会回到同一个本地 Miru。'
      : '要回到 Miru 初始界面吗？\n\n本地单设备数据会继续留在这台 Mac 上。之后再次选择“只在这台 Mac 使用”，会回到同一个本地 Miru。')
    : '要回到 Miru 初始界面吗？\n\n这只会退出这台设备，不会删除服务器上的聊天、记忆或邀请码。';
  if (!await _confirm(msg, { confirmText: '切换账号' })) return;

  try {
    if (typeof window._purgeAllUserScopedState === 'function') {
      window._purgeAllUserScopedState();
    }
  } catch(e) {}
  try {
    localStorage.removeItem('miru_invitation_code');
    localStorage.removeItem('miru_server_url');
    localStorage.removeItem('miru_local_mode');
  } catch(e) {}

  if (window.MiruAndroid && typeof window.MiruAndroid.clearCredentials === 'function') {
    try { window.MiruAndroid.clearCredentials(); } catch(e) {}
    if (typeof window.MiruAndroid.relaunchToEntry === 'function') {
      try { window.MiruAndroid.relaunchToEntry(); return; } catch(e) {}
    }
    try { window.location.href = 'https://localhost'; return; } catch(e) {}
  }

  var localBase = window.__MIRU_LOCAL_BRAND_ASSET_BASE__ || 'http://127.0.0.1:5001';
  if (window.__MIRU_CLIENT_MODE__) {
    var desktopLoginTarget = _desktopClientUrl(localBase + '/login');
    try {
      await fetch(localBase + '/api/auth/logout', { method: 'POST' });
    } catch(e) {
      try { await fetch('/api/auth/logout', { method: 'POST' }); } catch(_e) {}
    }
    // The native Mac/Windows launcher owns the normal logout navigation.
    // Navigating here at the same time can issue two overlapping WebView
    // loads and leave the first-run view invisible until a reload.
    setTimeout(function() {
      if (window.location.pathname !== '/login') {
        window.location.replace(desktopLoginTarget);
      }
    }, 3000);
    return;
  }

  try { await fetch('/api/auth/logout', { method: 'POST' }); } catch(e) {}
  if (typeof _showLoginScreen === 'function') {
    _showLoginScreen();
  } else {
    window.location.href = '/login';
  }
}

function _fmtScreenshotTime(iso) {
  if (!iso) return '';
  var s = String(iso).replace('T', ' ');
  var datePart = s.substring(0, 10);   // YYYY-MM-DD
  var hhmm = s.substring(11, 16);      // HH:MM
  if (!datePart || datePart.length !== 10) return hhmm || s;
  var now = new Date();
  var pad = function(n) { return String(n).padStart(2, '0'); };
  var todayStr = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate());
  if (datePart === todayStr) return '今天 ' + hhmm;
  var yd = new Date(now.getTime() - 86400000);
  var yStr = yd.getFullYear() + '-' + pad(yd.getMonth() + 1) + '-' + pad(yd.getDate());
  if (datePart === yStr) return '昨天 ' + hhmm;
  // Same year → MM-DD HH:MM; otherwise YYYY-MM-DD HH:MM
  if (datePart.substring(0, 4) === String(now.getFullYear())) {
    return datePart.substring(5) + ' ' + hhmm;
  }
  return datePart + ' ' + hhmm;
}

function _loadScreenshotStats() {
  var el = document.getElementById('screenshotStatsContent');
  if (!el) return;
  fetch('/api/screenshot/stats', { cache: 'no-store' }).then(function(r) { return r.json(); }).then(function(body) {
    if (!body.ok || !body.stats) { el.textContent = '暂无数据'; return; }
    var stats = body.stats;
    var keys = Object.keys(stats);
    if (keys.length === 0) { el.textContent = '暂无截图记录'; return; }
    // Sort by total desc
    keys.sort(function(a, b) { return (stats[b].total || 0) - (stats[a].total || 0); });
    var html = '';
    for (var i = 0; i < keys.length; i++) {
      var s = stats[keys[i]];
      var timePart = '';
      if (s.last_time) {
        timePart = ' · 最近 ' + _fmtScreenshotTime(s.last_time);
      }
      html += '<div style="display:flex;align-items:center;gap:8px;padding:4px 0;flex-wrap:wrap;">';
      html += '<span style="color:var(--text-primary);min-width:100px;">' + escapeHtml(s.name || keys[i]) + '</span>';
      html += '<span>' + s.total + ' 张</span>';
      if (s.today > 0) html += '<span style="color:var(--airi-pink);">(今日 ' + s.today + ')</span>';
      if (timePart) html += '<span style="color:var(--text-muted);font-size:12px;">' + timePart + '</span>';
      html += '</div>';
    }
    el.innerHTML = html;
  }).catch(function() {
    el.textContent = '加载失败';
  });
}

function _disconnectMobile() {
  // In Capacitor WebView, navigating back to https://localhost returns to the APK's local page.
  // The APK's local localStorage (different origin) still holds the saved connection.
  // Use the central purge so every per-user key/cache (token, onboarded,
  // sidebarGroups, IndexedDB, sessionStorage) is wiped — not just the token.
  if (typeof window._purgeAllUserScopedState === 'function') {
    window._purgeAllUserScopedState();
  } else {
    // Pre-bootstrap fallback (impl not yet registered)
    try { MiruCache.reset(); } catch(e) {}
    try { localStorage.removeItem('miru_auth_token'); } catch(e) {}
  }
  // APK: also clear native SharedPreferences + restart Activity to reload
  // Capacitor's full-code entry. (Mirrors the auth-lost path.)
  if (window.MiruAndroid && typeof window.MiruAndroid.clearCredentials === 'function') {
    try { window.MiruAndroid.clearCredentials(); } catch(e) {}
    if (typeof window.MiruAndroid.relaunchToEntry === 'function') {
      try { window.MiruAndroid.relaunchToEntry(); return; } catch(e) {}
    }
  }
  if (window.Capacitor || navigator.userAgent.indexOf('Capacitor') >= 0) {
    window.location.href = 'https://localhost';
  } else {
    window.location.href = '/';
  }
}

async function _deleteDevice(btn) {
  var id = btn && btn.dataset ? btn.dataset.deviceId : '';
  var name = btn && btn.dataset ? btn.dataset.deviceName : '';
  if (!id) return;
  // 防误删：让用户确认一下。删除只清理设备记录，不删除账号数据。
  if (!await _confirm('确认删除设备「' + (name || id) + '」？\n\n（本地模式下，当前电脑会自动恢复；其他设备需重新打开 Miru）',
                      { danger: true, confirmText: '删除' })) {
    return;
  }
  // Optimistic: remove the row immediately so click feels snappy
  if (btn.closest) {
    var row = btn.closest('div[style*="border-bottom"]');
    if (row) row.style.opacity = '0.3';
  }
  try {
    var res = await fetch('/api/device/' + encodeURIComponent(id), { method: 'DELETE' });
    if (!res.ok) {
      var err = await res.json().catch(function(){ return {}; });
      await _alert('删除失败: ' + (err.error || res.status));
      // Refresh to undo the optimistic dim
      _loadDevicesList();
      return;

    _loadDevicesList();
  } catch (e) {
    await _alert('删除失败: ' + (e && e.message || e));
    _loadDevicesList();
  }
}

function _formatTimeAgo(isoStr) {
  try {
    var diff = (Date.now() - new Date(isoStr).getTime()) / 1000;
    if (diff < 60) return '刚刚';
    if (diff < 3600) return Math.floor(diff / 60) + '分钟前';
    if (diff < 86400) return Math.floor(diff / 3600) + '小时前';
    return Math.floor(diff / 86400) + '天前';
  } catch(e) { return '未知'; }
}

function settingsCollectAiTierPayload(tier) {
  var hostEl = document.getElementById('settingsAi_' + tier + '_host');
  var modelEl = document.getElementById('settingsAi_' + tier + '_model');
  var keyEl = document.getElementById('settingsAi_' + tier + '_apiKey');
  var maxEl = document.getElementById('settingsAi_' + tier + '_maxTokens');
  var clearEl = document.getElementById('settingsAi_' + tier + '_clearKey');

  var host = (hostEl && hostEl.value || '').trim();
  var model = (modelEl && modelEl.value || '').trim();
  var apiKey = (keyEl && keyEl.value || '').trim();
  var maxTokensRaw = (maxEl && maxEl.value || '').trim();
  var clearKey = !!(clearEl && clearEl.checked);

  if (!host) throw new Error('服务地址不能为空');
  if (!model) throw new Error('模型名称不能为空');

  var payload = { host: host, model: model };
  if (maxTokensRaw) {
    var maxTokens = parseInt(maxTokensRaw, 10);
    if (!Number.isFinite(maxTokens) || maxTokens < 1 || maxTokens > 1000000) {
      throw new Error('最大回复长度必须是 1 到 1000000 之间的整数');
    }
    payload.max_tokens = maxTokens;
  }
  if (clearKey) {
    payload.clear_api_key = true;
  } else if (apiKey) {
    payload.api_key = apiKey;
  }
  return payload;
}

// Hotkey recorder — captures modifier+key combo
var _hotkeyCapturing = false;
function settingsStartHotkeyCapture() {
  if (_hotkeyCapturing) return;
  _hotkeyCapturing = true;
  var input = document.getElementById('settingsSysPetHotkey');
  var btn = document.getElementById('settingsSysPetHotkeyBtn');
  if (!input || !btn) return;
  var prevValue = input.value;
  input.value = '按下快捷键…';
  input.style.borderColor = '#FFB7C5';
  btn.textContent = '取消';
  btn.onclick = function() { settingsStopHotkeyCapture(prevValue); };

  function onKeyDown(e) {
    e.preventDefault();
    e.stopPropagation();
    // Ignore standalone modifier keys — wait for a non-modifier key
    if (['Control', 'Shift', 'Alt', 'Meta', 'CapsLock', 'NumLock', 'ScrollLock'].indexOf(e.key) >= 0) return;

    var parts = [];
    var isMac = navigator.platform && navigator.platform.toUpperCase().indexOf('MAC') >= 0;
    if (e.ctrlKey)  parts.push(isMac ? 'ctrl' : 'ctrl');
    if (e.altKey)   parts.push(isMac ? 'option' : 'alt');
    if (e.shiftKey) parts.push('shift');
    if (e.metaKey)  parts.push(isMac ? 'cmd' : 'meta');
    // Must have at least one modifier
    if (parts.length === 0) {
      input.value = '需要至少一个修饰键';
      setTimeout(function() { input.value = '按下快捷键…'; }, 1200);
      return;
    }
    parts.push(e.key.length === 1 ? e.key.toLowerCase() : e.key.toLowerCase());
    var combo = parts.join('+');
    document.removeEventListener('keydown', onKeyDown, true);
    _hotkeyCapturing = false;
    input.value = combo;
    input.style.borderColor = '';
    btn.textContent = '录制快捷键';
    btn.onclick = function() { settingsStartHotkeyCapture(); };
  }

  document.addEventListener('keydown', onKeyDown, true);
}

function settingsStopHotkeyCapture(restoreValue) {
  _hotkeyCapturing = false;
  var input = document.getElementById('settingsSysPetHotkey');
  var btn = document.getElementById('settingsSysPetHotkeyBtn');
  if (input) { input.value = restoreValue || ''; input.style.borderColor = ''; }
  if (btn) { btn.textContent = '录制快捷键'; btn.onclick = function() { settingsStartHotkeyCapture(); }; }
  // Remove any lingering listener (safe to call even if not present)
  try { document.removeEventListener('keydown', arguments.callee._listener, true); } catch(e) {}
}

// ── Hotkey display + recording helpers ─────────────────────────────────
// Internal spec format is lowercase + separated by "+" (e.g. "cmd+option+m").
// User-visible format prefers Mac-native symbols (⌘⌥⌃⇧) or labels
// (Option instead of "alt"). Same format function is used by pet.html
// for the pet toolbar hint.
var _IS_MAC_UA = navigator.platform && navigator.platform.toUpperCase().indexOf('MAC') >= 0;

function _formatHotkeyDisplay(spec) {
  if (!spec) return '';
  var parts = String(spec).toLowerCase().split('+');
  var mods = [], key = '';
  for (var i = 0; i < parts.length; i++) {
    var p = parts[i].trim();
    if (['cmd', 'command', 'meta'].indexOf(p) >= 0)       mods.push(_IS_MAC_UA ? '⌘' : 'Win');
    else if (['ctrl', 'control'].indexOf(p) >= 0)         mods.push(_IS_MAC_UA ? '⌃' : 'Ctrl');
    else if (p === 'shift')                               mods.push(_IS_MAC_UA ? '⇧' : 'Shift');
    else if (['alt', 'option', 'opt'].indexOf(p) >= 0)    mods.push(_IS_MAC_UA ? '⌥' : 'Alt');
    else                                                  key = p.toUpperCase();
  }
  return _IS_MAC_UA ? (mods.join('') + key) : mods.concat(key).join('+');
}

// Record the next keydown as the new hotkey.
// Single-use listener — automatically detaches after capture or Esc.
var _hotkeyRecordHandler = null;
function _recordHotkey(btn) {
  var display = document.getElementById('settingsSysPetHotkeyDisplay');
  var hidden = document.getElementById('settingsSysPetHotkey');
  if (!display || !hidden) return;
  var origBtnText = btn.textContent;
  btn.textContent = '按键中... (Esc 取消)';
  btn.disabled = true;
  display.value = '请按下组合键';
  display.style.color = 'var(--airi-pink)';

  var cleanup = function() {
    btn.textContent = origBtnText;
    btn.disabled = false;
    display.style.color = '';
    window.removeEventListener('keydown', _hotkeyRecordHandler, true);
    _hotkeyRecordHandler = null;
  };

  _hotkeyRecordHandler = function(e) {
    e.preventDefault();
    e.stopPropagation();
    if (e.key === 'Escape') {
      display.value = _formatHotkeyDisplay(hidden.value);
      cleanup();
      return;
    }
    // Ignore bare modifier keys — wait for an actual letter/number/fn key.
    if (['Meta', 'Control', 'Shift', 'Alt', 'CapsLock'].indexOf(e.key) >= 0) return;

    var parts = [];
    if (e.metaKey)  parts.push(_IS_MAC_UA ? 'cmd' : 'cmd');   // Win key maps to cmd internally
    if (e.ctrlKey)  parts.push('ctrl');
    if (e.altKey)   parts.push(_IS_MAC_UA ? 'option' : 'alt');
    if (e.shiftKey) parts.push('shift');

    // Require at least one modifier (bare letters would conflict with typing).
    if (parts.length === 0) {
      display.value = _IS_MAC_UA
        ? '需要带修饰键（如 ⌘ / ⌃ / ⌥ / ⇧）'
        : '需要带修饰键（如 Ctrl / Alt / Shift / Win）';
      return; // keep listening
    }

    var keyName = e.key.length === 1 ? e.key.toLowerCase() : e.key.toLowerCase();
    // Tauri global_shortcut uses "Space", "Enter", etc. for named keys;
    // our normalize_hotkey() accepts either. Single letters are fine lower-case.
    parts.push(keyName);

    var spec = parts.join('+');
    hidden.value = spec;
    display.value = _formatHotkeyDisplay(spec);
    cleanup();
  };
  window.addEventListener('keydown', _hotkeyRecordHandler, true);
}

function _resetHotkey() {
  var def = _IS_MAC_UA ? 'cmd+option+m' : 'ctrl+alt+m';
  var display = document.getElementById('settingsSysPetHotkeyDisplay');
  var hidden = document.getElementById('settingsSysPetHotkey');
  if (display) display.value = _formatHotkeyDisplay(def);
  if (hidden) hidden.value = def;
}

async function settingsSaveSystem() {
  try {
    // Pet collapse delay: same per-device-localStorage treatment as hotkey.
    // The input only exists in desktop mode — mobile skips this entirely.
    var delayInputEl = document.getElementById('settingsSysPetCollapseDelay');
    var delayMs = null;
    if (delayInputEl) {
      var delayInput = delayInputEl.value || '4';
      delayMs = Math.max(Math.round(parseFloat(delayInput) * 1000), 1000);
      if (isNaN(delayMs)) delayMs = 4000;
    }
    var screenshotInterval = parseInt((document.getElementById('settingsSysAutoScreenshotInterval') || {}).value || '30', 10);
    if (isNaN(screenshotInterval)) screenshotInterval = 30;
    var ssEnabledCb = document.getElementById('settingsSysScreenshotEnabled');
    var ssEnabled = ssEnabledCb ? ssEnabledCb.checked : false;

    // Pet hotkey: 在 Mac DMG (MiruDesktop bridge) 下,跟其他 per-device 字段
    // 一起写到 LOCAL user_settings.json,这样 pet.html 启动主动拉就拿得到。
    // 老逻辑写 localStorage 已废弃 (不同 origin 不共享, pet.html 永远读不到)。
    var hotkeyInput = document.getElementById('settingsSysPetHotkey');
    var hotkeyVal = hotkeyInput && hotkeyInput.value ? hotkeyInput.value.trim() : '';

    const payload = {
      auto_screenshot_interval: screenshotInterval,
    };
    if (hotkeyVal) payload.pet_hotkey = hotkeyVal;
    if (delayMs !== null) payload.pet_collapse_delay = delayMs;
    // On Android APK the switch controls MediaProjection (not backend desktop
    // sensor), so don't clobber backend screenshot_enabled from here.
    var isAndroidAPK = (typeof window.MiruAndroid !== 'undefined'
        && typeof window.MiruAndroid.requestScreenCapture === 'function');
    if (!isAndroidAPK) {
      payload.screenshot_enabled = ssEnabled;
    }

    // _saveUserSettings auto-routes:
    //   - Mac DMG → window.MiruDesktop bridge → LOCAL Flask user_settings.json
    //   - PWA / Android → fetch /api/user-settings (VPS or current origin)
    const data = await _saveUserSettings(payload);
    if (!data.ok) {
      settingsShowFlash(data.error || '系统设置保存失败', 'error');
      return;
    }
    // Real-time push to desktop pet (separate Tauri webview, won't see the
    // LOCAL write directly): VPS-side SSE 'pet_runtime_changed' tells the pet
    // to invoke update_global_hotkey immediately. Run-time only;
    // pet.html ALSO pulls /api/user-settings on launch as a separate path.
    if ((hotkeyVal || delayMs !== null) && (!_isMobile && !window.MiruAndroid)) {
      try {
        fetch('/api/pet-runtime-broadcast', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            pet_hotkey: hotkeyVal || undefined,
            pet_collapse_delay: delayMs !== null ? delayMs : undefined,
          }),
        }).catch(function(){});
      } catch (e) {}
    }
    // Sync screenshot interval to Android if running in APK
    if (window.MiruAndroid && typeof window.MiruAndroid.setScreenCaptureInterval === 'function') {
      window.MiruAndroid.setScreenCaptureInterval(screenshotInterval);
    }
    settingsShowFlash('系统设置已保存');
    // Refresh only system panel data
    try {
      appConfigState = await _loadUserSettings();
      settingsRenderSystemPanel();
    } catch(e) {}
  } catch (err) {
    settingsShowFlash('系统设置保存失败: ' + err.message, 'error');
  }
}

function _openPrivacyModal() {
  // Remove existing modal if any
  var existing = document.getElementById('privacyModal');
  if (existing) existing.remove();

  var overlay = document.createElement('div');
  overlay.id = 'privacyModal';
  overlay.style.cssText = 'position:fixed;inset:0;z-index:9998;background:var(--bg-base,#FFF9F2);overflow-y:auto;-webkit-overflow-scrolling:touch;';

  // Header bar with back button
  var header = document.createElement('div');
  header.style.cssText = 'position:sticky;top:0;z-index:1;background:rgba(255,249,242,0.92);backdrop-filter:blur(12px);border-bottom:1px solid rgba(58,46,42,0.08);display:flex;align-items:center;padding:14px 16px;';
  var backBtn = document.createElement('button');
  backBtn.textContent = '← 返回设置';
  backBtn.style.cssText = 'background:none;border:none;color:var(--text-secondary,#6B5D54);font-size:15px;cursor:pointer;padding:4px 8px;';
  backBtn.onclick = function() { overlay.remove(); };
  header.appendChild(backBtn);
  overlay.appendChild(header);

  // Loading state
  var body = document.createElement('div');
  body.style.cssText = 'max-width:720px;margin:0 auto;padding:24px 16px 80px;';
  body.innerHTML = '<div style="text-align:center;padding:40px 0;color:var(--text-muted,#9A8B7A)">加载中...</div>';
  overlay.appendChild(body);
  document.body.appendChild(overlay);

  fetch('/privacy').then(function(res) {
    if (!res.ok) throw new Error(res.status);
    return res.text();
  }).then(function(html) {
    // Extract <main>...</main> content from the full page
    var match = html.match(/<main[^>]*>([\s\S]*?)<\/main>/i);
    if (match) {
      body.innerHTML = match[1];
    } else {
      // Fallback: extract <body> content, strip nav
      var bodyMatch = html.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
      body.innerHTML = bodyMatch ? bodyMatch[1] : html;
    }
  }).catch(function(err) {
    body.innerHTML = '<div style="text-align:center;padding:40px 0;color:#e57373">加载失败: ' + err.message + '</div>';
  });
}

async function settingsExportMyData() {
  try {
    settingsShowFlash('准备导出...');
    const res = await fetch('/api/auth/export');
    if (!res.ok) {
      settingsShowFlash('导出失败: ' + res.status, 'error');
      return;
    }
    // Stream to file via blob
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'miru-export-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function() { URL.revokeObjectURL(url); }, 2000);

async function settingsDeleteAccount() {
  // Two-stage confirmation — plain confirm + magic string
  if (!await _confirm('确认删除账号？\n\n这会永久删除：\n• 所有聊天记录、证据卡、子卡片、记忆树\n• Miru 对你的所有情绪记录、人际关系数据\n• 你上传的所有图片和个性化 Live2D 模型\n• 你当前的邀请码会被吊销，无法再次登录\n\n删除后无法恢复。',
                      { danger: true, confirmText: '继续' })) {
    return;
  }
  const magic = await _prompt('请输入大写 DELETE 确认删除：');
  if ((magic || '').trim() !== 'DELETE') {
    settingsShowFlash('二次确认未通过，已取消。', 'error');
    return;
  }
  try {
    settingsShowFlash('正在删除账号...');
    const res = await fetch('/api/auth/account', {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ confirm: 'DELETE', reason: 'user_self_delete' })
    });
    const data = await res.json();
    if (!res.ok || !data.ok) {
      settingsShowFlash(data.error || '删除失败', 'error');
      return;
    }
    // Clear everything locally and bounce to landing
    try { localStorage.clear(); } catch(e) {}
    try { sessionStorage.clear(); } catch(e) {}
    try {
      if (window.MiruAndroid && typeof window.MiruAndroid.clearCredentials === 'function') {
        window.MiruAndroid.clearCredentials();
      }
    } catch(e) {}
    document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:var(--text-muted);font-size:18px;flex-direction:column;gap:16px;text-align:center;padding:20px;"><div style="font-size:28px;">👋</div><div>你的账号已删除，所有数据已清空。</div><div style="font-size:13px;color:var(--text-muted);opacity:0.7;">感谢你曾让 Miru 陪伴过一段时间。</div></div>';
    setTimeout(function() { window.location.href = '/'; }, 2500);
  } catch (err) {
    settingsShowFlash('删除失败: ' + err.message, 'error');
  }
}

async function executeClearAllRecords() {
  const input = document.getElementById('clearAllConfirmInput');
  const confirmText = (input && input.value ? input.value : '').trim();
  if (confirmText !== '清空全部') {
    settingsShowFlash('二次确认未通过，已取消操作。', 'error');
    return;
  }

  const settingsBtn = document.getElementById('settingsClearAllBtn');
  const submitBtn = document.getElementById('clearAllConfirmSubmitBtn');
  if (settingsBtn) {
    settingsBtn.disabled = true;
    settingsBtn.textContent = '清空中...';
  }
  if (submitBtn) submitBtn.disabled = true;

  try {
    const res = await fetch('/api/system/clear-all-records', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ confirm_text: confirmText }),
    });

      settingsShowFlash(data.error || '清空失败', 'error');
      if (settingsBtn) {
        settingsBtn.disabled = false;
        settingsBtn.textContent = '一键清空所有记录';

function _miruLocalDateKey(date) {
  var d = date || new Date();
  return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
}

const MOOD_COLORS = {
  joyful: '#FFB347', excited: '#FF6B6B', proud: '#DDA0DD', relieved: '#87CEEB',
  grateful: '#98D8C8', relaxed: '#B8D4E3', amused: '#FFD700',
  frustrated: '#CD5C5C', anxious: '#C0A0C0', tired: '#A0A0A0', sad: '#6B8E9B',
  angry: '#DC3545', hurt: '#8B668B', bored: '#C8C8C8', lonely: '#7B9BA6',
  focused: '#6C9BD2', neutral: '#AAAAAA', uncertain: '#CCCCCC',
};

function _buildEmotionCalendarHtml(month, dayData) {
  var parts = month.split('-');
  var year = parseInt(parts[0]), mon = parseInt(parts[1]);
  var today = _miruLocalDateKey();
  var prevM = mon === 1 ? (year - 1) + '-12' : year + '-' + String(mon - 1).padStart(2, '0');
  var nextM = mon === 12 ? (year + 1) + '-01' : year + '-' + String(mon + 1).padStart(2, '0');
  var isCurrentMonth = month === today.slice(0, 7);
  var totalDays = Object.keys(dayData).length;

  // ── v2: dark glass panel wraps the whole calendar view ─────────────
  var h = '<div class="emo-panel">';
  h += '<div class="emo-section-h">' +
       '<span class="title">情绪日历</span>' +
       '<span class="spacer"></span>' +
       '<span class="meta">' + year + '年' + mon + '月</span>' +
       '</div>';
  h += '<div class="emo-subtitle">每天一个小色点，颜色 = dominant mood，亮度 = 当天的能量。点哪天看哪天的情绪河。</div>';

  // Month nav
  h += '<div class="emo-cal-h">' +
       '<button class="nav-btn" onclick="navEmotionCurve(\'' + prevM + '\')" aria-label="prev">&lsaquo;</button>' +
       '<span class="month-label">' + year + ' 年 ' + mon + ' 月</span>' +
       '<button class="nav-btn" onclick="navEmotionCurve(\'' + nextM + '\')"' +
       (isCurrentMonth ? ' disabled' : '') + ' aria-label="next">&rsaquo;</button>' +
       '</div>';

  // Weekday headers
  var wds = ['一','二','三','四','五','六','日'];
  h += '<div class="emo-cal-grid">';
  wds.forEach(function(d) { h += '<div class="wd">' + d + '</div>'; });
  h += '</div>';

  // Calendar cells
  var firstDay = new Date(year, mon - 1, 1);
  var startDow = (firstDay.getDay() + 6) % 7; // Mon=0
  var daysInMonth = new Date(year, mon, 0).getDate();

  h += '<div class="emo-cal-grid" style="margin-top:6px">';
  for (var e = 0; e < startDow; e++) h += '<div class="emo-cal-cell empty"></div>';
  for (var d = 1; d <= daysInMonth; d++) {
    var dateStr = year + '-' + String(mon).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    var info = dayData[dateStr];
    var isToday = dateStr === today;
    var isFuture = dateStr > today;
    var classes = 'emo-cal-cell';
    if (isToday) classes += ' today';
    if (isFuture) classes += ' future';
    if (!info && !isToday) classes += ' empty';

    var onClick = info ? ' onclick="_emotionDayDetail(\'' + dateStr + '\')"' : '';
    h += '<div class="' + classes + '"' + onClick + '>';
    h += '<div class="day-num">' + d + '</div>';
    if (info) {
      var color = MOOD_COLORS[info.dominant_mood] || '#AAAAAA';
      h += '<div class="mood-dot" style="background:' + color + ';color:' + color + '" ' +
           'title="' + escapeHtml(info.dominant_mood) + ' (' + info.count + '条)"></div>';
    }
    h += '</div>';
  }
  h += '</div>';

  // Summary stats for the month
  if (totalDays > 0) {
    var allMoods = {};
    var allValences = [];
    Object.values(dayData).forEach(function(day) {
      allMoods[day.dominant_mood] = (allMoods[day.dominant_mood] || 0) + 1;
      allValences.push(day.avg_valence);
    });
    var sorted = Object.entries(allMoods).sort(function(a,b){ return b[1] - a[1]; });
    var avgV = allValences.reduce(function(a,b){ return a+b; }, 0) / allValences.length;
    var avgVColor = avgV > 0.1 ? '#FFB7C5' : avgV < -0.1 ? '#9F7BB8' : '#AAA';

    h += '<div class="emo-section-divider"></div>';
    h += '<div class="emo-section-h">' +
         '<span class="title">本月概览</span>' +
         '<span class="spacer"></span>' +
         '<span class="meta">' + totalDays + ' 天有记录</span>' +
         '</div>';
    h += '<div class="emo-chips" style="margin-top:10px">';
    sorted.slice(0, 6).forEach(function(pair) {
      var color = MOOD_COLORS[pair[0]] || '#AAA';
      h += '<span class="emo-chip"><i style="background:' + color + '"></i>' +
           escapeHtml(pair[0]) + ' <span class="pct">' + pair[1] + '天</span></span>';
    });
    h += '</div>';
    h += '<div style="margin-top:10px;font-size:12px;color:rgba(255,255,255,0.45)">' +
         '月均 valence: <b style="color:' + avgVColor + '">' +
         (avgV >= 0 ? '+' : '') + avgV.toFixed(2) + '</b></div>';
  }

  // "Today" quick link
  h += '<div style="text-align:center;margin-top:20px">';
  h += '<button class="emo-cta-btn" onclick="_emotionDayDetail(\'' + today + '\')">查看今天详情 →</button>';
  h += '</div>';

  h += '</div>'; // /.emo-panel
  return h;
}
